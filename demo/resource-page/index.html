<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NousDesk · 资源页 · 02 落地稿</title>
<style>
@font-face { font-family: Inter; src: url(fonts/inter-400.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: JBMono; src: url(fonts/jetbrainsmono-400.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: #0a0b0c; color: #e7e9ea;
  font: 400 12.5px/1.5 Inter, "Noto Sans CJK SC", "Source Han Sans SC", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; display: flex; overflow: hidden;
}

/* ── 挑方案的那一列 ─────────────────────────────────────────── */
.picker { width: 262px; flex: 0 0 262px; height: 100vh; overflow: auto; background: #111315;
  border-right: 1px solid #202428; padding: 22px 16px 18px; }
.picker::-webkit-scrollbar { width: 0; }
.picker h1 { font-size: 13px; font-weight: 600; }
.picker .sub { font-size: 10.5px; line-height: 1.75; color: #7c848a; margin: 7px 0 16px; }
.plist { display: flex; flex-direction: column; gap: 1px; }
.plist button { display: flex; align-items: baseline; gap: 9px; padding: 7px 8px; border: 0;
  border-left: 2px solid transparent; background: transparent; color: #98a0a6; font: inherit;
  text-align: left; cursor: pointer; }
.plist button:hover { color: #e7e9ea; background: #171a1d; }
.plist button.on { border-left-color: #07c160; color: #fff; background: #1b1f22; }
.plist b { font: 500 9.5px/1 JBMono, monospace; color: #5f676d; min-width: 18px; }
.plist button.on b { color: #07c160; }
.plist span { font-size: 11px; line-height: 1.45; }
.pnote { margin-top: 14px; padding-top: 13px; border-top: 1px solid #22262a;
  font-size: 10.5px; line-height: 1.85; color: #8a9298; }
.pnote b { display: block; color: #e7e9ea; font-weight: 600; margin-bottom: 5px; }
.pnote em { font-style: normal; color: #b9c0c5; }
.pnote .cost { color: #c9a227; }
.skinbar { margin-top: 14px; padding-top: 12px; border-top: 1px solid #22262a;
  display: flex; align-items: center; gap: 6px; font-size: 10px; color: #7c848a; }
.skinbar button { height: 22px; padding: 0 9px; border: 1px solid #22262a; background: transparent;
  color: #98a0a6; font: inherit; font-size: 10px; border-radius: 5px; cursor: pointer; }
.skinbar button:hover { color: #e7e9ea; border-color: #343a3f; }
.skinbar button.on { background: #1b1f22; color: #fff; border-color: #3a3f44; }
.pfoot { margin-top: 14px; padding-top: 11px; border-top: 1px solid #22262a;
  font-size: 9.5px; line-height: 1.9; color: #5f676d; }
.pfoot code { font-family: JBMono, monospace; color: #8a9298; }
.pfoot .hint { color: #b9c0c5; }

/* ── 舞台 ──────────────────────────────────────────────────── */
.stage { flex: 1; height: 100vh; display: grid; place-items: center; overflow: hidden;
  background: radial-gradient(1300px 760px at 58% 42%, #15181a 0%, #0a0b0c 72%); padding: 22px; }
.scaler { position: relative; }
.app { position: absolute; top: 0; left: 0; width: 1280px; height: 800px; display: flex;
  overflow: hidden; transform-origin: top left;
  box-shadow: 0 34px 100px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.05); }

/* ── 皮（Palette::DEFAULT / Palette::AMBER）────────────────────── */
.app[data-skin="default"] {
  --sidebar:#2e2e2e; --sidebar-hover:#3a3a3a; --sidebar-open:#3f3f3f; --idle:#9a9a9a;
  --list:#f7f7f7; --chat:#ededed; --panel:#fff; --panel2:#fafafa; --surface:#f6f6f6;
  --ink:#1a1a1a; --ink2:#333; --muted:#999; --faint:#aaa;
  --line:#e6e6e6; --line-2:#e2e2e2; --line-soft:#eee;
  --accent:#07c160; --accent-h:#06ad56; --accent-soft:#e8f7ee; --accent-fg:#0a7a3f;
  --accent-tint:#07c16022; --on-accent:#fff;
  --danger:#d32f2f; --danger-soft:#fff1f0; --danger-fg:#c0392b;
  --warn:#c77700; --warn-soft:#fff8ee; --ok:#079c50; --ok-fg:#2e7d32;
  --link:#0b6bcb; --hover:#f2f2f2; --selected:#d9d9d9; --disabled:#b2b2b2;
  --avatar:#7ba7d7; --code:#f6f6f4; --r:1;
}
.app[data-skin="amber"] {
  --sidebar:#090806; --sidebar-hover:#17150f; --sidebar-open:#211d15; --idle:#6f6656;
  --list:#0d0c0a; --chat:#0d0c0a; --panel:#12110e; --panel2:#17150f; --surface:#17150f;
  --ink:#f0e9dc; --ink2:#d6c9ae; --muted:#b4a88e; --faint:#968c78;
  --line:#251f18; --line-2:#322a1f; --line-soft:#1c1712;
  --accent:#e8a33d; --accent-h:#f2b455; --accent-soft:#2a2113; --accent-fg:#e8a33d;
  --accent-tint:#e8a33d22; --on-accent:#14110c;
  --danger:#d8705f; --danger-soft:#2a1712; --danger-fg:#d8705f;
  --warn:#e8a33d; --warn-soft:#2a2113; --ok:#7fb489; --ok-fg:#7fb489;
  --link:#e8a33d; --hover:#17150f; --selected:#211d15; --disabled:#6b6354;
  --avatar:#e8a33d; --code:#17150f; --r:.375;
}

/* ── 通用零件（跟触发器工作台那套方言一致）────────────────────── */
.app { background: var(--panel); color: var(--ink); font-size: 12.5px; }
.mono { font-family: JBMono, monospace; font-variant-numeric: tabular-nums; }
.grow { flex: 1; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7;
  stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
.btn { height: 28px; padding: 0 11px; border: 1px solid var(--line); background: var(--panel);
  color: var(--ink2); font: inherit; font-size: 11.5px; border-radius: calc(6px * var(--r));
  cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn .ic { width: 14px; height: 14px; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 500; }
.btn.pri:hover { background: var(--accent-h); border-color: var(--accent-h); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--hover); color: var(--ink2); }
.btn.sm { height: 24px; padding: 0 9px; font-size: 11px; border-radius: calc(5px * var(--r)); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 32%, transparent); }
.btn.danger:hover { background: var(--danger-soft); }
.btn:disabled { opacity: .5; cursor: default; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 19px; padding: 0 6px;
  border-radius: calc(4px * var(--r)); background: var(--surface); color: var(--muted);
  font-size: 10.5px; white-space: nowrap; }
.chip.line { background: transparent; border: 1px solid var(--line); }
.chip.accent { background: var(--accent-soft); color: var(--accent-fg); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--danger-soft); color: var(--danger-fg); }
.chip.mono { font-family: JBMono, monospace; font-size: 9.5px; letter-spacing: -.1px; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex: 0 0 6px; }
.dot.warn { background: var(--warn); }
.dot.bad { background: var(--danger); }
.dot.off { background: var(--faint); }
.kbd { display: inline-flex; align-items: center; height: 17px; padding: 0 4px; border: 1px solid var(--line);
  border-bottom-width: 2px; border-radius: 4px; background: var(--panel);
  font: 9.5px JBMono, monospace; color: var(--muted); }
.scroll { overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
.scroll::-webkit-scrollbar { width: 8px; height: 8px; }
.scroll::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }
.scroll::-webkit-scrollbar-track { background: transparent; }

/* ── 图标条 ────────────────────────────────────────────────── */
.rail { width: 60px; flex: 0 0 60px; height: 100%; background: var(--sidebar);
  display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 6px; }
.rbtn { width: 40px; height: 40px; display: grid; place-items: center; border: 0;
  border-radius: calc(8px * var(--r)); background: transparent; color: var(--idle);
  cursor: pointer; flex: 0 0 40px; }
.rbtn:hover { background: var(--sidebar-hover); color: #d6d6d6; }
.rbtn.on { color: var(--accent); }
.rbtn.on.open { background: var(--sidebar-open); }
.rbtn .ic { width: 22px; height: 22px; }
.rsp { flex: 1; }

/* ── 三栏 ──────────────────────────────────────────────────── */
.page { flex: 1; display: flex; min-width: 0; height: 100%; }

.tree { width: 248px; flex: 0 0 248px; display: flex; flex-direction: column;
  background: var(--panel2); border-right: 1px solid var(--line-soft); min-width: 0; }
.tree.narrow { width: 200px; flex: 0 0 200px; }
.tree-head { display: flex; align-items: center; gap: 6px; padding: 13px 12px 8px;
  border-bottom: 1px solid var(--line-soft); }
.tree-head h2 { font-size: 11.5px; font-weight: 400; color: var(--ink2); }
.tree-head .n { font-size: 11px; color: var(--muted); }
.tree-body { flex: 1; padding: 6px; }
.cat { display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px;
  border-radius: calc(5px * var(--r)); color: var(--ink2); font-size: 12px; cursor: pointer; }
.cat:hover { background: var(--line-soft); }
.cat.on { background: var(--accent-soft); color: var(--accent-fg); }
.cat .tw { width: 10px; color: var(--faint); display: grid; place-items: center; flex: 0 0 10px; }
.cat .tw .ic { width: 9px; height: 9px; }
.cat .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat .n { margin-left: auto; font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cat.on .n { color: var(--accent-fg); opacity: .8; }
.cat.zero { color: var(--faint); }
.gsep { padding: 12px 8px 4px; font-size: 10px; color: var(--faint); letter-spacing: .06em; }
.tree-foot { border-top: 1px solid var(--line-soft); padding: 9px 12px 14px; font-size: 10.5px;
  line-height: 1.6; color: var(--muted); }
.tree-foot .frow { display: flex; align-items: center; gap: 5px; }
.tree-foot .head { font-family: JBMono, monospace; font-size: 9.5px; color: var(--faint); }
.tree-foot .linkbtn { border: 0; background: none; padding: 0; font: inherit; color: var(--link);
  cursor: pointer; font-size: 10.5px; }
.tree-foot .linkbtn:hover { text-decoration: underline; }

/* 段按钮（一个入口下的两三段）*/
/* 段按钮（一个入口下的两三段）*/
.subseg { display: flex; gap: 4px; margin: -4px 8px 8px; }
.subseg button { flex: 1; height: 21px; border: 1px solid var(--line); background: transparent;
  border-radius: calc(5px * var(--r)); font: inherit; font-size: 10px; color: var(--muted); cursor: pointer; }
.subseg button.on { background: var(--accent-soft); border-color: transparent; color: var(--accent-fg); }
.subseg button:hover:not(.on) { background: var(--line-soft); }
.placeholder { flex: 1; display: grid; place-items: center; background: var(--chat); }
.ph-card { width: 340px; text-align: center; color: var(--muted); }
.ph-card .ic { width: 26px; height: 26px; color: var(--faint); }
.ph-card h3 { font-size: 15px; font-weight: 500; color: var(--ink2); margin: 10px 0 6px; }
.ph-card p { font-size: 11.5px; line-height: 1.8; }
.segs { display: flex; gap: 2px; margin: 9px 8px 8px; padding: 3px; border-radius: calc(9px * var(--r));
  background: var(--line); }
.segs button { flex: 1 1 0; min-width: 0; padding: 4px 2px; border: 0; border-radius: calc(7px * var(--r));
  background: transparent; font: inherit; font-size: 10.5px; color: var(--muted); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 1px; }
.segs button .n { font-size: 9.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.segs button.on { background: var(--panel); color: var(--ink); }
.segs button.on .n { color: var(--ok-fg); }
.segs button:hover:not(.on) { background: color-mix(in srgb, var(--panel) 55%, transparent); }

/* 列表列 */
.list { width: 300px; flex: 0 0 300px; display: flex; flex-direction: column;
  background: var(--list); border-right: 1px solid var(--line); min-width: 0; }
.list.narrow { width: 280px; flex: 0 0 280px; }
.list-head { padding: 13px 14px 6px; }
.list-title { display: flex; align-items: baseline; gap: 6px; }
.list-title h3 { font-size: 15px; font-weight: 400; }
.list-title .n { font-size: 12px; color: var(--muted); }
.list-title .acts { margin-left: auto; display: flex; gap: 4px; align-items: center; }
.filters { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.filters .chip { cursor: pointer; }
.filters .chip .ic { width: 10px; height: 10px; }
.search { display: flex; align-items: center; gap: 7px; height: 27px; margin-top: 9px;
  padding: 0 9px; border: 1px solid transparent; border-radius: calc(6px * var(--r));
  background: var(--surface); color: var(--muted); }
.search:focus-within { border-color: var(--line-2); background: var(--panel); }
.search .ic { width: 13px; height: 13px; color: var(--faint); }
.search input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent;
  font: inherit; font-size: 11.5px; color: var(--ink); }
.search input::placeholder { color: var(--faint); }
.list-body { flex: 1; }
.row { position: relative; display: flex; gap: 10px; padding: 10px; border-bottom: 1px solid var(--line-2);
  cursor: pointer; }
.row:hover { background: var(--line-soft); }
.row.on { background: var(--accent-soft); }
.row.on::before { content: ""; position: absolute; left: 0; top: 7px; bottom: 7px; width: 2px;
  border-radius: 1px; background: var(--accent); }
.row .av { width: 36px; height: 36px; flex: 0 0 36px; border-radius: calc(6px * var(--r));
  background: var(--avatar); color: #fff; display: grid; place-items: center; font-size: 15px; }
.app[data-skin="amber"] .row .av { color: var(--panel); }
.row .av.off { background: var(--disabled); color: var(--faint); }
.row .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; overflow: hidden; }
.row .nm { display: flex; align-items: center; gap: 5px; }
.row .nm .t { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .nm .t.mono { font-size: 12px; }
.row .sum { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; }
.row .meta { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.row .meta .chip { height: 17px; font-size: 10px; }
.note { padding: 20px 16px; font-size: 11.5px; line-height: 1.8; color: var(--muted); }

/* 详情 */
.detail { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--panel); }
.det-head { padding: 13px 20px 11px; border-bottom: 1px solid var(--line-soft); }
.det-head .top { display: flex; align-items: center; gap: 8px; }
.det-head h2 { font-size: 16px; font-weight: 500; letter-spacing: -.2px; }
.det-head .sub { margin-top: 4px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  font-size: 11px; color: var(--muted); }
.det-head .acts { margin-left: auto; display: flex; gap: 5px; align-items: center; }
.det-body { flex: 1; padding: 16px 20px 40px; }
.det-inner { max-width: 660px; }

.banner { display: flex; gap: 9px; padding: 10px 12px; border-radius: calc(8px * var(--r));
  background: var(--accent-soft); color: var(--accent-fg); font-size: 11.5px; line-height: 1.65;
  margin-bottom: 14px; }
.banner .ic { width: 15px; height: 15px; margin-top: 1px; }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.banner.bad { background: var(--danger-soft); color: var(--danger-fg); }
.banner b { font-weight: 600; }
.banner .mono { font-size: 10.5px; word-break: break-all; }

.metas { display: grid; grid-template-columns: 74px 1fr; gap: 6px 10px; margin: 0 0 18px;
  font-size: 11.5px; }
.metas dt { color: var(--faint); }
.metas dd { color: var(--ink2); min-width: 0; overflow-wrap: anywhere; }
.metas dd .mono { font-size: 10.5px; color: var(--ink2); }

.files { display: flex; flex-direction: column; margin: 0 0 18px; border: 1px solid var(--line-soft);
  border-radius: calc(7px * var(--r)); overflow: hidden; }
.file { display: flex; align-items: center; gap: 8px; padding: 0 10px; height: 30px;
  font-size: 11.5px; background: var(--panel); cursor: pointer; }
.file + .file { border-top: 1px solid var(--line-soft); }
.file:hover { background: var(--hover); }
.file .ic { width: 13px; height: 13px; color: var(--faint); }
.file .p { font-family: JBMono, monospace; font-size: 11px; }
.file .sz { margin-left: auto; font-family: JBMono, monospace; font-size: 10px; color: var(--faint); }
.file.on { background: var(--accent-soft); }
.file.on .p { color: var(--accent-fg); }

.sec-title { display: flex; align-items: center; gap: 8px; font-size: 10px; letter-spacing: .06em;
  color: var(--faint); margin: 20px 0 9px; }
.sec-title::after { content: ""; flex: 1; height: 1px; background: var(--line-soft); }

.prose { font-size: 12.5px; line-height: 1.78; color: var(--ink2); }
.prose h1 { font-size: 17px; font-weight: 500; color: var(--ink); margin: 0 0 8px; letter-spacing: -.2px; }
.prose h2 { font-size: 12.5px; font-weight: 600; color: var(--ink); margin: 16px 0 5px; }
.prose h3 { font-size: 12px; font-weight: 600; color: var(--ink2); margin: 12px 0 4px; }
.prose p { margin: 0 0 8px; }
.prose ul, .prose ol { margin: 0 0 9px; padding-left: 18px; }
.prose li { margin-bottom: 3px; }
.prose li::marker { color: var(--faint); }
.prose code { font-family: JBMono, monospace; font-size: 11px; background: var(--code);
  padding: 1px 4px; border-radius: 3px; }
.prose pre { font-family: JBMono, monospace; font-size: 10.5px; line-height: 1.7; background: var(--code);
  padding: 10px 12px; border-radius: calc(6px * var(--r)); overflow-x: auto; margin: 0 0 10px; }
.prose pre code { background: none; padding: 0; font-size: 10.5px; }
.prose strong { font-weight: 600; color: var(--ink); }
.prose .front { font-family: JBMono, monospace; font-size: 10.5px; line-height: 1.75;
  color: var(--muted); background: var(--code); border-radius: calc(6px * var(--r));
  padding: 9px 11px; margin: 0 0 14px; white-space: pre-wrap; }

/* ── 工作台（变体 04）──────────────────────────────────────── */
.wb { flex: 1; display: flex; min-width: 0; background: var(--panel); }
.wb-files { width: 186px; flex: 0 0 186px; border-right: 1px solid var(--line-soft);
  background: var(--panel2); display: flex; flex-direction: column; }
.wb-files .h { padding: 11px 12px 7px; font-size: 10px; color: var(--faint); letter-spacing: .06em; }
.wb-files .f { display: flex; align-items: center; gap: 7px; height: 26px; padding: 0 12px;
  font-size: 11px; color: var(--ink2); cursor: pointer; }
.wb-files .f:hover { background: var(--line-soft); }
.wb-files .f.on { background: var(--accent-soft); color: var(--accent-fg); }
.wb-files .f .ic { width: 12px; height: 12px; color: var(--faint); }
.wb-files .f .mono { font-size: 10.5px; }
.wb-files .foot { margin-top: auto; padding: 10px 12px; border-top: 1px solid var(--line-soft);
  font-size: 10px; color: var(--muted); line-height: 1.7; }
.wb-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.wb-bar { height: 38px; display: flex; align-items: center; gap: 6px; padding: 0 12px;
  border-bottom: 1px solid var(--line-soft); }
.tab { height: 24px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid transparent; border-radius: calc(5px * var(--r)); font-size: 11px; color: var(--muted);
  font-family: JBMono, monospace; cursor: pointer; }
.tab.on { background: var(--surface); border-color: var(--line); color: var(--ink); }
.tab .x { color: var(--faint); }
.code { flex: 1; overflow: auto; padding: 12px 0 40px; background: var(--panel); }
.ln { display: flex; font: 11px/1.85 JBMono, monospace; }
.ln .no { width: 44px; flex: 0 0 44px; text-align: right; padding-right: 12px; color: var(--faint);
  user-select: none; }
.ln .tx { flex: 1; white-space: pre; color: var(--ink2); padding-right: 20px; }
.ln.fm .tx { color: var(--muted); }
.ln.h .tx { color: var(--ink); font-weight: 500; }
.ln .tx .s { color: var(--ok-fg); }
.pub { width: 260px; flex: 0 0 260px; border-left: 1px solid var(--line-soft); background: var(--panel2);
  display: flex; flex-direction: column; }
.pub .h { padding: 12px 14px 8px; border-bottom: 1px solid var(--line-soft); display: flex;
  align-items: center; gap: 6px; font-size: 11px; color: var(--ink2); }
.pub .body { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.unit { border: 1px solid var(--line); border-radius: calc(7px * var(--r)); background: var(--panel);

<script>
const V = () => VARIANTS.find((x) => x.id === S.v);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ic = (n, cls = '') => `<svg class="ic ${cls}"><use href="#i-${n}"/></svg>`;
const cat = () => S.cat[S.tab] ?? null;
const setCat = (c) => { S.cat[S.tab] = c; render(); };
const selOf = (t = S.tab) => S.sel[t];

/* 父类含子类：`工程` 要命中 `工程/事故`（decisions 2026-11-16 第 3 条）*/
function inCat(cats, c) {
  if (c === '∅') return cats.length === 0;
  return cats.some((x) => x === c || x.startsWith(c + '/'));
}
function catNodes(list) {
  return list.map((p) => ({ path: p, depth: (p.match(/\//g) || []).length, label: p.split('/').pop() }));
}
function countIn(items, c) { return items.filter((i) => inCat(i.category || [], c)).length; }
function kb(n) { return n == null ? '—' : n < 1024 ? `${n} B` : `${(n / 1024).toFixed(1)} KB`; }
const short = (h) => (h || '—').slice(0, 7);

/* ── 极简 markdown（够画 SKILL.md / PROMPT.md）─────────────── */
function md(text) {
  const lines = String(text).split('\n');
  let out = [], list = null, fence = null, front = null;
  const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  const inline = (s) => esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i];
    if (fence !== null) {
      if (raw.trim().startsWith('```')) { out.push(`<pre><code>${esc(fence.join('\n'))}</code></pre>`); fence = null; }
      else fence.push(raw);
      continue;
    }
    if (raw.trim().startsWith('```')) { closeList(); fence = []; continue; }
    if (i === 0 && raw.trim() === '---') { front = []; continue; }
    if (front !== null) {
      if (raw.trim() === '---') { out.push(`<div class="front">${esc(front.join('\n'))}</div>`); front = null; }
      else front.push(raw);
      continue;
    }
    const h = raw.match(/^(#{1,4})\s+(.*)$/);
    if (h) { closeList(); const lv = Math.min(h[1].length, 3); out.push(`<h${lv}>${inline(h[2])}</h${lv}>`); continue; }
    const ul = raw.match(/^\s*[-*]\s+(.*)$/);
    if (ul) { if (list !== 'ul') { closeList(); out.push('<ul>'); list = 'ul'; } out.push(`<li>${inline(ul[1])}</li>`); continue; }
    const ol = raw.match(/^\s*\d+\.\s+(.*)$/);
    if (ol) { if (list !== 'ol') { closeList(); out.push('<ol>'); list = 'ol'; } out.push(`<li>${inline(ol[1])}</li>`); continue; }
    if (!raw.trim()) { closeList(); continue; }
    closeList();
    out.push(`<p>${inline(raw)}</p>`);
  }
  if (fence) out.push(`<pre><code>${esc(fence.join('\n'))}</code></pre>`);
  return out.join('');
}

/* ── 仓库状态的语言 ───────────────────────────────────────── */
function repoLine(kind) {
  const r = kind === 'ext' ? D.exts.repo : D[kind].repo;
  if (kind === 'ext') {
    return { dot: 'warn', text: '和远端分叉', mono: short(r.head),
      tip: 'git pull 失败：当前分支没有跟踪信息', bad: true };
  }
  if (r.dirty) return { dot: 'warn', text: '有未提交的改动', mono: short(r.head) };
  if (r.ahead) return { dot: 'warn', text: `领先 origin ${r.ahead} 个提交`, mono: short(r.head) };
  return { dot: 'ok', text: '仓干净', mono: short(r.head) };
}
function pendingUnits(kind) {
  if (kind === 'ext') return [];   // 扩展走 extensions/sync，词表 + 清单
  return D[kind].pending;
}
const TAB_META = {
  skills: { title: '技能', root: '/opt/Nous-skills', icon: 'spark' },
  prompts: { title: '提示词', root: '/opt/Nous-prompts', icon: 'quote' },
  ext: { title: '扩展', root: '/opt/Nous-extend', icon: 'puzzle' },
  content: { title: '内容', root: '/opt', icon: 'layers' },
};
function catRow(label, count, depth, active, act, caret = null) {
  const tw = caret === null ? '' : `<span class="tw">${ic(caret ? 'chev-r' : 'chev-d')}</span>`;
  return `<div class="cat ${active ? 'on' : ''} ${count === 0 ? 'zero' : ''}" data-act="${act}"
     style="padding-left:${8 + depth * 12}px">${tw}<span class="nm">${esc(label)}</span><span class="n">${count}</span></div>`;
}
function groupSep(t) { return `<div class="gsep">${esc(t)}</div>`; }

function skillsTree() {
  const items = D.skills.items.filter((s) => !s.hidden);
  const variants = Object.values(D.skills.variants).flat();
  let h = catRow('全部', items.length, 0, cat() === null, 'cat:');
  for (const n of catNodes(D.skills.categories)) h += catRow(n.label, countIn(items, n.path), n.depth, cat() === n.path, 'cat:' + n.path);
  h += catRow('未分类', items.filter((s) => !s.category.length).length, 0, cat() === '∅', 'cat:∅');
  h += groupSep('状态');
  h += catRow(`变体`, variants.length, 0, cat() === '@variant', 'cat:@variant');
  h += catRow('藏起来的', D.skills.items.filter((s) => s.hidden).length, 0, cat() === '@hidden', 'cat:@hidden');
  return h;
}
function promptsTree() {
  const items = D.prompts.items;
  const untracked = items.filter((p) => !p.tracked).length;
  let h = catRow('全部', items.length, 0, cat() === null, 'cat:');
  for (const n of catNodes(D.prompts.categories)) h += catRow(n.label, countIn(items, n.path), n.depth, cat() === n.path, 'cat:' + n.path);
  h += catRow('未分类', items.filter((p) => !p.category.length).length, 0, cat() === '∅', 'cat:∅');
  h += groupSep('状态');
  h += catRow('盘上有、仓里没', untracked, 0, cat() === '@untracked', 'cat:@untracked');
  h += catRow('引擎默认那条', 1, 0, cat() === '@default', 'cat:@default');
  return h;
}
function extTree() {
  const e = D.exts;
  const rows = extRows();
  const by = (fn) => rows.filter(fn).length;
  let h = catRow('全部', rows.length, 0, cat() === null, 'cat:');
  h += groupSep('状态');
  h += catRow('启用中', by((r) => r.state === 'on'), 0, cat() === '@on', 'cat:@on');
  h += catRow('内置', by((r) => r.state === 'builtin'), 0, cat() === '@builtin', 'cat:@builtin');
  h += catRow('加载失败', by((r) => r.state === 'bad'), 0, cat() === '@bad', 'cat:@bad');
  h += catRow('变体', by((r) => r.variant != null), 0, cat() === '@variant', 'cat:@variant');
  h += catRow('已归档', by((r) => r.state === 'archived'), 0, cat() === '@archived', 'cat:@archived');
  h += catRow('本机已删', Object.keys(D.exts.local?.deleted || {}).length, 0, cat() === '@deleted', 'cat:@deleted');
  h += groupSep('类别');
  for (const n of catNodes(e.categories)) {
    h += catRow(n.label, e.catalog.filter((c) => inCat(c.category || [], n.path)).length, n.depth,
      cat() === n.path, 'cat:' + n.path);
  }
  return h;
}

function tabCount(tab) {
  if (tab === 'skills') return `${D.skills.items.filter((s) => !s.hidden).length} 条`;
  if (tab === 'prompts') return `${D.prompts.items.length} 条`;
  return `${extRows().length} 条`;
}
/* ── 列表：行 ─────────────────────────────────────────────── */
function skillURL(s) { return `skill:${s.name}`; }
function promptURL(p) { return `prompt:${p.name}`; }

function skillsRows() {
  const c = cat();
  let items = D.skills.items.slice();
  if (c === '@variant') {
    // 变体也是页面上的条目：一行一棵独立树，名字是 `<本体>@<id>`。
    return Object.entries(D.skills.variants).flatMap(([fam, vs]) => vs.map((v) => ({
      skill: { name: v.key, description: v.load?.error || '变体树', category: [], files: 0,
        hidden: false, tracked: true, variant: v },
    })));
  }
  if (c === '@hidden') return items.filter((s) => s.hidden).map((s) => ({ skill: s }));
  items = items.filter((s) => !s.hidden);
  if (c && c !== '∅') items = items.filter((s) => inCat(s.category, c));
  if (c === '∅') items = items.filter((s) => !s.category.length);
  const q = S.q.trim().toLowerCase();
  if (q) items = items.filter((s) => (s.name + ' ' + s.description + ' ' + s.category.join(' ')).toLowerCase().includes(q));
  return items.map((s) => ({ skill: s }));
}
function promptsRows() {
  const c = cat();
  let items = D.prompts.items.slice();
  if (c === '@untracked') items = items.filter((p) => !p.tracked);
  else if (c === '@default') items = items.filter((p) => p.name === D.prompts.default);
  else {
    if (c && c !== '∅') items = items.filter((p) => inCat(p.category, c));
    if (c === '∅') items = items.filter((p) => !p.category.length);
  }
  const q = S.q.trim().toLowerCase();
  if (q) items = items.filter((p) => (p.name + ' ' + (p.summary || '') + ' ' + p.category.join(' ')).toLowerCase().includes(q));
  return items.map((p) => ({ prompt: p }));
}
function extRows() {
  const e = D.exts;
  const rows = e.catalog.map((c) => {
    const v = (e.variants[c.name] || [])[0];
    const load = e.load[c.name];
    let state = 'on';
    if (load && load.state === 'failed') state = 'bad';
    if (!e.installed.includes(c.name)) state = 'off';
    return { ext: c, state, variant: null };
  });
  for (const b of e.builtin) rows.push({ ext: { name: b, builtin: true, category: [], sections: [] }, state: 'builtin' });
  for (const [fam, vs] of Object.entries(e.variants)) for (const v of vs) {
    const load = e.load[v.key];
    rows.push({ ext: { name: v.key, family: fam, version: load?.version, category: (e.catalog.find((c) => c.name === fam) || {}).category || [] },
      state: load?.state === 'failed' ? 'bad' : 'variant', variant: v });
  }
  for (const a of e.archived) rows.push({ ext: { ...a, archived: true }, state: 'archived' });
  return rows;
}
function filteredExtRows() {
  const c = cat();
  let rows = extRows();
  const map = { '@on': 'on', '@builtin': 'builtin', '@bad': 'bad', '@archived': 'archived' };
  if (c === '@variant') rows = rows.filter((r) => r.variant != null);
  else if (c === '@deleted') rows = rows.filter((r) => D.exts.local?.deleted?.[r.ext.name]);
  else if (map[c]) rows = rows.filter((r) => r.state === map[c]);
  else if (c) rows = rows.filter((r) => inCat(r.ext.category || [], c));
  const q = S.q.trim().toLowerCase();
  if (q) rows = rows.filter((r) => (r.ext.name + ' ' + (r.ext.summary || '') + ' ' + (r.ext.category || []).join(' ')).toLowerCase().includes(q));
  return rows;
}

const STATE_CHIP = {

};

function rowHTML(kind, obj, on) {

          <span class="chip mono">${kb(p.bytes || 0)}</span>

      <div class="meta">
        ${cat0 ? `<span class="chip">${esc(cat0)}</span>` : `<span class="chip">未分类</span>`}
        ${(ext.sections || []).length ? `<span class="chip mono">${esc(ext.sections.join(' · '))}</span>` : ''}
        ${variant ? `<span class="chip mono">${esc(variant.branch)}</span>` : ''}
      </div>
    </div></div>`;
}

function listHTML(v) {

function emptyDetail() {
  return `<div class="detail"><div class="det-body scroll"><div class="note">左边挑一条。</div></div></div>`;

let toastTimer = null;
function toast(text) {
  const app = document.getElementById('app');
  const old = app.querySelector('.toast');
  if (old) old.remove();
  const div = document.createElement('div');
  div.className = 'toast';
  div.textContent = text;
  app.appendChild(div);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => div.remove(), 2400);
}

        ? '落盘 = 未发布。发布要过 <code>node --check</code> 和 <code>index.mjs</code>，然后在扩展仓 commit + push。'
        : '落盘 = 未发布。目录已经能被引擎扫到（会话里勾得到），但没进 <code>HEAD</code> —— 发布之后才算真的一条。'}</div>
      <div class="fields">${fields}</div>
      <div class="gen"><div class="t">${ic('file')}建出来是什么</div><pre></pre></div>
      <div class="err-slot"></div>
      <div class="df"><button class="btn sm" data-act="close">取消</button>
        <button class="btn sm pri" data-act="${meta.act}">${meta.ok}</button></div>
    </div></div>`;
}

function readForm(kind) {
  const dlg = document.getElementById('dlg-' + kind);
  const get = (f) => (dlg.querySelector(`[data-f="${f}"]`)?.value ?? '').trim();
  return { name: get('name'), summary: get('summary'), description: get('description'),
    body: get('body'), group: get('group'), cat: get('cat') };
}
function validate(kind, f) {
  if (!f.name) return { ok: false, err: '名字不能空' };
  if (!NAME_RE.test(f.name)) return { ok: false, err: '名字只能用小写字母、数字和 . _ -，且不能以符号开头' };
  if (f.name.length > 64) return { ok: false, err: '名字 ≤ 64 字符（它同时是目录名和会话里的键）' };
  if (kind === 'ext') {
    if (CORE.includes(f.name)) return { ok: false, err: `${f.name} 是核心扩展（引擎启动路径上硬编码 import）—— 不能新建` };
    if (!f.summary) return { ok: false, err: '一句话说明不能空 —— 卡片上就靠它认人' };
    if (f.summary.length > 200) return { ok: false, err: '说明太长了（200 字以内）' };
  }
  if (kind === 'skill' && !f.description)
    return { ok: false, err: 'description 不能空 —— 模型靠它判断该不该用这条技能' };
  if (kind === 'prompt' && !f.summary)
    return { ok: false, err: 'summary 不能空 —— 人靠这一行决定选不选它' };
  return { ok: true, err: '' };
}
function previewOf(kind, f) {
  const name = f.name || '<名>';
  if (kind === 'skill') {
    return ['---', `name: ${name}`,
      `description: ${JSON.stringify(f.description || '<一句话描述>')}`, '---', '', `# ${name}`, ''].join('\n')
      + '\n// nous.json\n{\n  "name": ' + JSON.stringify(name) + ',\n  "summary": "",\n  "category": []\n}';
  }
  if (kind === 'prompt') {
    return (f.body || `# ${name}`) + '\n\n// nous.json\n{\n  "name": ' + JSON.stringify(name)
      + ',\n  "summary": ' + JSON.stringify(f.summary || '<摘要>') + ',\n  "category": []\n}';
  }
  return `// ${name} —— ${f.summary || '<一句话说明>'}
//
// 一个扩展 = 一个目录 + 一份清单（nous.json）+ 一个入口（这个文件）。
// 现在它是空的：只声明名字，什么都不装。
//
// 1. 往系统提示词里加一段：sections: [section("${name}", () => "…")]
// 2. 加工具：tools: [defineTool({ … })]
// 3. 要宿主的东西：nous.json 的 needs 里写键名（api / dir / registry …）
export default ({ defineExtension }) => defineExtension({ name: "${name}" });

// nous.json
{
  "name": "${name}", "version": "0.1.0", "file": "index.js",
  "entry": "default", "sections": [], "summary": "${f.summary || '<一句话说明>'}",
  "needs": {}
}`;
}
function bindForm(kind) {
  const dlg = document.getElementById('dlg-' + kind);
  if (!dlg) return;
  let touched = false;
  const pre = dlg.querySelector('.gen pre');
  const slot = dlg.querySelector('.err-slot');
  const ok = dlg.querySelector(`[data-act="create:${kind}"]`);
  const refresh = () => {
    const f = readForm(kind);
    const v = validate(kind, f);
    if (pre) pre.textContent = previewOf(kind, f);
    if (slot) slot.textContent = touched && !v.ok ? v.err : '';
    if (ok) ok.disabled = !v.ok;
    return v;
  };
  dlg.querySelectorAll('input, select, textarea').forEach((el) => {
    el.addEventListener('input', () => { touched = true; refresh(); });
    el.addEventListener('change', () => { touched = true; refresh(); });
  });
  dlg.querySelectorAll('.catbar button').forEach((b) => b.addEventListener('click', (e) => {
    e.preventDefault();
    b.classList.toggle('on');
  }));
  refresh();
}
function createFrom(kind) {
  const f = readForm(kind);
  const v = validate(kind, f);
  if (!v.ok) {
    const slot = document.querySelector(`#dlg-${kind} .err-slot`);
    if (slot) slot.textContent = v.err;
    return;
  }
  if (kind === 'skill') {
    D.skills.items.unshift({ name: f.name, description: f.description, hidden: false, tracked: false, files: 2,
      category: f.cat ? [f.cat] : [] });
    S.sel.skills = f.name;
    go('skills');
  } else if (kind === 'prompt') {
    D.prompts.items.unshift({ name: f.name, summary: f.summary, bytes: (f.body || `# ${f.name}`).length,
      category: f.cat ? [f.cat] : [], tracked: false });
    S.sel.prompts = f.name;
    go('prompts');
  } else {
    go('ext');
  }
  toast(`已建 ${f.name} · 未发布 —— 盘上有、仓里没`);
}

/* ── 拼起来 ───────────────────────────────────────────────── */
/* 筛过之后如果选中那条已经不在列表里，就选第一条 —— 别让左边列表和右边详情互相打脸。 */
function syncSelection() {
  const tab = S.tab;
  const rows = tab === 'skills' ? skillsRows() : tab === 'prompts' ? promptsRows() : filteredExtRows();
  if (!rows.length) return;
  const nameOf = (r) => r.skill?.name || r.prompt?.name || r.ext?.name;
  if (!rows.some((r) => nameOf(r) === selOf(tab))) S.sel[tab] = nameOf(rows[0]);
}

function render() {
  const sc = screenOf();
  document.title = `NousDesk · 资源页 · ${sc.id} ${sc.name}`;
  syncSelection();
  const app = document.getElementById('app');
  app.dataset.skin = S.skin;
  let body = sc.states ? statesHTML() : sc.edit ? editHTML() : mainHTML();
  if (!sc.edit && !sc.states) body = `<div class="page">${treeHTML(FIXED)}${listHTML(FIXED)}${withEdit(
    S.tab === 'skills' ? detailSkill(selOf('skills'))
    : S.tab === 'prompts' ? detailPrompt(selOf('prompts'))
    : extDetail(selOf('ext')))}</div>`;
  app.innerHTML = railHTML() + body
    + (sc.sheet ? (sc.sheet === 'publish' ? publishHTML() : formHTML(sc.sheet)) : '')
    + (S.menu ? menuHTML() : '');

function bindPublish() {
  document.querySelectorAll('[data-act^="publish-repo:"]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.act.split(':')[1];
      const name = { skills: 'Nous-skills', prompts: 'Nous-prompts', ext: 'Nous-extend' }[key];
      const steps = key === 'ext'
        ? ['词表 / 清单', 'commit', 'push']
        : ['内容闸', '重扫 index.json', 'commit', 'push'];
      let i = 0;
      btn.disabled = true;
      btn.textContent = `${name} · ${steps[0]}…`;
      const tick = () => {
        i += 1;
        if (i < steps.length) { btn.textContent = `${name} · ${steps[i]}…`; setTimeout(tick, 420); return; }
        btn.textContent = '已发布';
        toast(`${name} 推上去了 · ${short(D[key === 'ext' ? 'exts' : key].repo.head)} → origin/main`);
      };
      setTimeout(tick, 420);
    });
  });
}

function listBodyOnly() {

  else if (tab === 'prompts') rows = promptsRows().map((r) => rowHTML('prompt', r, selOf('prompts') === (r.prompt?.name || r.name)));
  else rows = filteredExtRows().map((r) => rowHTML('ext', r, selOf('ext') === r.ext.name));

/* ── 交互 ─────────────────────────────────────────────────── */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;

  if (act.startsWith('rail:')) {
    const id = act.slice(5);
    if (id === 'res') { go(S.tab === 'skills' ? 'skills' : S.tab === 'prompts' ? 'prompts' : 'ext'); }
    else toast('这一份 demo 只画资源页');
    return;
  }
  if (act.startsWith('seg:')) {
    const id = act.slice(4);
    S.tab = id; S.cat = {}; S.q = '';
    const sc = screenOf();
    if (sc.sheet) go(id); else { S.screen = id; history.replaceState(null, '', '#' + id); render(); }
    return;
  }
  if (act.startsWith('cat:')) { setCat(act.slice(4)); return; }
  if (act.startsWith('sel:')) {
    const name = act.slice(4);
    S.sel[S.tab] = name;
    render(); return;
  }
  if (act.startsWith('file:')) {
    S.openFile[act.split(':')[1]] = act.split(':').slice(2).join(':');
    render(); return;
  }
  if (act.startsWith('publish-repo:')) return;   // bindPublish 自己处理

  switch (act) {
    case 'menu': S.menu = !S.menu; render(); return;
    case 'menu-off': S.menu = false; render(); return;
    case 'close': {
      const sc = screenOf();
      go(sc.tab || S.tab);
      return;
    }
    case 'new': go(S.tab === 'skills' ? 'new-skill' : S.tab === 'prompts' ? 'new-prompt' : 'new-ext'); return;
    case 'publish': go('publish'); return;
    case 'edit': go('edit'); return;
    case 'back': go(S.tab === 'skills' ? 'skills' : S.tab === 'prompts' ? 'prompts' : 'ext'); return;
    case 'create:skill': createFrom('skill'); return;
    case 'create:prompt': createFrom('prompt'); return;
    case 'create:ext': createFrom('ext'); return;
    case 'retry': toast('又拉了一次 · 还是连不上（错了就该看得见，别装作没事）'); return;
    case 'rescan': toast('重新扫了一遍 · 名册里 5 条，变体里 1 条加载失败'); return;
    case 'save': toast('存到盘上了 —— 还没发布'); return;
    case 'setdefault': toast(`已把 ${selOf('prompts')} 设为默认 —— 引擎会校验这条真存在`); return;
    case 'install': toast('从 data/extend-trash/ 搬回来了 · 重新扫过一遍'); return;
    case 'uninstall': toast(`${selOf('ext')} 已从本机卸掉 · 仓库没动`); return;
    case 'archive': toast('归档 = git mv 到 .archive/ + commit + push（这一份 demo 只弹提示）'); return;
    case 'drop': toast('拆掉变体树 · 删目录 + 删分支'); return;
    case 'noop': toast('这一下是演示，没接真接口'); return;
  }
});

/* 挑镜头那一列 */
const plist = document.getElementById('plist');
plist.innerHTML = SCREENS.map((s, i) =>
  `<button data-screen="${s.id}" class="${s.id === S.screen ? 'on' : ''}"><b>${String(i + 1).padStart(2, '0')}</b><span>${s.name}</span></button>`).join('');
function syncNote() {
  const sc = screenOf();
  document.getElementById('pnote').innerHTML = sc.note;
  [...plist.children].forEach((b) => b.classList.toggle('on', b.dataset.screen === S.screen));
}
plist.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  go(b.dataset.screen);
  syncNote();
});
document.querySelectorAll('.skinbar [data-seg]').forEach((b) => b.addEventListener('click', () => {
  S.segStyle = b.dataset.seg;
  document.querySelectorAll('[data-seg]').forEach((x) => x.classList.toggle('on', x === b));
  render();
}));
document.querySelectorAll('.skinbar [data-skin]').forEach((b) => b.addEventListener('click', () => {
  S.skin = b.dataset.skin;
  document.querySelectorAll('[data-skin]').forEach((x) => x.classList.toggle('on', x === b));
  render();
}));
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    const sc = screenOf();
    if (S.menu) { S.menu = false; render(); }
    else if (sc.sheet) go(sc.tab || S.tab);
    else if (sc.edit || sc.states) go(S.tab === 'skills' ? 'skills' : S.tab === 'prompts' ? 'prompts' : 'ext');
  }
});
window.addEventListener('hashchange', () => {
  const h = location.hash.slice(1);
  if (SCREENS.some((s) => s.id === h) && h !== S.screen) { S.screen = h; const sc = screenOf(); if (sc.tab) S.tab = sc.tab; syncNote(); render(); }
});

/* 缩放 */
const scaler = document.getElementById('scaler');
function fit() {
  const stage = document.querySelector('.stage');
  const s = Math.max(0.4, Math.min(1, (stage.clientWidth - 44) / 1280, (stage.clientHeight - 44) / 800));
  scaler.style.width = (1280 * s) + 'px';
  scaler.style.height = (800 * s) + 'px';
  document.getElementById('app').style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fit);

syncNote();
render();
fit();

</script>
</body>
