<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NousDesk · Template 工作台（完整原型）</title>
<style>
@font-face { font-family: Inter; src: url(fonts/inter-400.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: Manrope; src: url(fonts/manrope-500.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: JBMono; src: url(fonts/jetbrainsmono-400.woff2) format("woff2"); font-display: swap; }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: #08090a; color: #e6e8ea;
  font: 400 12.5px/1.45 Inter, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  display: flex; gap: 22px; padding: 20px;
}

/* ══ 外壳（挑皮用） ══ */
.bar { width: 196px; flex: 0 0 196px; }
.bar h1 { font: 500 13px/1.3 Manrope, Inter; margin-bottom: 2px; }
.bar .sub { color: #666d73; font-size: 10.5px; line-height: 1.6; margin-bottom: 20px; }
.bar h2 { font-size: 8.5px; letter-spacing: .2em; text-transform: uppercase; color: #666d73; margin: 0 0 7px; font-weight: 600; }
.bar section { margin-bottom: 16px; }
.opts { display: flex; flex-direction: column; gap: 1px; }
.opt { display: flex; align-items: baseline; gap: 8px; padding: 6px 8px; cursor: pointer; text-align: left;
  background: transparent; border: 0; border-left: 2px solid transparent; color: #939ba1; font: inherit; }
.opt:hover { color: #e6e8ea; }
.opt[aria-pressed="true"] { border-left-color: #e6e8ea; color: #fff; }
.opt b { font-weight: 600; font-size: 10.5px; min-width: 46px; }
.opt span { font-size: 10px; color: #666d73; }
.opt[aria-pressed="true"] span { color: #939ba1; }
.tip { font-size: 10px; line-height: 1.6; color: #666d73; margin-top: 8px; }
.tip b { color: #b3babf; font-weight: 500; }
.hint { margin-top: 14px; font-size: 10px; color: #5a6065; line-height: 1.7; border-top: 1px solid #1c2023; padding-top: 10px; }
.hint code { font-family: JBMono, monospace; font-size: 9.5px; color: #8b9297; }

/* ══ 应用窗 ══ */
.win { flex: 1; display: flex; justify-content: center; align-items: flex-start; overflow: auto; }
.app {
  width: 1280px; height: 800px; display: flex; overflow: hidden; position: relative;
  box-shadow: 0 40px 90px rgba(0,0,0,.6);
  background: var(--bg); color: var(--ink);
  font-family: var(--font, Inter); font-size: var(--fs, 12.5px);
}

/* ── 皮肤变量 ───────────────────────────────────────────── */
.app[data-skin="graphite"] {
  --bg: #101214; --panel: #141719; --panel2: #191d20; --rail: #0b0d0e;
  --ink: #e7eaec; --ink2: #9aa2a8; --ink3: #626a70; --ink4: #454c51;
  --line: #22272b; --line2: #1a1e21; --accent: #e7eaec; --accent-ink: #101214;
  --ok: #56b98a; --warn: #d8a24a; --bad: #e06c62; --radius: 3px; --row: 34px;
}
.app[data-skin="paper"] {
  --bg: #fbfbfa; --panel: #ffffff; --panel2: #f5f5f3; --rail: #f0f0ee;
  --ink: #171a1c; --ink2: #62686d; --ink3: #9298a0; --ink4: #b9bec3;
  --line: #e6e6e3; --line2: #efefec; --accent: #171a1c; --accent-ink: #ffffff;
  --ok: #2c8a5e; --warn: #a9761d; --bad: #c4362b; --radius: 3px; --row: 34px;
}
.app[data-skin="mono"] {
  --bg: #000; --panel: #000; --panel2: #0a0a0a; --rail: #000;
  --ink: #fff; --ink2: #a8a8a8; --ink3: #6b6b6b; --ink4: #4a4a4a;
  --line: #fff; --line2: #2a2a2a; --accent: #fff; --accent-ink: #000;
  --ok: #fff; --warn: #fff; --bad: #ff4d4d; --radius: 0px; --row: 36px;
}
.app[data-skin="steel"] {
  --bg: #14181c; --panel: #171c21; --panel2: #1c2228; --rail: #0f1215;
  --ink: #dfe6ea; --ink2: #93a0a9; --ink3: #66727b; --ink4: #4a545c;
  --line: #232b31; --line2: #1b2227; --accent: #7fb2d6; --accent-ink: #0b0e10;
  --ok: #6dbf98; --warn: #d5a45c; --bad: #d9766b; --radius: 2px; --row: 34px;
}
.app[data-skin="amber"] {
  --bg: #0d0c0a; --panel: #12110e; --panel2: #17150f; --rail: #090806;
  --ink: #f0e9dc; --ink2: #a89e8c; --ink3: #6f6656; --ink4: #504a3e;
  --line: #251f18; --line2: #1c1712; --accent: #e8a33d; --accent-ink: #14110c;
  --ok: #7fb489; --warn: #e8a33d; --bad: #d8705f; --radius: 3px; --row: 34px;
}
.app[data-skin="industrial"] {
  --bg: #f4f2ee; --panel: #ffffff; --panel2: #efece7; --rail: #e9e6e0;
  --ink: #14150f; --ink2: #5f5d55; --ink3: #8d8a82; --ink4: #b9b6ad;
  --line: #14150f; --line2: #d8d5cd; --accent: #14150f; --accent-ink: #fff;
  --ok: #1d6b46; --warn: #8a6113; --bad: #a8281c; --radius: 0px; --row: 36px;
  --font: Manrope, Inter; --fs: 12px;
}

/* ── 图标条 ─────────────────────────────────────────────── */
.rail { width: 56px; flex: 0 0 56px; background: var(--rail); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center; padding: 14px 0; gap: 6px; }
.rail .logo { width: 22px; height: 22px; border-radius: 50%; background: var(--ink); opacity: .9; margin-bottom: 12px; }
.rail button { width: 34px; height: 34px; border: 0; background: transparent; color: var(--ink3);
  border-radius: var(--radius); display: grid; place-items: center; cursor: pointer; }
.rail button:hover { background: var(--panel2); color: var(--ink2); }
.rail button.on { background: var(--panel2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.rail .spacer { flex: 1; }
svg.i { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* ── 左：类别 ───────────────────────────────────────────── */
.side { width: 216px; flex: 0 0 216px; background: var(--panel); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; }
.side-head { padding: 14px 14px 10px; display: flex; align-items: center; gap: 8px; }
.side-title { font-size: 12.5px; font-weight: 600; letter-spacing: .01em; }
.side-head .count { margin-left: auto; font-size: 10px; color: var(--ink3); font-family: JBMono, monospace; }
.seg { display: flex; flex-direction: column; gap: 3px; padding: 0 14px 12px; }
.seg button { width: 100%; height: 26px; padding: 0 9px; text-align: left; border: 1px solid var(--line);
  background: transparent; color: var(--ink3); font: inherit; font-size: 10.5px; letter-spacing: .01em;
  cursor: pointer; border-radius: var(--radius); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg button:hover { color: var(--ink2); }
.seg button.on { background: var(--panel2); color: var(--ink); font-weight: 600; box-shadow: inset 2px 0 0 var(--accent); }
.side-actions { display: flex; gap: 6px; padding: 0 14px 10px; }
.btn-s { height: 24px; padding: 0 9px; border: 1px solid var(--line); background: transparent; color: var(--ink2);
  font: inherit; font-size: 10.5px; cursor: pointer; border-radius: var(--radius); display: inline-flex; align-items: center; gap: 4px; }
.btn-s:hover { color: var(--ink); border-color: var(--ink3); }
.btn-s.solid { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.tree { flex: 1; overflow: auto; padding: 2px 8px 12px; }
.tree .row { display: flex; align-items: center; gap: 6px; height: var(--row); padding: 0 6px; border-radius: var(--radius);
  color: var(--ink2); cursor: pointer; font-size: 11.5px; }
.tree .row:hover { background: var(--panel2); color: var(--ink); }
.tree .row.on { background: var(--panel2); color: var(--ink); font-weight: 500; box-shadow: inset 2px 0 0 var(--accent); }
.tree .row .n { margin-left: auto; font-size: 10px; color: var(--ink3); font-family: JBMono, monospace; }
.tree .sub { padding-left: 18px; }
.tree .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--ink4); }
.side-foot { padding: 10px 14px; border-top: 1px solid var(--line); font-size: 9.5px; color: var(--ink3);
  font-family: JBMono, monospace; display: flex; align-items: center; gap: 6px; }
.side-foot .badge { color: var(--warn); }

/* ── 中：列表 ───────────────────────────────────────────── */
.list { width: 330px; flex: 0 0 330px; background: var(--bg); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; }
.list-head { padding: 12px 12px 8px; display: flex; gap: 6px; align-items: center; }
.search { flex: 1; height: 28px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  padding: 0 9px; font: inherit; font-size: 11.5px; border-radius: var(--radius); }
.search::placeholder { color: var(--ink4); }
.viewsw { display: flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.viewsw button { width: 26px; height: 28px; border: 0; background: transparent; color: var(--ink3);
  cursor: pointer; display: grid; place-items: center; }
.viewsw button.on { background: var(--panel2); color: var(--ink); }
.cards { flex: 1; overflow: auto; padding: 4px 10px 14px; }
.card { padding: 11px 11px; border-bottom: 1px solid var(--line2); cursor: pointer; position: relative; }
.card:hover { background: var(--panel); }
.card.on { background: var(--panel); box-shadow: inset 2px 0 0 var(--accent); }
.card.on::after { content: ""; position: absolute; inset: 0; border: 1px solid var(--line); border-left: 0; pointer-events: none; }
.card .top { display: flex; align-items: center; gap: 7px; margin-bottom: 3px; }
.card .name { font-size: 12.5px; font-weight: 600; letter-spacing: -.005em; }
.card .st { margin-left: auto; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink3); }
.card .st.warn { color: var(--warn); }
.card .st.bad { color: var(--bad); }
.card .sum { font-size: 11px; color: var(--ink2); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .tags { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
.tag { font-size: 9px; letter-spacing: .06em; padding: 1px 5px; border: 1px solid var(--line); color: var(--ink2); border-radius: var(--radius); }
.tag.k { color: var(--ink2); }
.list-foot { border-top: 1px solid var(--line); padding: 8px 12px; font-size: 9.5px; color: var(--ink3);
  font-family: JBMono, monospace; display: flex; align-items: center; gap: 8px; }
.list-foot .dirty { color: var(--warn); }
.list-foot .sync { margin-left: auto; color: var(--accent); cursor: pointer; }

/* ── 右：详情 / 编辑器 ──────────────────────────────────── */
.detail { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }
.dt-head { padding: 20px 26px 14px; border-bottom: 1px solid var(--line2); }
.crumb { font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink3); font-weight: 600; margin-bottom: 9px; }
.dt-title { display: flex; align-items: baseline; gap: 10px; }
.dt-title h1 { font-size: 24px; font-weight: 600; letter-spacing: -.015em; line-height: 1.1; }
.dt-title .dir { font-family: JBMono, monospace; font-size: 9.5px; color: var(--ink4); }
.dt-sum { margin-top: 7px; color: var(--ink2); font-size: 12px; line-height: 1.55; max-width: 62ch; }
.chips { display: flex; gap: 5px; margin-top: 12px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; font-size: 10px;
  border: 1px solid var(--line); border-radius: var(--radius); color: var(--ink2); background: var(--panel); }
.chip i { width: 4px; height: 4px; border-radius: 50%; background: var(--ok); }
.chip.warn i { background: var(--warn); }
.chip.bad i { background: var(--bad); }
.chip.solid { background: var(--panel2); color: var(--ink); }
.dt-tabs { display: flex; gap: 0; padding: 0 26px; border-bottom: 1px solid var(--line2); }
.dt-tabs button { height: 34px; padding: 0 12px; border: 0; border-bottom: 2px solid transparent; background: transparent;
  color: var(--ink3); font: inherit; font-size: 11px; cursor: pointer; letter-spacing: .02em; }
.dt-tabs button:hover { color: var(--ink2); }
.dt-tabs button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.dt-tabs .sp { flex: 1; }
.dt-body { flex: 1; overflow: auto; padding: 16px 26px 26px; }
.dt-foot { border-top: 1px solid var(--line2); padding: 12px 26px; display: flex; align-items: center; gap: 8px; background: var(--panel); }
.btn { height: 30px; padding: 0 13px; border: 1px solid var(--line); background: transparent; color: var(--ink);
  font: inherit; font-size: 11.5px; cursor: pointer; border-radius: var(--radius); display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--ink3); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.ghost { border-color: transparent; color: var(--ink2); }
.btn.ghost:hover { background: var(--panel2); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.dt-foot .note { margin-left: auto; font-size: 10px; color: var(--ink3); font-family: JBMono, monospace; }

/* 规格表 */
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 26px; }
.fld .k { font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink3); font-weight: 600; margin-bottom: 5px; }
.fld .v { font-size: 12.5px; line-height: 1.4; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.fld .v .mono { font-family: JBMono, monospace; font-size: 11.5px; color: var(--ink); }
.fld .v .sub { color: var(--ink3); font-size: 11px; }
.sec-t { font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink3); font-weight: 600;
  margin: 20px 0 10px; display: flex; align-items: center; gap: 10px; }
.sec-t::after { content: ""; flex: 1; height: 1px; background: var(--line2); }
.refs { display: flex; flex-direction: column; }
.ref { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line2); font-size: 12px; }
.ref:last-child { border-bottom: 0; }
.ref .kind { font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink3); margin-left: auto; }
.ref .ok { font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--ok); }
.ref .ok.bad { color: var(--bad); }
.notes { font-size: 11.5px; line-height: 1.7; color: var(--ink2); max-width: 66ch; }

/* 编辑器：盘面 */
.board { display: flex; flex-direction: column; gap: 0; }
.brow { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line2); }
.brow:first-child { border-top: 1px solid var(--line2); }
.brow .k { width: 96px; flex: 0 0 96px; font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink3); font-weight: 600; }
.brow .v { flex: 1; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; min-width: 0; }
.brow .act { font-size: 10px; color: var(--ink3); cursor: pointer; }
.brow .act:hover { color: var(--ink); }
.pill { height: 22px; padding: 0 8px; border: 1px solid var(--line); border-radius: var(--radius);
  display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--ink); background: var(--panel); }
.pill.add { color: var(--ink3); border-style: dashed; cursor: pointer; }
.segment { display: flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.segment button { height: 24px; padding: 0 10px; border: 0; background: transparent; color: var(--ink3); font: inherit; font-size: 11px; cursor: pointer; }
.segment button.on { background: var(--panel2); color: var(--ink); font-weight: 600; }

/* 编辑器：JSON */
.code { font-family: JBMono, monospace; font-size: 11.5px; line-height: 1.75; border: 1px solid var(--line);
  border-radius: var(--radius); background: var(--panel); padding: 6px 0; overflow: auto; }
.code .l { display: flex; padding: 0 12px; }
.code .n { width: 28px; flex: 0 0 28px; color: var(--ink4); user-select: none; text-align: right; padding-right: 10px; }
.code .t { white-space: pre-wrap; word-break: break-word; }
.code .k { color: var(--ink2); }
.code .s { color: var(--ink); }

/* diff */
.diff { font-family: JBMono, monospace; font-size: 11.5px; line-height: 1.75; border: 1px solid var(--line);
  border-radius: var(--radius); overflow: auto; background: var(--panel); }
.diff .l { display: flex; padding: 0 12px; }
.diff .n { width: 28px; flex: 0 0 28px; color: var(--ink4); text-align: right; padding-right: 10px; user-select: none; }
.diff .t { flex: 1; white-space: pre-wrap; word-break: break-word; }
.diff .l.add { background: color-mix(in srgb, var(--ok) 12%, transparent); }
.diff .l.del { background: color-mix(in srgb, var(--bad) 12%, transparent); }
.diff .l.add .t::before { content: "+ "; color: var(--ok); }
.diff .l.del .t::before { content: "− "; color: var(--bad); }
.units { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.unit { border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 9px; font-size: 10.5px; color: var(--ink2);
  background: transparent; font-family: inherit; cursor: pointer; display: flex; gap: 7px; align-items: center; }
.unit.on { border-color: var(--ink3); color: var(--ink); }
.unit .plus { color: var(--ok); }
.unit .minus { color: var(--bad); }

/* 新建表单 */
.form .field { margin-bottom: 16px; }
.form label { display: block; font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink3);
  font-weight: 600; margin-bottom: 6px; }
.form .help { font-size: 10.5px; color: var(--ink3); margin-top: 5px; line-height: 1.5; }
.form input[type="text"], .form textarea, .form select {
  width: 100%; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  padding: 8px 10px; font: inherit; font-size: 12px; border-radius: var(--radius); }
.form textarea { resize: vertical; min-height: 58px; line-height: 1.55; }
.form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.err { color: var(--bad); font-size: 10.5px; margin-top: 5px; }
.okmsg { color: var(--ok); font-size: 10.5px; margin-top: 5px; }

/* 弹层 */
.layer { position: absolute; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; z-index: 9; }
.layer.dim0 { background: transparent; }
.modal { width: 440px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: 0 24px 60px rgba(0,0,0,.5); overflow: hidden; }
.modal .mh { padding: 16px 20px 10px; }
.modal .mh h3 { font-size: 13.5px; font-weight: 600; }
.modal .mh p { margin-top: 6px; font-size: 11.5px; color: var(--ink2); line-height: 1.55; }
.modal .mb { padding: 0 20px 16px; font-size: 11.5px; color: var(--ink2); }
.modal .mf { padding: 12px 20px; border-top: 1px solid var(--line2); display: flex; gap: 8px; justify-content: flex-end; background: var(--panel2); }
.filelist { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.filerow { display: flex; align-items: center; gap: 8px; padding: 7px 10px; font-family: JBMono, monospace; font-size: 10.5px; border-bottom: 1px solid var(--line2); }
.filerow:last-child { border-bottom: 0; }
.filerow .plus { color: var(--ok); }
.filerow .minus { color: var(--bad); }
.filerow .st { margin-left: auto; color: var(--ink3); }
.menu { position: absolute; width: 176px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: 0 12px 30px rgba(0,0,0,.35); padding: 4px; z-index: 12; }
.menu button { width: 100%; text-align: left; padding: 7px 9px; border: 0; background: transparent; color: var(--ink);
  font: inherit; font-size: 11.5px; cursor: pointer; border-radius: var(--radius); display: flex; align-items: center; gap: 8px; }
.menu button:hover { background: var(--panel2); }
.menu button.danger { color: var(--bad); }
.menu .sep { height: 1px; background: var(--line2); margin: 4px 0; }
.menu .cap { font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink3); padding: 6px 9px 3px; }

/* 空态 / 加载 */
.empty { padding: 60px 0; text-align: center; color: var(--ink3); }
.empty .big { font-size: 13px; color: var(--ink2); margin-bottom: 6px; }
.empty .small { font-size: 11px; line-height: 1.6; }
.toast { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: 8px 14px; border-radius: var(--radius); font-size: 11.5px; z-index: 20; box-shadow: 0 8px 20px rgba(0,0,0,.3); }

/* 结构性皮肤差异 */
.app[data-skin="mono"] .side, .app[data-skin="mono"] .list, .app[data-skin="mono"] .detail { border-color: #fff; }
.app[data-skin="mono"] .card.on { border-color: #fff; }

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const ST = window.DATA.sections["Session-Template"];
const UT = window.DATA.sections["Ultimate-Template"];
const PENDING = { "st": window.DATA.pending, "ut": window.DATA.pendingUT };
const DIFFS = window.DATA.diffs;

const LAYOUT_NAME = {
  flow: '1 · 纵向流', table: '2 · 表格式', tiles: '3 · 卡片网格', mono: '4 · 巨碑',
  sheet: '5 · 铭牌', split: '6 · 对开', gauge: '7 · 圆环', columns: '8 · 三栏',
  timeline: '9 · 轴线', acc: '10 · 折叠', insp: '11 · 检视栏', dense: '12 · 极密',
};

const state = {
  skin: "graphite", section: "st", selected: "deep-dive",
  cat: null, view: "list", q: "",
  tab: "detail", unit: 0, layer: null, menu: null, toast: null, mode: "detail",
  layout: "flow", openGrp: 0, draft: { name: "", summary: "", category: "", start: "blank" },
};

const sec = () => (state.section === "st" ? ST : UT);
const presets = () => sec().presets;
const pending = () => PENDING[state.section];
const current = () => presets().find((p) => p.name === state.selected) || presets()[0];

const fmtEpoch = (v) => {
  if (typeof v !== "number") return String(v ?? "—");
  const d = new Date(v * 1000), p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
};

/* ── 数据整形 ────────────────────────────────────────────── */
function fields(p) {
  if (state.section === "ut") {
    const t = p.resolved?.trigger || {};
    return [
      { k: "触发器", v: p.spec?.trigger || "—", sub: t.value },
      { k: "参数", v: (t.params || []).map((x) => `${x.label} ${fmtEpoch(x.value)}`).join(" · ") || "没有参数" },
      { k: "会话模板", v: p.spec?.session || "没钉" },
      { k: "类别", v: (p.spec?.category || []).join(" / ") || "未分类" },
      { k: "开关", v: p.spec?.enabled ? "开着" : "关掉" },
      { k: "发布", v: p.tracked ? "HEAD 里有" : "未发布" },
    ];
  }
  const m = p.resolved?.model;
  const ref = m?.ref || (p.spec?.model ? `${p.spec.model.provider}/${p.spec.model.modelId}` : "");
  const [prov, ...rest] = String(ref).split("/");
  return [
    { k: "模型", v: prov || "跟随默认", sub: rest.join("/"), mono: true },
    { k: "思考档", v: p.spec?.thinkingLevel || "默认" },
    { k: "技能", v: (p.spec?.skills || []).join(" · ") || "不要" },
    { k: "模板", v: p.spec?.template || "跟随默认" },
    { k: "扩展", v: (p.spec?.extensions || []).join(" · ") || "不要" },
    { k: "工作目录", v: p.spec?.cwd || "默认" },
    { k: "机器", v: p.spec?.machine || "本机" },
    { k: "只读", v: p.spec?.readOnly ? "是" : "否" },
  ];
}

function refs(p) {
  if (state.section === "ut") {
    const out = [];
    if (p.resolved?.trigger) out.push({ kind: "触发器", name: p.resolved.trigger.ref, state: p.resolved.trigger.state });
    if (p.resolved?.session) out.push({ kind: "会话模板", name: p.resolved.session.ref, state: p.resolved.session.state });
    return out;
  }
  const out = [];
  (p.resolved?.skills || []).forEach((s) => out.push({ kind: "技能", name: s.ref, state: s.state }));
  if (p.resolved?.template) out.push({ kind: "模板", name: p.resolved.template.ref, state: p.resolved.template.state });
  (p.resolved?.extensions || []).forEach((s) => out.push({ kind: "扩展", name: s.ref, state: s.state }));
  return out;
}

const dirty = () => !!sec().repo?.dirty;
const head = () => (sec().repo?.head || "").slice(0, 7);

function cats() {
  const all = sec().categories || [];
  const counts = new Map();
  presets().forEach((p) => {
    const c = (p.spec?.category || []);
    if (!c.length) counts.set("__uncat", (counts.get("__uncat") || 0) + 1);
    c.forEach((x) => counts.set(x, (counts.get(x) || 0) + 1));
  });
  return { all, counts, uncat: counts.get("__uncat") || 0 };
}

function filtered() {
  let out = presets();
  if (state.cat === "__uncat") out = out.filter((p) => !(p.spec?.category || []).length);
  else if (state.cat) out = out.filter((p) => (p.spec?.category || []).some((c) => c === state.cat || c.startsWith(state.cat + "/")));
  if (state.q) {
    const q = state.q.toLowerCase();
    out = out.filter((p) => (p.name + " " + p.summary + " " + (p.spec?.category || []).join(" ")).toLowerCase().includes(q));
  }
  return out;
}

/* ── 图标 ───────────────────────────────────────────────── */
const ICON = {
  chat: '<path d="M3 4.5h10v6H6.5L3 13.5z"/>',
  book: '<path d="M2.5 3h5v10h-5zM8.5 3h5v10h-5z"/>',
  box: '<path d="M2.5 5.5 8 2.5l5.5 3v5L8 13.5l-5.5-3z"/>',
  gear: '<circle cx="8" cy="8" r="2"/><path d="M8 2v2M8 12v2M2 8h2M12 8h2M3.8 3.8l1.4 1.4M10.8 10.8l1.4 1.4M12.2 3.8l-1.4 1.4M5.2 10.8l-1.4 1.4"/>',
  plus: '<path d="M8 3v10M3 8h10"/>',

function lyGauge(p) {
  const f = fields(p);
  const rf = refs(p);
  const total = Math.max(rf.length, 1), ok = rf.filter((r) => r.state === "ok").length, pct = ok / total;
  const R = 100, C = 2 * Math.PI * R, L = C * 0.75;
  const ticks = Array.from({ length: 55 }, (_, i) => {
    const a = Math.PI * 0.75 + (i / 54) * Math.PI * 1.5;
    const long = i % 5 === 0, r1 = R + 10, r2 = R + (long ? 17 : 14);
    return `<line x1="${130 + Math.cos(a) * r1}" y1="${130 + Math.sin(a) * r1}" x2="${130 + Math.cos(a) * r2}" y2="${130 + Math.sin(a) * r2}"
      stroke="${i / 54 <= pct ? "var(--ink)" : "var(--line)"}" stroke-width="${long ? 1.3 : 1}" />`;
  }).join("");
  return `<div class="ly-gauge">
    <div class="ring">
      <svg viewBox="0 0 260 260">
        <circle cx="130" cy="130" r="${R}" fill="none" stroke="var(--line)" stroke-width="1"
          stroke-dasharray="${L} ${C}" transform="rotate(135 130 130)" />
        <circle cx="130" cy="130" r="${R}" fill="none" stroke="var(--ink)" stroke-width="2.5"
          stroke-dasharray="${L * pct} ${C}" transform="rotate(135 130 130)" />
        ${ticks}
      </svg>
      <div class="center"><span class="n">${esc(p.name)}</span>
        <span class="s">${ok}/${rf.length || 0} refs</span></div>
    </div>
    <p class="cap">${esc(p.summary)}</p>

  </div>`;
}

function lcs(before, after) {
  const a = (before ?? "").split("\n"), b = (after ?? "").split("\n");
  const n = a.length, m = b.length;
  const dp = Array.from({ length: n + 1 }, () => new Int32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j]) { out.push({ t: "ctx", text: a[i], n: i + 1 }); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { out.push({ t: "del", text: a[i], n: i + 1 }); i++; }
    else { out.push({ t: "add", text: b[j], n: j + 1 }); j++; }
  }
  while (i < n) out.push({ t: "del", text: a[i++], n: i });
  while (j < m) out.push({ t: "add", text: b[j++], n: j });
  return out;
}

function tabDiff() {
  const units = pending().units;
  if (!units.length) return `<div class="empty"><div class="big">这一段没有待同步的改动</div><div class="small">盘上和 HEAD 一致</div></div>`;
  const u = units[Math.min(state.unit, units.length - 1)];
  const path = u.files?.[0]?.path;
  const d = DIFFS[path];
  const rows = d ? lcs(d.before, d.after) : null;
  return `<div class="units">${units.map((x, i) => `<button class="unit ${i === state.unit ? "on" : ""}" data-act="unit" data-i="${i}">
      ${esc(x.name ?? "categories.json")}
      ${x.added ? `<span class="plus">+${x.added}</span>` : ""}${x.removed ? `<span class="minus">−${x.removed}</span>` : ""}
    </button>`).join("")}</div>
    ${rows
      ? `<div class="diff">${rows.map((r) => `<div class="l ${r.t}"><span class="n">${r.n}</span><span class="t">${esc(r.text)}</span></div>`).join("")}</div>`
      : `<div class="empty"><div class="big">未发布 · HEAD 里没有这个文件</div><div class="small">发布之后才有 diff</div></div>`}`;
}

function tabsBar() {
  const t = [["detail", "详情"], ["board", "盘面"], ["json", "JSON"], ["diff", `对比${pending().units.length ? "·" + pending().units.length : ""}`]];
  return `<div class="dt-tabs" style="padding:0 26px">
    ${t.map(([k, label]) => `<button class="${state.tab === k ? "on" : ""}" data-act="tab" data-tab="${k}">${label}</button>`).join("")}
    <span class="sp"></span>
    <span class="ly-k" style="align-self:center">${LAYOUT_NAME[state.layout]}</span>
  </div>`;
}

function right() {
  if (state.mode === "new") return newForm();
  const p = current();
  const isUT = state.section === "ut";
  const inner = state.tab === "detail" ? LAYOUTS[state.layout](p)
    : `<div class="dt-head" style="padding-bottom:10px"><div class="crumb">${crumbOf()}</div>
        <div class="dt-title"><h1>${esc(p.name)}</h1></div></div>
      <div class="dt-body">${state.tab === "board" ? tabBoard(p) : state.tab === "json" ? tabJson(p) : tabDiff()}</div>`;
  return `<div class="detail" data-layout="${state.layout}">
    ${tabsBar()}
    ${state.tab === "detail" ? `<div class="dt-body lywrap">${inner}</div>` : inner}
    <div class="dt-foot">
      <button class="btn primary" data-act="launch">${isUT ? "发布" : "开一条新对话"}</button>
      <button class="btn" data-act="edit">编辑</button>
      <button class="btn ghost" data-act="menu-dots">${icon("dots")}</button>
      <span class="note">HEAD ${head()} · ${pending().units.length} 个文件待同步</span>
    </div>
  </div>`;
}

/* ── 弹层 ───────────────────────────────────────────────── */
function layer() {
  if (!state.layer) return "";
  const p = current();
  const units = pending().units;
  const files = units.flatMap((u) => (u.files || []).map((f) => ({ ...f, unit: u.name ?? "categories.json" })));

  if (state.layer === "publish") {
    return `<div class="layer" data-act="close-layer"><div class="modal" onclick="event.stopPropagation()">
      <div class="mh"><h3>发布这一段</h3><p>形状闸 → 重扫 index → commit → push。闸不过一个字节都不动。</p></div>
      <div class="mb">
        <div class="filelist">
          ${files.map((f) => `<div class="filerow">
            <span>${esc(f.path)}</span>
            ${f.added ? `<span class="plus">+${f.added}</span>` : ""}
            ${f.removed ? `<span class="minus">−${f.removed}</span>` : ""}
            <span class="st">${esc(f.status)}</span>
          </div>`).join("") || `<div class="filerow"><span>没有待提交的文件</span></div>`}
        </div>
        <div style="margin-top:12px;font-size:10.5px;color:var(--ink3)">提交信息：<span style="font-family:JBMono">session: 更新预设仓库</span></div>
      </div>
      <div class="mf"><button class="btn ghost" data-act="close-layer">取消</button>
        <button class="btn primary" data-act="do-publish">发布</button></div>
    </div></div>`;
  }
  if (state.layer === "archive" || state.layer === "purge") {
    const purge = state.layer === "purge";
    return `<div class="layer" data-act="close-layer"><div class="modal" onclick="event.stopPropagation()">
      <div class="mh">
        <h3>${purge ? "彻底删除" : "归档"} ${esc(p.name)}</h3>
        <p>${purge
          ? "活库那行和归档库那份一起没，不进回收站，也不能撤销。"
          : "移到归档库，主列表不再出现；随时可以还原。"}</p>
      </div>
      <div class="mb">
        <div class="filelist">
          <div class="filerow"><span>${esc(p.dir || p.name)}/</span><span class="st">整个目录</span></div>
        </div>
        ${purge ? `<div class="err" style="margin-top:12px">这一步不可逆，输一下名字确认：</div>
          <input class="search" style="margin-top:6px;height:30px" placeholder="${esc(p.name)}" data-act="purge-input">` : ""}
      </div>
      <div class="mf"><button class="btn ghost" data-act="close-layer">取消</button>
        <button class="btn ${purge ? "danger" : "primary"}" data-act="do-${purge ? "purge" : "archive"}">${purge ? "彻底删除" : "归档"}</button></div>
    </div></div>`;
  }
  if (state.layer === "newcat") {
    return `<div class="layer" data-act="close-layer"><div class="modal" style="width:380px" onclick="event.stopPropagation()">
      <div class="mh"><h3>新建类别</h3><p>类别是这一段的词表，写路径可以分层（写作/周报）。</p></div>
      <div class="mb"><div class="form"><div class="field"><label>类别名</label>
        <input type="text" placeholder="写作/周报" data-act="newcat-input"></div></div></div>
      <div class="mf"><button class="btn ghost" data-act="close-layer">取消</button>
        <button class="btn primary" data-act="do-newcat">建</button></div>
    </div></div>`;
  }
  if (state.layer === "launch") {
    return `<div class="layer" data-act="close-layer"><div class="modal" onclick="event.stopPropagation()">
      <div class="mh"><h3>开一条新对话</h3><p>用 ${esc(p.name)} 起手。建完把盘上那只眼睛切过去。</p></div>
      <div class="mb">
        <div class="form">
          <div class="field"><label>会话名</label>
            <input type="text" placeholder="${esc(p.name + "-" + new Date().toISOString().slice(5, 10).replace("-", ""))}" data-act="session-name"></div>
          <div class="field"><label>生效值（服务端回来的，不是我们发的）</label>
            <div class="chip solid" style="margin-right:5px">模型 ${esc(p.spec?.model?.modelId || "跟随默认")}</div>
            <div class="chip solid" style="margin-right:5px">思考 ${esc(p.spec?.thinkingLevel || "默认")}</div>
            <div class="chip solid">技能 ${esc((p.spec?.skills || []).join("、") || "无")}</div>
          </div>
        </div>
      </div>
      <div class="mf"><button class="btn ghost" data-act="close-layer">取消</button>
        <button class="btn primary" data-act="do-launch">开对话</button></div>
    </div></div>`;
  }
  return "";
}

function menu() {
  if (!state.menu) return "";
  const p = current();
  const { left, top } = state.menu;
  return `<div class="menu" style="left:${left}px;top:${top}px" data-act="menu">
    <div class="cap">${esc(p.name)}</div>
    <button data-act="edit">编辑</button>
    <button data-act="menu-cat">改类别…</button>
    <button data-act="menu-copy">复制目录路径</button>
    <button data-act="launch">开一条新对话</button>
    <div class="sep"></div>
    <button data-act="menu-archive">归档</button>
    <button class="danger" data-act="menu-purge">彻底删除…</button>
  </div>`;
}

/* ── 装配 ───────────────────────────────────────────────── */
function render() {
  const app = $("#app");
  app.dataset.skin = state.skin;
  app.innerHTML = rail() + side() + list() + right() + layer() + menu()
    + (state.toast ? `<div class="toast">${esc(state.toast)}</div>` : "");
}

function toast(msg) {
  state.toast = msg;
  render();
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { state.toast = null; render(); }, 1800);
}

function setSkin(k) {
  state.skin = k;
  $$("#opt-skin .opt").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.k === k)));
  render();
}

$("#app").addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act;

  if (act === "cat") { state.cat = t.dataset.cat || null; render(); }
  else if (act === "sec") {
    state.section = t.dataset.sec;
    state.selected = presets()[0]?.name;
    state.cat = null; state.tab = "detail"; state.unit = 0;
    render();
  }
  else if (act === "pick") { state.selected = t.dataset.name; state.tab = state.tab === "diff" ? "detail" : state.tab; render(); }
  else if (act === "view") { state.view = t.dataset.view; render(); }
  else if (act === "tab") { state.tab = t.dataset.tab; render(); }
  else if (act === "layout") { state.layout = t.dataset.k; paintLayout(); render(); }
  else if (act === "grp") { state.openGrp = state.openGrp === +t.dataset.i ? -1 : +t.dataset.i; render(); }
  else if (act === "unit") { state.unit = +t.dataset.i; render(); }
  else if (act === "goto-diff") { state.tab = "diff"; render(); }
  else if (act === "new") { state.mode = "new"; state.tab = "detail"; state.draft = { name: "", summary: "", category: "", start: "blank" }; render(); }
  else if (act === "newcat") { state.layer = "newcat"; render(); }
  else if (act === "edit") { state.tab = "board"; state.menu = null; render(); }
  else if (act === "launch") { state.layer = "launch"; state.menu = null; render(); }
  else if (act === "menu-dots") {
    const r = t.getBoundingClientRect();
    state.menu = { left: Math.max(8, r.left - 176), top: r.top - 220 };
    render();
  }
  else if (act === "menu-copy") { state.menu = null; navigator.clipboard?.writeText(current().dir || ""); toast("目录路径已复制"); }
  else if (act === "menu-archive") { state.layer = "archive"; state.menu = null; render(); }
  else if (act === "menu-purge") { state.layer = "purge"; state.menu = null; render(); }
  else if (act === "menu-cat") { state.menu = null; toast("改类别抽屉（单独做）"); }
  else if (act === "close-layer") { state.layer = null; state.menu = null; render(); }
  else if (act === "do-publish") { state.layer = null; toast("发布成功 · 已 commit + push"); }
  else if (act === "do-archive") { state.layer = null; toast("已归档 · 可在归档库还原"); }
  else if (act === "do-purge") { state.layer = null; toast("已彻底删除（demo 里没真删）"); }
  else if (act === "do-launch") { state.layer = null; toast("会话已创建，眼睛切过去了"); }
  else if (act === "do-newcat") { state.layer = null; toast("类别已加进词表"); }
  else if (act === "change") { toast(`改「${t.dataset.k}」`); }
  else if (act === "start") { state.draft.start = t.dataset.v; render(); }
  else if (act === "do-create") { state.mode = "detail"; toast("已建（demo 里没真写盘）"); }
  else if (act === "cancel-new") { state.mode = "detail"; render(); }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { state.layer = null; state.menu = null; render(); }
});

$("#app").addEventListener("input", (e) => {
  const f = e.target.closest("[data-field]");
  if (f) {
    state.draft[f.dataset.field] = f.value;
    return;
  }
  const t = e.target.closest("[data-act='search']");
  if (!t) return;
  state.q = t.value;
  render();
  const box = $("#app .search");
  if (box) { box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
});

function paintLayout() {
  $$("#opt-layout .opt").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.k === state.layout)));
}
$$("#opt-layout .opt").forEach((b) => b.addEventListener("click", () => { state.layout = b.dataset.k; paintLayout(); render(); }));
paintLayout();
$$("#opt-skin .opt").forEach((b) => b.addEventListener("click", () => setSkin(b.dataset.k)));

const H = (location.hash.replace("#", "") || "").split(",");
const SKINS = ["graphite","paper","mono","steel","amber","industrial"];
if (H[2] === "new") state.mode = "new";
if (H[2] === "publish" || H[2] === "archive" || H[2] === "purge" || H[2] === "launch" || H[2] === "newcat") state.layer = H[2];
if (H[1]) state.tab = H[1];
if (H[3] === "ut") { state.section = "ut"; state.selected = UT.presets[0]?.name; }
if (H[4] && LAYOUT_NAME[H[4]]) state.layout = H[4];
setSkin(SKINS.includes(H[0]) ? H[0] : "graphite");
paintLayout();
</script>
</body>
</html>
