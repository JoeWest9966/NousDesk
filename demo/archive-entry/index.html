<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会话归档 · 入口方案（桌面端 + 移动端）</title>
<style>
  /* ===== 页面外壳 ===== */
  :root{
    --page:#f4f4f5; --card:#fff; --ink:#1b1b1b; --sub:#6b6b70; --line:#e4e4e7;
    --accent:#07c160; --danger:#fa5151; --amber:#fa9d3b;
    /* NousDesk 真机配色（app.rs 的常量） */
    --desk-rail:#2e2e2e; --desk-list:#f7f7f7; --desk-chat:#ededed;
    --desk-me:#95ec69; --desk-you:#fff; --desk-muted:#999;
    /* 手机端 bjes6b 的皮（app.css 的变量） */
    --wx-bg:#ededed; --wx-card:#fff; --wx-green:#07c160; --wx-text:#191919;
    --wx-sub:#9a9a9a; --wx-line:rgba(0,0,0,.08);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; background:var(--page); color:var(--ink);
    font:14px/1.5 -apple-system,"Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",sans-serif}
  a{color:inherit}
  header.top{position:sticky; top:0; z-index:40; background:rgba(244,244,245,.92);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:14px 20px 0}
  h1{font-size:16px; margin:0 0 2px}
  .lead{margin:0 0 10px; color:var(--sub); font-size:12.5px}
  .lead b{color:var(--ink)}
  nav.tabs{display:flex; gap:2px; overflow-x:auto}
  nav.tabs button{appearance:none; border:0; background:transparent; color:var(--sub);
    font:inherit; font-size:13px; padding:9px 14px; border-radius:8px 8px 0 0; cursor:pointer;
    white-space:nowrap; position:relative}
  nav.tabs button[aria-selected="true"]{background:var(--card); color:var(--ink); font-weight:600;
    box-shadow:0 -1px 0 var(--line) inset, 1px 0 0 var(--line) inset, -1px 0 0 var(--line) inset}
  nav.tabs button .n{color:var(--desk-muted); font-weight:400; margin-left:4px; font-size:11.5px}
  main{padding:20px; max-width:1180px; margin:0 auto}
  section[data-panel]{display:grid; gap:18px; grid-template-columns:repeat(auto-fill,minmax(430px,1fr))}
  section[hidden]{display:none !important}

  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden;
    display:flex; flex-direction:column}
  .card > .head{padding:13px 15px 11px; border-bottom:1px solid var(--line)}
  .card h2{font-size:14px; margin:0 0 3px; display:flex; align-items:center; gap:7px; flex-wrap:wrap}
  .tag{font-size:10.5px; font-weight:600; color:#fff; background:var(--desk-rail); padding:1.5px 6px;
    border-radius:5px; letter-spacing:.2px}
  .tag.pick{background:var(--accent)}
  .tag.warn{background:var(--amber)}
  .card .why{margin:0; color:var(--sub); font-size:12px}
  .card .body{padding:14px; flex:1; display:flex; align-items:center; justify-content:center;
    background:#fafafa}
  .card .foot{padding:10px 15px 13px; border-top:1px solid var(--line); font-size:12px; color:var(--sub)}
  .card .foot b{color:var(--ink)}
  .card .foot .bad{color:#c0392b}
  .card .foot .good{color:#1a7f4b}
  .hint{font-size:11.5px; color:var(--sub); background:#fff8e6; border:1px solid #f2e2b8;
    border-radius:7px; padding:5px 8px; margin:0 0 9px}

  /* ===== 桌面端 mock（NousDesk） ===== */
  .desk{width:100%; max-width:660px; height:404px; display:flex; border-radius:10px; overflow:hidden;
    box-shadow:0 6px 22px rgba(0,0,0,.14); background:var(--desk-chat); user-select:none;
    font-size:12.5px; color:#202020; position:relative}
  .rail{width:52px; background:var(--desk-rail); display:flex; flex-direction:column;
    align-items:center; padding:10px 0; gap:6px; flex:0 0 52px}
  .rail .av{width:30px; height:30px; border-radius:7px; background:#4a4a4a; color:#cfcfcf;
    display:grid; place-items:center; font-size:13px; margin-bottom:4px}
  .rail .ic{width:32px; height:32px; border-radius:8px; display:grid; place-items:center;
    color:#9a9a9a; font-size:15px; cursor:pointer}
  .rail .ic:hover{background:#3a3a3a; color:#e8e8e8}
  .rail .ic.on{background:#3d3d3d; color:#fff}
  .rail .sp{flex:1}
  .list{width:232px; flex:0 0 232px; background:var(--desk-list); display:flex; flex-direction:column;
    border-right:1px solid #e2e2e2; position:relative}
  .list .ltop{height:34px; display:flex; align-items:center; justify-content:space-between;
    padding:0 10px; border-bottom:1px solid #e6e6e6}
  .list .ltop .ttl{font-weight:600; font-size:12.5px; color:#333}
  .list .ltop .add{color:#7a7a7a; font-size:15px; cursor:pointer; padding:0 4px}
  .rows{flex:1; overflow:hidden}
  .row{height:52px; padding:7px 10px; display:flex; gap:8px; align-items:center;
    cursor:pointer; position:relative; border-bottom:1px solid #ededed}
  .row:hover{background:#ececec}
  .row.on{background:#e2e2e2}
  .row .av{width:30px; height:30px; border-radius:6px; background:#c9c9c9; flex:0 0 30px;
    display:grid; place-items:center; color:#fff; font-size:12px}
  .row .mid{flex:1; min-width:0}
  .row .nm{font-size:12.5px; color:#282828; display:flex; align-items:center; gap:4px}
  .row .pv{font-size:11.5px; color:#9a9a9a; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .row .tm{font-size:10.5px; color:#b0b0b0; align-self:flex-start; padding-top:2px}
  .row .pin{font-size:9.5px; color:#8a8a8a}
  .row .dots{position:absolute; right:6px; top:6px; width:20px; height:20px; border-radius:5px;
    display:none; place-items:center; color:#777; background:rgba(255,255,255,.9); font-size:13px;
    cursor:pointer; border:1px solid #ddd}
  .desk.showdots .row .dots{display:grid; opacity:.32; transition:opacity .12s}
  .desk.showdots .row:hover .dots{opacity:1}
  .desk.bulk .row .ck{width:15px; height:15px; border-radius:4px; border:1.5px solid #bbb;
    display:none; flex:0 0 15px; place-items:center; font-size:10px; color:#fff}
  .desk.bulk .row .ck{display:grid}
  .desk.bulk .row.sel .ck{background:var(--accent); border-color:var(--accent)}
  .desk.bulk .row.sel{background:#e6f6ec}
  .chat{flex:1; display:flex; flex-direction:column; min-width:0}
  .chat .ctop{height:38px; border-bottom:1px solid #dedede; display:flex; align-items:center;
    padding:0 12px; gap:8px; background:#f4f4f4}
  .chat .ctop .nm{font-weight:600; font-size:12.5px}
  .chat .ctop .sp{flex:1}
  .chat .ctop .k{color:#777; font-size:14px; cursor:pointer; padding:2px 5px; border-radius:5px}
  .chat .ctop .k:hover{background:#e4e4e4}
  .chat .body-c{flex:1; padding:12px; display:flex; flex-direction:column; gap:10px;
    overflow:hidden; background:var(--desk-chat)}
  .bub{max-width:78%; padding:7px 10px; border-radius:7px; font-size:12px; line-height:1.45;
    box-shadow:0 1px 1px rgba(0,0,0,.04)}
  .bub.you{background:var(--desk-you); align-self:flex-start}
  .bub.me{background:var(--desk-me); align-self:flex-end}
  .chat .cin{height:44px; border-top:1px solid #dedede; background:#f7f7f7; display:flex;
    align-items:center; padding:0 10px; color:#aaa; font-size:12px}
  .bulkbar{position:absolute; left:52px; right:0; bottom:0; height:40px; background:#2f2f2f;
    color:#eee; display:none; align-items:center; padding:0 14px; gap:10px; font-size:12px;
    z-index:3}
  .desk.bulk .bulkbar{display:flex}
  .bulkbar .sp{flex:1}
  .bulkbar button{appearance:none; border:1px solid #555; background:#3b3b3b; color:#eee;
    font:inherit; font-size:11.5px; padding:4px 10px; border-radius:6px; cursor:pointer}
  .bulkbar button.dng{background:#8a2b2b; border-color:#a33}
  .dropzone{position:absolute; left:6px; bottom:52px; width:40px; height:40px; border-radius:10px;
    border:1.5px dashed #8f8f8f; color:#cfcfcf; display:grid; place-items:center; font-size:16px;
    background:rgba(255,255,255,.06)}
  .dropzone.hot{background:rgba(7,193,96,.25); border-color:var(--accent); color:#fff}

  /* 菜单（桌面端） */
  .ctx{position:fixed; z-index:100; min-width:172px; background:#fff; border:1px solid #dcdcdc;
    border-radius:8px; padding:4px; box-shadow:0 8px 26px rgba(0,0,0,.18); font-size:12.5px;
    display:none}
  .ctx.on{display:block}
  .ctx .it{padding:5px 10px; line-height:1.35; border-radius:5px; display:flex; align-items:center; gap:8px;
    cursor:pointer; white-space:nowrap}
  .ctx .it:hover{background:#f1f1f1}
  .ctx .it .k{margin-left:auto; color:#aaa; font-size:11px}
  .ctx .it.dng{color:#c0392b}
  .ctx .it.dng:hover{background:#fdeeee}
  .ctx .it.dis{color:#b6b6b6; cursor:default}
  .ctx .it.dis:hover{background:transparent}
  .ctx .sep{height:1px; background:#ececec; margin:4px 2px}
  .ctx .cap{font-size:10.5px; color:#9a9a9a; padding:5px 10px 3px; letter-spacing:.3px}
  .ctx .it .sub{color:#9a9a9a; margin-left:auto; font-size:11px}

  /* ===== 移动端 mock（bjes6b） ===== */
  .phone{width:290px; height:500px; border-radius:30px; background:var(--wx-bg); position:relative;
    overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.18); border:7px solid #1b1b1b;
    display:flex; flex-direction:column; user-select:none; font-size:13px; color:var(--wx-text)}
  .ph-top{height:38px; background:#ededed; display:flex; align-items:center; padding:0 12px;
    border-bottom:.5px solid var(--wx-line); font-size:13.5px; font-weight:600; gap:8px}
  .ph-top .sp{flex:1}
  .ph-top .k{color:#4a4a4a; font-size:15px; padding:2px 4px; cursor:pointer}
  .ph-rows{flex:1; overflow:hidden; background:var(--wx-card)}
  .ph-row{height:60px; padding:9px 12px; display:flex; gap:10px; align-items:center;
    border-bottom:.5px solid var(--wx-line); position:relative; background:var(--wx-card);
    will-change:transform}
  .ph-row .ac{width:40px; height:40px; border-radius:6px; background:#c9c9c9; flex:0 0 40px;
    display:grid; place-items:center; color:#fff; font-size:14px}
  .ph-row .mid{flex:1; min-width:0}
  .ph-row .nm{font-size:13.5px; font-weight:500}
  .ph-row .pv{font-size:11.5px; color:var(--wx-sub); overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; margin-top:2px}
  .ph-row .tm{font-size:10.5px; color:#b2b2b2; align-self:flex-start; padding-top:3px}
  .ph-row.hold{background:#e8e8e8}
  .swipe-acts{position:absolute; inset:0 0 0 auto; display:flex; width:0; overflow:hidden}
  .swipe-acts button{appearance:none; border:0; font:inherit; font-size:12px; color:#fff;
    width:64px; background:#8e8e93; cursor:pointer}
  .swipe-acts button.dng{background:var(--danger); width:76px}
  .swipe-wrap{position:relative; overflow:hidden}
  .sheet{position:absolute; left:0; right:0; bottom:0; background:#f2f2f2; border-radius:14px 14px 0 0;
    transform:translateY(110%); transition:transform .18s ease; z-index:6;
    box-shadow:0 -6px 24px rgba(0,0,0,.16)}
  .sheet.on{transform:translateY(0)}
  .sheet .sh{background:#fff; border-radius:14px 14px 0 0; overflow:hidden}
  .sheet .si{padding:15px 16px; text-align:center; font-size:14.5px; border-bottom:.5px solid var(--wx-line);
    background:#fff; cursor:pointer}
  .sheet .si.dng{color:var(--danger)}
  .sheet .si.cap{color:var(--wx-sub); font-size:12px; cursor:default; padding:10px 16px}
  .sheet .si:last-child{border-bottom:0}
  .sheet .cancel{margin:7px 0 9px; border-radius:12px; background:#fff; padding:15px 16px;
    text-align:center; font-size:14.5px; cursor:pointer}
  .ph-mask{position:absolute; inset:0; background:rgba(0,0,0,.28); opacity:0; pointer-events:none;
    transition:opacity .18s; z-index:5}
  .ph-mask.on{opacity:1; pointer-events:auto}

  /* ===== 对话框 / 确认 ===== */
  .dlg{background:#fff; border-radius:12px; box-shadow:0 12px 40px rgba(0,0,0,.22); width:330px;
    overflow:hidden; font-size:13px; color:#202020}
  .dlg .d-head{padding:16px 18px 6px; font-weight:600; font-size:14px}
  .dlg .d-body{padding:0 18px 16px; color:#4a4a4a; line-height:1.55; font-size:12.5px}
  .dlg .d-body ul{margin:8px 0 0; padding-left:18px; color:#5a5a5a}
  .dlg .d-body li{margin:3px 0}
  .dlg .d-foot{display:flex; gap:8px; justify-content:flex-end; padding:12px 16px;
    background:#fafafa; border-top:1px solid #eee}
  .dlg button{appearance:none; font:inherit; font-size:12.5px; padding:7px 14px; border-radius:7px;
    border:1px solid #ddd; background:#fff; cursor:pointer; color:#333}
  .dlg button.pri{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
  .dlg button.dng{background:var(--danger); border-color:var(--danger); color:#fff; font-weight:600}
  .dlg .field{margin-top:12px}
  .dlg .field input{width:100%; font:inherit; padding:7px 9px; border:1px solid #ddd; border-radius:7px}
  .dlg .field label{display:block; font-size:11.5px; color:#6b6b70; margin-bottom:4px}
  .dlg .warnbox{background:#fff4f2; border:1px solid #f6cfc8; color:#8a2f22; border-radius:8px;
    padding:8px 10px; font-size:12px; margin-top:10px}

  /* 归档库表 */
  .lib{width:100%; background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden;
    font-size:12px}
  .lib .lh{display:flex; padding:8px 12px; background:#fafafa; border-bottom:1px solid var(--line);
    color:#6b6b70; font-size:11.5px; gap:10px}
  .lib .lg{padding:7px 12px; color:#8a8a8a; font-size:11.5px; background:#f6f9fb;
    border-bottom:1px solid #eef2f5}
  .lib .lr{display:flex; align-items:center; gap:10px; padding:9px 12px;
    border-bottom:1px solid #f0f0f0}
  .lib .lr:last-child{border-bottom:0}
  .lib .lr .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .lib .st{font-size:10.5px; padding:1px 6px; border-radius:5px; background:#eef2f5; color:#5a6b78}
  .lib .st.dead{background:#fdeeee; color:#b03a2e}
  .lib .st.live{background:#eaf7ee; color:#1a7f4b}
  .lib .act{font-size:11.5px; color:#2b6cb0; cursor:pointer}
  .lib .act.dng{color:var(--danger)}
  .muted{color:var(--sub)}

  .toolbar{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:10px}
  .toolbar .b{appearance:none; font:inherit; font-size:12px; padding:5px 11px; border-radius:7px;
    border:1px solid var(--line); background:#fff; cursor:pointer; color:#333}
  .toolbar .b:hover{background:#f7f7f8}
  .toolbar .b.pri{background:#fff; border-color:var(--accent); color:#0b7a43}
  .toolbar .lbl{font-size:11.5px; color:var(--sub)}
  .kbd{font:11px/1 ui-monospace,monospace; border:1px solid #d6d6da; border-bottom-width:2px;
    border-radius:4px; padding:1px 4px; color:#5a5a60; background:#fafafb}
  footer.end{max-width:1180px; margin:6px auto 40px; padding:0 20px; color:var(--sub); font-size:12px}
  footer.end b{color:var(--ink)}
  @media (max-width:520px){
    section[data-panel]{grid-template-columns:1fr}
    main{padding:12px} header.top{padding:12px 12px 0}
  }
</style>
</head>
<body>

<header class="top">
  <h1>会话归档 · 入口方案</h1>
  <p class="lead">
    内核已具备 <b>归档</b>（复印进归档库，可捞回）/ <b>撕原件</b>（真删，必须先归档）/ <b>打捞</b>。
    这里只挑<b>客户端入口怎么放</b>和<b>点下去问不问一句</b>。带 <span class="tag pick">推荐</span> 的只是我的倾向，都能换。<b>我的组合</b>：桌面 C（悬停 ⋯）+ A（右键兼容）+ E（清测试会话）+ 确认 1（归档不弹）与 2（撕原件必弹）；手机 H + 确认 2。
  </p>
  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true"  data-tab="desk">桌面端入口<span class="n">6</span></button>
    <button role="tab" aria-selected="false" data-tab="mobile">移动端入口<span class="n">4</span></button>
    <button role="tab" aria-selected="false" data-tab="confirm">确认交互<span class="n">3</span></button>
    <button role="tab" aria-selected="false" data-tab="library">归档库页面<span class="n">2</span></button>
  </nav>
</header>

<main>
  <section data-panel="desk" id="p-desk"></section>
  <section data-panel="mobile" id="p-mobile" hidden></section>
  <section data-panel="confirm" id="p-confirm" hidden></section>
  <section data-panel="library" id="p-library" hidden></section>
</main>

<footer class="end">
  这个页面是静态稿，不进构建。真的实现走 <b>NousDesk</b>（GPUI）和 <b>bjes6b</b>（手机端）各自的规矩。
  菜单文案与硬条件以内核为准：<span class="muted">归档 = 复印 + 墓碑；撕原件要先归档、会话闲置、分支里没有活后代；打捞 = 插回活库。</span>
</footer>

<script>
/* ============================================================
   0 · 小工具
   ============================================================ */
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};
const SESSIONS = [
  { av: "会", name: "会话归档怎么设计", pv: "先定入口，再谈确认", tm: "14:20", pin: true },
  { av: "模", name: "模型编目对账", pv: "Qoder 那个供应商又挂了", tm: "13:02" },
  { av: "触", name: "触发器调度器", pv: "每分钟 tick，fire 了起会话", tm: "11:48" },
  { av: "探", name: "zz-探针（可删）", pv: "bash · ls -la", tm: "昨天" },
  { av: "探", name: "zz-探针（可删）2", pv: "空", tm: "昨天" },
  { av: "技", name: "技能变体怎么绑", pv: "本名@id 就是另一个可装载名", tm: "周三" },
];
const DESKS = [];   /* 每个 mock 的句柄，用来统一关菜单/清理 */

/* 菜单：支持多层（右键 → 更多 → 子菜单）。每一层是一个独立 div，关最上层不动下面。 */
const ctxMenu = (() => {
  const stack = [];
  const remove = (m) => { const i = stack.indexOf(m); if (i >= 0) stack.splice(i, 1); m.remove(); };
  const closeAll = () => { while (stack.length) stack.pop().remove(); };
  const closeTop = () => { const m = stack.pop(); if (m) m.remove(); };
  document.addEventListener("pointerdown", (e) => {
    if (!stack.some((m) => m.contains(e.target))) closeAll();
  }, true);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeAll(); });
  const place = (m, x, y) => {
    m.classList.add("on");
    const r = m.getBoundingClientRect();
    m.style.left = Math.max(6, Math.min(x, innerWidth - r.width - 8)) + "px";
    m.style.top  = Math.max(6, Math.min(y, innerHeight - r.height - 8)) + "px";
  };
  return {
    close: closeAll,
    closeTop,
    /** 开一层菜单。anchorY 用来判断子菜单往左还是往右。x<0 = 贴右边。 */
    open(x, y, build) {
      if (stack.length > 1) closeTop();          /* 主菜单重开时先收子菜单 */
      let m = stack[0];
      if (!m) { m = el("div", "ctx"); document.body.append(m); stack.push(m); }
      m.innerHTML = "";
      build(m, closeAll);
      place(m, x, y);
      return m;
    },
    /** 在某个菜单项旁边开子菜单（父菜单保持开着）。 */
    openChild(anchor, build) {
      const m = el("div", "ctx");
      document.body.append(m);
      stack.push(m);
      build(m, closeAll);
      const a = anchor.getBoundingClientRect();
      const need = m.getBoundingClientRect().width + a.right + 12;
      place(m, need > innerWidth ? a.left - m.getBoundingClientRect().width - 2 : a.right + 2, a.top);
      return m;
    },
  };
})();
const item = (label, opts = {}) => {
  const it = el("div", "it" + (opts.danger ? " dng" : "") + (opts.disabled ? " dis" : ""), label);
  if (opts.hint) { const k = el("span", "k", opts.hint); it.append(k); }

/* 轻提示 */
const toast = (() => {
  let t = null, timer = 0;
  return (msg, danger) => {
    if (!t) {
      t = el("div");
      Object.assign(t.style, {
        position: "fixed", left: "50%", bottom: "26px", transform: "translateX(-50%)",
        zIndex: 200, padding: "9px 16px", borderRadius: "9px", fontSize: "12.5px",
        color: "#fff", background: "rgba(28,28,30,.92)", boxShadow: "0 8px 24px rgba(0,0,0,.25)",
        transition: "opacity .18s", opacity: "0", pointerEvents: "none", maxWidth: "78vw",
      });
      document.body.append(t);
    }
    t.textContent = msg;
    t.style.background = danger ? "rgba(176,43,34,.95)" : "rgba(28,28,30,.92)";
    t.style.opacity = "1";
    clearTimeout(timer);
    timer = setTimeout(() => (t.style.opacity = "0"), 1900);
  };
})();

/* 通用对话框 */
function dialog({ title, body, confirm, danger, cancel = "取消", extra, onConfirm }) {
  const wrap = el("div");
  Object.assign(wrap.style, {
    position: "fixed", inset: "0", zIndex: 300, display: "grid", placeItems: "center",
    background: "rgba(20,20,22,.34)", backdropFilter: "blur(1.5px)",
  });
  const d = el("div", "dlg");
  d.append(el("div", "d-head", title));
  const b = el("div", "d-body");
  if (typeof body === "string") b.append(document.createTextNode(body));
  else b.append(body);
  if (extra) b.append(extra);
  d.append(b);
  const f = el("div", "d-foot");
  const c = el("button", "", cancel);
  const ok = el("button", danger ? "dng" : "pri", confirm);
  c.addEventListener("click", () => wrap.remove());
  ok.addEventListener("click", () => { wrap.remove(); onConfirm && onConfirm(); });
  f.append(c, ok);
  d.append(f);
  wrap.append(d);
  wrap.addEventListener("pointerdown", (e) => { if (e.target === wrap) wrap.remove(); });
  document.body.append(wrap);
  return wrap;
}

/* 右键菜单：三种组织方式 */
function rowMenu(m, close, s, { sub = false, scheme = "flat" } = {}) {
  m.append(cap(s.name));
  m.append(item("打开", { run: () => toast("（demo）打开会话") }));
  m.append(item(s.pin ? "取消置顶" : "置顶该聊天", { run: () => toast(s.pin ? "（demo）取消置顶" : "（demo）置顶") }));
  m.append(sep());

  if (scheme === "nested") {
    /* 方案 B：一个「更多」子菜单（hover 或点都行；父菜单不关） */
    const more = item("更多", { sub: "›", noClose: true, run: () => {} });
    let opened = null;
    const showSub = () => {
      if (opened) return;
      opened = ctxMenu.openChild(more, (mm) => {
        mm.append(item("归档该聊天…", { run: () => archiveFlow(s, false) }));
        mm.append(item("撕原件…", { sub: "先归档", run: () => purgeBlocked() }));
        mm.append(sep());
        mm.append(item("复制会话 id", { run: () => toast("（demo）已复制 710") }));
      });
      opened.dataset.child = "1";
    };
    more.addEventListener("pointerenter", showSub);
    more.addEventListener("click", showSub);
    more.addEventListener("pointerleave", () => {
      setTimeout(() => {
        const child = document.querySelector('.ctx[data-child="1"]');
        if (!child) return;
        if (child.matches(":hover") || more.matches(":hover")) return;
        child.remove(); opened = null;
      }, 260);
    });
    m.append(more);
  } else if (scheme === "grouped") {
    /* 方案 F：分组标题 */
    m.append(cap("归档"));
    m.append(item("归档该聊天…", { run: () => archiveFlow(s, false) }));
    m.append(item("归档库…", { run: () => toast("（demo）打开归档库页") }));
  } else {
    m.append(item("归档该聊天…", { run: () => archiveFlow(s, false) }));
    m.append(item("撕原件…", { sub: "先归档", run: () => purgeBlocked() }));
  }
  m.append(sep());
  m.append(item("重命名", { run: () => toast("（demo）重命名") }));
  m.append(item("复制名字", { run: () => toast("（demo）已复制") }));
}

  /* 长按/演示：长按之后发生什么（面板或浮层） */

        m.append(item("撕原件…", { sub: "先归档", run: () => purgeBlocked() }));
      });
    }
  };

  /* 长按：520ms */
  made.forEach(({ row }, i) => {
    let timer = 0, moved = false, sx = 0, sy = 0, longPressed = false;
    row.addEventListener("pointerdown", (e) => {
      moved = false; longPressed = false; sx = e.clientX; sy = e.clientY;
      row.classList.add("hold");
      if (opts.longPress) {
        timer = setTimeout(() => {
          longPressed = true;
          row.classList.remove("hold");
          if (navigator.vibrate) navigator.vibrate(8);

      if (!row._sx && row._sx !== 0) return;
      const dx = Math.min(0, e.clientX - row._sx);

      clearTimeout(timer);

        const acts = row.parentElement.querySelector(".swipe-acts");
        const t = row.style.transform.match(/-?[\d.]+/);
        const cur = t ? Math.abs(Number(t[0])) : 0;
        const open = cur > 50;
        const w = open ? 140 : 0;
        row.style.transform = open ? "translateX(-140px)" : "";
        acts.style.width = w + "px";
        if (open) return;
      }
      if (!longPressed && !moved) {
        /* 单击 = 打开会话（demo 只提示） */
        toast(`（demo）打开「${SESSIONS[i].name}」`);
      }
      longPressed = false;
    };
    row.addEventListener("pointerup", end);
    row.addEventListener("pointercancel", end);
    row.addEventListener("pointerleave", () => { if (!longPressed) clearTimeout(timer); row.classList.remove("hold"); });
  });

  /* 会话页右上 ⋯ */
  k.addEventListener("click", (e) => {
    const b = e.currentTarget.getBoundingClientRect();
    ctxMenu.open(b.right - 180, b.bottom + 6, (m) => {

      m.append(item("撕原件…", { sub: "先归档", run: () => purgeBlocked() }));
    });
  });

  return {
    ph, hide,
    /* 「演示一下」按钮用：不真的长按，直接出结果 */
    demo: (i = 3) => {
      if (opts.kOnly) { k.click(); return; }

      const acts = wrap.querySelector(".swipe-acts");
      if (acts) acts.style.width = "140px";
    },

}

const confirmPanel = document.getElementById("p-confirm");

const mkConfirmCard = (title, tags, why, bodyBuilder, foot, btnLabel = "点这里看效果", demo) => {
  const stage = el("div");
  stage.style.minHeight = "150px";
  stage.style.display = "grid";
  stage.style.placeItems = "center";
  stage.style.width = "100%";
  const run = () => { stage.innerHTML = ""; stage.append(bodyBuilder()); };
  stage.append(el("div", "muted", "点右下角按钮 —— 这一档的交互会直接弹出来"));
  confirmPanel.append(card({ title, tags, why, body: stage, foot, tools: [b(btnLabel, demo || run, true)] }));
};

{

/* ============================================================
   8 · Tab 切换
   ============================================================ */
const tabs = [...document.querySelectorAll("nav.tabs button")];
const panels = {
  desk: document.getElementById("p-desk"),
  mobile: document.getElementById("p-mobile"),
  confirm: document.getElementById("p-confirm"),
  library: document.getElementById("p-library"),
};
const show = (key) => {
  tabs.forEach(t => t.setAttribute("aria-selected", String(t.dataset.tab === key)));
  Object.entries(panels).forEach(([k, p]) => { p.hidden = k !== key; });
  ctxMenu.close();
  location.hash = "#" + key;
  window.scrollTo({ top: 0 });
};
tabs.forEach(t => t.addEventListener("click", () => show(t.dataset.tab)));
const params = new URLSearchParams(location.search);
const initial = params.get("tab") || location.hash.replace("#", "");
show(panels[initial] ? initial : "desk");
/* 自检用：?auto=menu 自动把第一张桌面卡的菜单打开（截图核对定位） */
if (params.get("auto") === "menu") DESKS[0]?.preview?.();
if (params.get("auto") === "dialog") document.querySelector("#p-confirm .card:nth-child(2) .toolbar .b")?.click();
if (params.get("auto") === "phone") document.querySelector("#p-mobile .card:nth-child(1) .toolbar .b")?.click();
</script>
