<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NousDesk · 关于 → 插件 · 文档阅读（Cybertruck 皮）</title>
<style>
__FONTS__
:root {
  /* Cybertruck 皮（crates/nousdesk/src/theme.rs → Skin::CYBERTRUCK） */
  --sidebar: #2a2d30; --sidebar-hover: #34383b;
  --list-bg: #303336; --chat-bg: #232628; --panel: #34373a;
  --panel-alt: #2d3033; --surface: #3b3e42; --overlay: #35383c;
  --text: #e8eaec; --text-2: #b0b4b8; --muted: #83888d; --faint: #5c6166;
  --line: #454a4e; --line-strong: #575d62; --line-soft: #393d40;
  --accent: #ff6b1a; --accent-hover: #ff8038; --accent-soft: #3d2a1c; --accent-fg: #ff8a4d;
  --ok: #4dd08a; --hover: #383c3f; --selected: #40454a;
  --code-bg: #3b3e42;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: Archivo, "Noto Sans CJK SC", "Noto Sans SC", "PingFang SC", sans-serif;
  background: #17191b; color: var(--text); font-size: 13px;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
.mono { font-family: "JBMono", ui-monospace, monospace; }
::selection { background: var(--accent-soft); color: var(--accent-fg); }

/* ── demo 切换（不进产品） ───────────────────────────── */
.picker {
  position: fixed; right: 18px; bottom: 18px; z-index: 90;
  display: flex; align-items: center; gap: 2px; padding: 3px;
  background: #202325; border: 1px solid var(--line); box-shadow: 0 12px 32px #00000066;
  font-size: 11.5px;
}
.picker .lbl { color: var(--faint); padding: 5px 8px 5px 6px; letter-spacing: .04em; }
.picker button {
  border: 0; background: transparent; color: var(--text-2); cursor: pointer;
  padding: 5px 11px; font: inherit; letter-spacing: .02em;
}
.picker button:hover { background: var(--hover); }
.picker button.on { background: var(--accent-soft); color: var(--accent-fg); }

/* ── 桌面与窗口 ─────────────────────────────────────── */
.stage { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 46px 24px 30px; gap: 22px; }
.win {
  width: 1120px; height: 720px; flex: none; display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid #0f1112;
  box-shadow: 0 34px 90px #00000080, 0 0 0 1px #ffffff08 inset;
}
.titlebar {
  height: 38px; flex: none; display: flex; align-items: center; padding: 0 10px 0 14px;
  background: var(--sidebar); border-bottom: 1px solid #222527;
}
.titlebar .brand { font-size: 11.5px; color: var(--muted); letter-spacing: .06em; }
.titlebar .wbtns { margin-left: auto; display: flex; }
.titlebar .wbtns i {
  width: 34px; height: 26px; display: grid; place-items: center; font-style: normal;
  font-size: 9px; color: var(--muted);
}
.titlebar .wbtns i:hover { background: var(--sidebar-hover); color: var(--text); }
.titlebar .wbtns i.x:hover { background: #c4432b; color: #fff; }

.shead {
  height: 48px; flex: none; display: flex; align-items: center; gap: 10px;
  padding: 0 14px; background: var(--list-bg); border-bottom: 1px solid var(--line-soft);
}
.back { display: flex; align-items: center; gap: 6px; padding: 5px 7px; font-size: 12px; color: var(--text-2); cursor: pointer; }
.back:hover { background: var(--line-soft); color: var(--text); }
.shead .stitle { font-size: 13px; color: var(--text); }

.sbody { flex: 1; min-height: 0; display: flex; }
.snav {
  width: 170px; flex: none; padding: 10px; background: var(--panel-alt);
  border-right: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 2px;
}
.snav .it {
  display: flex; align-items: center; gap: 9px; padding: 8px 10px;
  font-size: 12.5px; color: var(--text-2); cursor: pointer;
}
.snav .it .ic { width: 14px; height: 14px; border: 1px solid var(--faint); opacity: .7; }
.snav .it:hover { background: var(--line-soft); }
.snav .it.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.snav .it.on .ic { border-color: var(--accent); opacity: 1; }
.snav .grow { flex: 1; }
.snav .foot { font-size: 10.5px; color: var(--faint); padding: 0 10px 2px; letter-spacing: .02em; }

.pane { flex: 1; min-width: 0; padding: 20px 22px 0; display: flex; flex-direction: column; }
.page-head { display: flex; align-items: center; gap: 14px; padding-bottom: 14px; flex: none; }
.page-head h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .01em; }
.seg { display: flex; gap: 1px; padding: 2px; background: var(--surface); border: 1px solid var(--line-soft); }
.seg span { padding: 4px 11px; font-size: 11.5px; color: var(--text-2); cursor: pointer; }
.seg span.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.seg span:not(.on):hover { background: var(--hover); color: var(--text); }

/* ── 插件页骨架：列表 + 详情 ─────────────────────────── */
.plugins { position: relative; flex: 1; min-height: 0; display: flex; gap: 0; overflow: hidden; }
.plist {
  width: 292px; flex: none; display: flex; flex-direction: column; min-height: 0;
  background: var(--chat-bg); border-right: 1px solid var(--line-soft);
  margin: -20px 0 0 -22px; padding: 20px 16px 20px 22px;
}
.plist .sum { font-size: 10.5px; color: var(--faint); letter-spacing: .02em; padding: 0 10px 12px; }
.plist .rows { display: flex; flex-direction: column; overflow: auto; }
.prow {
  position: relative; height: 35px; flex: none; display: flex; align-items: center; gap: 10px;
  padding: 0 10px; cursor: pointer; color: var(--text-2);
}
.prow:hover { background: var(--hover); color: var(--text); }
.prow.on { background: var(--hover); color: var(--text); }
.prow.on .nm { font-weight: 500; }
.prow.on::before { content: ""; position: absolute; left: 0; top: 7px; bottom: 7px; width: 2px; background: var(--accent); }
.prow .sq { width: 5px; height: 5px; flex: none; border-radius: 50%; background: var(--ok); }
.prow.off .sq { background: var(--faint); }
.prow .nm { flex: 1; min-width: 0; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow .vr { font-size: 10px; color: var(--faint); letter-spacing: .01em; opacity: 0; transition: opacity .12s ease; }
.prow:hover .vr, .prow.on .vr { opacity: 1; }

.pdetail { flex: 1; min-width: 0; padding-left: 30px; padding-bottom: 20px; overflow: auto; }

/* ── 文档排版（三套共用） ────────────────────────────── */
.crumb { font-family: "JBMono", ui-monospace, monospace; font-size: 10px; color: var(--accent-fg); letter-spacing: .12em; margin-bottom: 12px; }
.crumb b { color: var(--text-2); font-weight: 500; }
.dtitle { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; }
.dsub { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 11.5px; color: var(--muted); }
.dsub .st { color: var(--ok); }
.dsub .st.off { color: var(--faint); }
.dsub .sep { width: 3px; height: 3px; background: var(--faint); opacity: .6; }
.dsub .v { font-size: 10.5px; }
.reading { margin-top: 28px; padding-top: 28px; border-top: 1px solid var(--line-soft); max-width: 600px; }
.reading .lead { margin: 0 0 32px; font-size: 17px; line-height: 1.85; color: var(--text); letter-spacing: .004em; }
.sect { margin: 0 0 30px; }
.sect .k {
  display: block; margin-bottom: 9px; font-size: 10.5px; font-weight: 500;
  color: var(--muted); letter-spacing: .18em;
}
.sect .v { margin: 0; font-size: 14.5px; line-height: 1.95; color: #c9cdd0; }
.reading .meta { margin-top: 32px; font-size: 10.5px; color: var(--muted); letter-spacing: .05em; }
.reading code { font-family: "JBMono", ui-monospace, monospace; font-size: 11px; padding: 1px 4px; background: var(--code-bg); color: var(--text); }

/* 技术细节（方案 1 折叠 / 方案 2 侧栏） */
.deets { margin-top: 34px; padding-top: 15px; border-top: 1px solid var(--line-soft); }
.deets .tg { display: inline-flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--text-2); cursor: pointer; letter-spacing: .04em; }
.deets .tg:hover { color: var(--text-2); }
.deets .tg .cv { font-size: 8px; transition: transform .14s ease; }
.deets.open .tg .cv { transform: rotate(90deg); }
.deets .bd { display: none; margin-top: 14px; }
.deets.open .bd { display: block; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 24px; max-width: 500px; }
.fact .k { display: block; font-size: 10px; color: var(--faint); letter-spacing: .1em; margin-bottom: 3px; }
.fact .v { font-size: 11.5px; color: var(--text-2); }
.eps { margin-top: 20px; }
.eps .ttl { font-size: 10px; color: var(--faint); letter-spacing: .1em; margin-bottom: 7px; }
.ep { display: flex; gap: 12px; padding: 3px 0; font-family: "JBMono", ui-monospace, monospace; font-size: 10.5px; }
.ep .m { width: 40px; flex: none; color: var(--muted); }
.ep .m.post { color: var(--accent); }
.ep .p { color: var(--text-2); }

/* ── 方案 2：技术侧栏 ───────────────────────────────── */
.split .pdetail { display: flex; gap: 0; padding-left: 20px; }
.split .doccol { flex: 1; min-width: 0; padding-right: 20px; }
.split .side {
  width: 252px; flex: none; align-self: stretch; margin: 0 -22px 0 0;
  padding: 2px 20px 20px; background: var(--panel-alt); border-left: 1px solid var(--line-soft);
}
.split .side .facts { grid-template-columns: 1fr; gap: 0; }
.split .side .fact {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  padding: 9px 0; border-bottom: 1px solid #33373a;
}
.split .side .fact .k { margin: 0; flex: none; font-size: 10.5px; letter-spacing: .06em; }
.split .side .fact .v { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.split .ep { font-size: 10px; }
.split .ep .p { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side .h { font-size: 10px; color: var(--muted); letter-spacing: .16em; margin: 0 0 12px; }
.side .fact { margin-bottom: 14px; }
.side .eps { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line-soft); }

/* ── 方案 3：信息页 + 右滑阅读列 ─────────────────────── */
.docbtn {
  margin-left: auto; display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 12px; background: var(--surface); border: 1px solid var(--line-soft);
  color: var(--text-2); font: inherit; font-size: 11.5px; cursor: pointer;
}
.docbtn:hover { border-color: var(--accent); color: var(--accent-fg); }
.docbtn .kbd { font-size: 10px; color: var(--faint); border: 1px solid var(--line); padding: 0 4px; }
.thead { display: flex; align-items: flex-start; gap: 12px; }
.infogrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line-soft); border: 1px solid var(--line-soft); margin-top: 24px; }
.infogrid .cell { background: var(--panel); padding: 13px 14px 15px; }
.infogrid .k { display: block; font-size: 10px; color: var(--faint); letter-spacing: .12em; margin-bottom: 6px; }
.infogrid .v { font-size: 12px; color: var(--text-2); }
.infopage .eps { margin-top: 26px; }

.reader {
  position: absolute; top: -20px; left: 292px; right: -22px; bottom: 0; z-index: 20;
  background: #262a2c; border-left: 1px solid var(--line); visibility: hidden;
  box-shadow: -30px 0 60px #0000004d;
  transform: translateX(102%); transition: transform .2s cubic-bezier(.22,.8,.24,1);
  display: flex; flex-direction: column;
}
.reader.on { transform: translateX(0); visibility: visible; }
.reader .rhead {
  height: 46px; flex: none; display: flex; align-items: center; gap: 10px;
  padding: 0 16px; border-bottom: 1px solid var(--line-soft);
}
.reader .rhead .who { font-size: 11.5px; color: var(--text-2); }
.reader .rhead .who b { color: var(--text); font-weight: 600; }
.reader .rhead .x { margin-left: auto; font-size: 11px; color: var(--muted); cursor: pointer; padding: 4px 6px; }
.reader .rhead .x:hover { background: var(--hover); color: var(--text); }
.reader .rbody { flex: 1; overflow: auto; padding: 28px 40px 40px; }
.reader .reading { max-width: 520px; }
.reader .rfoot { flex: none; padding: 10px 34px 14px; border-top: 1px solid var(--line-soft); font-size: 10.5px; color: var(--faint); letter-spacing: .02em; }

/* 方案切换 */
[data-scheme="1"] .only-2, [data-scheme="1"] .only-3 { display: none !important; }
[data-scheme="2"] .only-1, [data-scheme="2"] .only-3 { display: none !important; }
[data-scheme="3"] .only-1, [data-scheme="3"] .only-2 { display: none !important; }

.why { width: 1120px; color: #8b9196; font-size: 12px; line-height: 1.85; letter-spacing: .01em; }
.why b { color: #c3c8cc; font-weight: 600; }
.why .tag { color: var(--accent-fg); letter-spacing: .08em; margin-right: 6px; }
</style>
</head>
<body data-scheme="1">

<div class="stage">
  <div class="win" style="height:660px">
    <div class="titlebar">
      <span class="brand">NousDesk</span>
      <div class="wbtns"><i>–</i><i>□</i><i class="x">✕</i></div>
    </div>
    <div class="shead">
      <span class="back">← 返回聊天</span>
      <span class="stitle">设置</span>
    </div>
    <div class="sbody">
      <nav class="snav">
        <div class="it">连接</div>
        <div class="it">主题</div>
        <div class="it">声音</div>
        <div class="it on">关于</div>
        <div class="grow"></div>
        <div class="foot">local · 12 ms</div>
      </nav>
      <main class="pane">
        <div class="page-head">
          <h1>关于</h1>
          <div class="seg"><span>概览</span><span class="on">插件 14</span></div>
        </div>
        <div class="plugins">
          <aside class="plist">
            <div class="rows" id="rows"></div>
          </aside>
          <section class="pdetail" id="detail"></section>
          <div class="reader" id="reader">
            <div class="rhead">
              <span class="who" id="readerWho"></span>
              <span class="x" onclick="closeReader()">✕ 关闭</span>
            </div>
            <div class="rbody" id="readerBody"></div>
            <div class="rfoot" id="rfoot"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="why" id="why"></div>
</div>

<div class="picker">
  <span class="lbl">方案</span>
  <button data-set="1" class="on">01 文档即主体</button>
  <button data-set="2">02 技术侧栏</button>
  <button data-set="3">03 右滑阅读</button>
</div>

<script>
/* 真数据：来自内核仓 crates/nous/<module>/README.md（2026-11-24 规则 7 后的正文） */
const MODULES = [
  { name: "sessions", label: "会话", version: "0.1.25", enabled: true, layer: "app", kind: "编译期", required: "是", crate: "nous-sessions",

    when: "要让一条消息真正跑起来、中途取消、并收敛到一个确定的终态时。",
    notFor: "不做 HTTP 与事件编码（server、wire），也不直接存库（durable）。",

  { name: "env", label: "执行环境", version: "0.1.25", enabled: true, layer: "platform", kind: "编译期", required: "是", crate: "nous-env",
    lead: "执行环境的契约层：文件系统与命令执行两张 trait，外加四条私库路径的解析。",
    when: "任何要读写技能库、模板库、扩展库或提示词库的代码，都从这里拿路径和能力。",
    notFor: "不决定内容长什么样、不做 git 发布、不做缓存；本地与远端实现都在它之下。",
    eps: [["GET","/v1/fs/dirs"]] },
  { name: "repo", label: "私库读写", version: "0.1.25", enabled: true, layer: "platform", kind: "编译期", required: "是", crate: "nous-repo",
    lead: "四套私库的文件读写与发布：增删改、git 提交与归档、变体、上游追踪。全仓唯一的 git 进程面。",
    when: "任何要落盘并留下版本记录的技能、模板、扩展或提示词改动。",
    notFor: "不解析配置路径（env 给），也不决定内容长什么样（各插件自己判定）。",

  { name: "presets-admin", label: "模板管理", version: "0.1.25", enabled: true, layer: "app", kind: "编译期", required: "否", crate: "nous-presets-admin",
    lead: "模板管理的判定层：形状校验、引用解析、名册投影。全是纯函数，不碰盘。",

  { name: "skills", label: "技能", version: "0.1.25", enabled: true, layer: "app", kind: "声明式", required: "否", crate: "nous-skills",

  { name: "archive", label: "归档", version: "0.1.25", enabled: true, layer: "app", kind: "编译期", required: "否", crate: "—",

    notFor: "不是 Git 归档，也不动会话内容本身。",
    eps: [["GET","/v1/archive"],["POST","/v1/sessions/:id/archive"],["POST","/v1/archive/:id/restore"]] },

    notFor: "不建表、不写库、不常驻采样；每次都是现算，数据来自 durable 与 store。",
    eps: [["GET","/v1/stats/usage"],["GET","/v1/stats/tasks"],["GET","/v1/stats/db"]] },
  { name: "device", label: "设备", version: "0.1.25", enabled: true, layer: "app", kind: "编译期", required: "是", crate: "nous-device",
    lead: "机器编目与模型编目：有哪些机器、有哪些可选模型、默认模型是哪个。",
    when: "界面要列可用模型、切换默认模型，或者要挑一台机器去执行时。",
    notFor: "不真正跑模型，也不验证供应商密钥能不能用；它只维护编目这份数据。",
    eps: [["GET","/v1/device"],["GET","/v1/capabilities"],["PUT","/v1/default"]] },
  { name: "prompts", label: "提示词", version: "0.1.25", enabled: true, layer: "app", kind: "编译期", required: "是", crate: "nous-prompts",
    lead: "提示词目录的只读扫描，加上一个纯函数 render()：把模板与变量拼成最终文本。",
    when: "要列出有哪些提示词、读一份、或者按参数渲染出最终内容时。",
    notFor: "不写盘、不碰 git、不看时钟；发布与文件管理在管理面，读写归 repo。",
    eps: [["GET","/v1/prompts"]] },
  { name: "ext", label: "扩展", version: "0.1.25", enabled: true, layer: "app", kind: "编译期", required: "否", crate: "nous-ext",
    lead: "扩展运行时：一个扩展一个进程，长度前缀的帧通道，外加隔离、预算、熔断、热重载与管理面。",
    when: "要安装、启动、重启或查看一个扩展，以及它越界时把它按住。",
    notFor: "不定义扩展能做什么（契约在 ext-sdk），也不实现扩展本身。",
    eps: [["GET","/v1/extensions"],["POST","/v1/extensions/reload"],["POST","/v1/extensions/install"]] },
  { name: "elements", label: "元素库", version: "0.1.25", enabled: true, layer: "app", kind: "编译期", required: "否", crate: "nous-elements",
    lead: "元素库的盘上真相：一个 JSON 一个元素，分「组」和「包」两类，写一次提交一次。",
    when: "要复用提示词、规则、清单或文件，并且希望它们像数据一样被版本管理时。",
    notFor: "不做模型编目投影（那在 element-models），也不做 git 发布（那在 repo）。",
    eps: [["GET","/v1/elements"],["POST","/v1/elements/push"],["DELETE","/v1/elements/:kind/:id"]] },
];

let selected = 0;

const sub = (m) => `<div class="dsub">
  <span class="st ${m.enabled ? "" : "off"}">${m.enabled ? "启用" : "未启用"}</span><span class="sep"></span>
  <span>${m.layer} 层</span><span class="sep"></span><span>${m.required === "是" ? "必需" : "可选"}</span><span class="sep"></span>
  <span class="v mono">v${m.version}</span>
</div>`;

const facts = (m) => `<div class="facts">
  <div class="fact"><span class="k">类型</span><span class="v">${m.kind}</span></div>
  <div class="fact"><span class="k">层</span><span class="v">${m.layer}</span></div>
  <div class="fact"><span class="k">必需</span><span class="v">${m.required}</span></div>
  <div class="fact"><span class="k">来源 crate</span><span class="v mono">${m.crate}</span></div>
</div>`;

const eps = (m) => m.eps.length ? `<div class="eps"><div class="ttl">端点 · ${m.eps.length}</div>
  ${m.eps.map(([k, p]) => `<div class="ep"><span class="m ${k === "POST" ? "post" : ""}">${k}</span><span class="p">${p}</span></div>`).join("")}
</div>` : "";

const reading = (m) => {
  const han = (m.lead + m.when + m.notFor).replace(/[^\u4e00-\u9fff]/g, "").length;
  return `<div class="reading">
  <p class="lead">${m.lead}</p>
  <div class="sect"><span class="k">什么时候用</span><p class="v">${m.when}</p></div>
  <div class="sect"><span class="k">不负责</span><p class="v">${m.notFor}</p></div>
  <div class="meta">约 ${han} 汉字 · crates/nous/${m.name}/README.md</div>
</div>`;
};

const deets = (m, open) => `<div class="deets ${open ? "open" : ""}">
  <span class="tg" onclick="this.parentNode.classList.toggle('open')"><span class="cv">▶</span>技术细节</span>
  <div class="bd">${facts(m)}${eps(m)}</div>
</div>`;

function render() {
  const m = MODULES[selected];
  document.getElementById("rows").innerHTML = MODULES.map((x, i) => `
    <div class="prow ${i === selected ? "on" : ""} ${x.enabled ? "" : "off"}" onclick="pick(${i})">
      <span class="sq"></span><span class="nm">${x.label}</span><span class="vr mono">${x.version}</span>
    </div>`).join("");

  const head = `<div class="crumb">${m.name}</div>
    <h2 class="dtitle">${m.label}</h2>${sub(m)}`;

  const only1 = `<div class="only-1">${head}${reading(m)}${deets(m, false)}</div>`;
  const only2 = `<div class="only-2 split" style="display:flex;height:100%">
      <div class="doccol">${head}${reading(m)}</div>
      <div class="side"><div class="h">技术细节</div>${facts(m)}${eps(m)}</div>
    </div>`;
  const only3 = `<div class="only-3 infopage">
      <div class="thead"><div style="min-width:0"><div class="crumb">${m.name}</div>
        <h2 class="dtitle">${m.label}</h2>${sub(m)}</div>
        <button class="docbtn" onclick="openReader()">读文档</button></div>
      <div class="infogrid">
        <div class="cell"><span class="k">类型</span><span class="v">${m.kind}</span></div>
        <div class="cell"><span class="k">层</span><span class="v">${m.layer}</span></div>
        <div class="cell"><span class="k">必需</span><span class="v">${m.required}</span></div>
        <div class="cell"><span class="k">来源 crate</span><span class="v mono" style="font-size:11px">${m.crate}</span></div>
      </div>
      ${eps(m)}
    </div>`;

  document.getElementById("detail").innerHTML = only1 + only2 + only3;

  document.getElementById("readerWho").innerHTML = `<b>文档</b> <span style="opacity:.4">/</span> ${m.name}`;
  document.getElementById("readerBody").innerHTML = `<h2 class="dtitle">${m.label}</h2>${sub(m)}${reading(m)}`;
  document.getElementById("rfoot").innerHTML = `<span class="mono" style="opacity:.65">Esc</span> 关闭 · 内容来自 crates/nous/${m.name}/README.md`;
}

const WHY = {
  1: "<span class='tag'>01 文档即主体</span><b>打开插件，先读那 300 字。</b>标题 → 一句定义 → 两个小节（什么时候用 / 不负责）；类型、crate、端点收进底部「技术细节」。理由：插件页第一位的任务是「这是什么」，开发信息是第二位的；Tesla 的先删后加。<b>代价</b>：查端点要多点一次。",
  2: "<span class='tag'>02 技术侧栏</span><b>文档在左，事实在右。</b>右侧 236px 常驻技术面板（类型 / 层 / 必需 / crate / 端点），文档按阅读宽度排。理由：既不用点开，也不让开发信息挤进正文。代价：文档区变窄，窗口小于 1000px 时侧栏得收掉。",
  3: "<span class='tag'>03 右滑阅读</span><b>信息页不动，文档单独滑出来。</b>详情页保持现在的密度（四格字段 + 端点清单），右上「读文档」从右滑出 604px 阅读列，Esc / ✕ 关闭。理由：读和查是两个动作，各有各的宽版面。代价：多一层浮现，且窄窗下阅读列要占满整宽。",
};

function pick(i) { selected = i; closeReader(); render(); }
function openReader() { document.getElementById("reader").classList.add("on"); }
function closeReader() { document.getElementById("reader").classList.remove("on"); }

document.querySelectorAll(".picker button").forEach(b => b.addEventListener("click", () => {
  const s = b.dataset.set;
  document.body.dataset.scheme = s;
  document.querySelectorAll(".picker button").forEach(x => x.classList.toggle("on", x === b));
  document.getElementById("why").innerHTML = WHY[s];
  closeReader();
}));
document.getElementById("why").innerHTML = WHY[1];
render();
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeReader();
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "d") { e.preventDefault(); openReader(); }
});
</script>
</body>
</html>
