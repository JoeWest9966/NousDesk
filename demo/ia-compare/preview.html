* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: #0a0b0c; color: #e7e9ea;
  font: 400 12.5px/1.5 Inter, "Noto Sans CJK SC", "Source Han Sans SC", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; display: flex; overflow: hidden;
}

/* ── 挑方案的那一列 ─────────────────────────────────────────── */
.picker { width: 262px; flex: 0 0 262px; height: 100vh; overflow: auto; background: #111315;
  border-right: 1px solid #202428; padding: 22px 16px 18px; }
.picker::-webkit-scrollbar { width: 0; }
.picker h1 { font-size: 13px; font-weight: 600; }
.picker .sub { font-size: 10.5px; line-height: 1.75; color: #7c848a; margin: 7px 0 16px; }
.plist { display: flex; flex-direction: column; gap: 1px; }
.plist button { display: flex; align-items: baseline; gap: 9px; padding: 7px 8px; border: 0;
  border-left: 2px solid transparent; background: transparent; color: #98a0a6; font: inherit;
  text-align: left; cursor: pointer; }
.plist button:hover { color: #e7e9ea; background: #171a1d; }
.plist button.on { border-left-color: #07c160; color: #fff; background: #1b1f22; }
.plist b { font: 500 9.5px/1 JBMono, monospace; color: #5f676d; min-width: 18px; }
.plist button.on b { color: #07c160; }
.plist span { font-size: 11px; line-height: 1.45; }
.pnote { margin-top: 14px; padding-top: 13px; border-top: 1px solid #22262a;
  font-size: 10.5px; line-height: 1.85; color: #8a9298; }
.pnote b { display: block; color: #e7e9ea; font-weight: 600; margin-bottom: 5px; }
.pnote em { font-style: normal; color: #b9c0c5; }
.pnote .cost { color: #c9a227; }
.skinbar { margin-top: 14px; padding-top: 12px; border-top: 1px solid #22262a;
  display: flex; align-items: center; gap: 6px; font-size: 10px; color: #7c848a; }
.skinbar button { height: 22px; padding: 0 9px; border: 1px solid #22262a; background: transparent;
  color: #98a0a6; font: inherit; font-size: 10px; border-radius: 5px; cursor: pointer; }
.skinbar button:hover { color: #e7e9ea; border-color: #343a3f; }
.skinbar button.on { background: #1b1f22; color: #fff; border-color: #3a3f44; }
.pfoot { margin-top: 14px; padding-top: 11px; border-top: 1px solid #22262a;
  font-size: 9.5px; line-height: 1.9; color: #5f676d; }
.pfoot code { font-family: JBMono, monospace; color: #8a9298; }
.pfoot .hint { color: #b9c0c5; }

/* ── 舞台 ──────────────────────────────────────────────────── */
.stage { flex: 1; height: 100vh; display: grid; place-items: center; overflow: hidden;
  background: radial-gradient(1300px 760px at 58% 42%, #15181a 0%, #0a0b0c 72%); padding: 22px; }
.scaler { position: relative; }
.app { position: absolute; top: 0; left: 0; width: 1280px; height: 800px; display: flex;
  overflow: hidden; transform-origin: top left;
  box-shadow: 0 34px 100px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.05); }

/* ── 皮（Palette::DEFAULT / Palette::AMBER）────────────────────── */
.app[data-skin="default"] {
  --sidebar:#2e2e2e; --sidebar-hover:#3a3a3a; --sidebar-open:#3f3f3f; --idle:#9a9a9a;
  --list:#f7f7f7; --chat:#ededed; --panel:#fff; --panel2:#fafafa; --surface:#f6f6f6;
  --ink:#1a1a1a; --ink2:#333; --muted:#999; --faint:#aaa;
  --line:#e6e6e6; --line-2:#e2e2e2; --line-soft:#eee;
  --accent:#07c160; --accent-h:#06ad56; --accent-soft:#e8f7ee; --accent-fg:#0a7a3f;
  --accent-tint:#07c16022; --on-accent:#fff;
  --danger:#d32f2f; --danger-soft:#fff1f0; --danger-fg:#c0392b;
  --warn:#c77700; --warn-soft:#fff8ee; --ok:#079c50; --ok-fg:#2e7d32;
  --link:#0b6bcb; --hover:#f2f2f2; --selected:#d9d9d9; --disabled:#b2b2b2;
  --avatar:#7ba7d7; --code:#f6f6f4; --r:1;
}
.app[data-skin="amber"] {
  --sidebar:#090806; --sidebar-hover:#17150f; --sidebar-open:#211d15; --idle:#6f6656;
  --list:#0d0c0a; --chat:#0d0c0a; --panel:#12110e; --panel2:#17150f; --surface:#17150f;
  --ink:#f0e9dc; --ink2:#d6c9ae; --muted:#b4a88e; --faint:#968c78;
  --line:#251f18; --line-2:#322a1f; --line-soft:#1c1712;
  --accent:#e8a33d; --accent-h:#f2b455; --accent-soft:#2a2113; --accent-fg:#e8a33d;
  --accent-tint:#e8a33d22; --on-accent:#14110c;
  --danger:#d8705f; --danger-soft:#2a1712; --danger-fg:#d8705f;
  --warn:#e8a33d; --warn-soft:#2a2113; --ok:#7fb489; --ok-fg:#7fb489;
  --link:#e8a33d; --hover:#17150f; --selected:#211d15; --disabled:#6b6354;
  --avatar:#e8a33d; --code:#17150f; --r:.375;
}

/* ── 通用零件（跟触发器工作台那套方言一致）────────────────────── */
.app { background: var(--panel); color: var(--ink); font-size: 12.5px; }
.mono { font-family: JBMono, monospace; font-variant-numeric: tabular-nums; }
.grow { flex: 1; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7;
  stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
.btn { height: 28px; padding: 0 11px; border: 1px solid var(--line); background: var(--panel);
  color: var(--ink2); font: inherit; font-size: 11.5px; border-radius: calc(6px * var(--r));
  cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { background: var(--hover); }

   "smart-ass/PROMPT.md": "# Clear, Concise, Actionable Communication\n\n## Purpose \n\nYou and I maintain a no-bs, clear concise, actionable relationship.\n\nEvery word we say together reinforces our clear, concise, actionable communication.\n\nWe're here to solve problems and create value, and communication reflects that.\n\nPay close attention to the details throughout `## Instructions` to maintain our great communication patterns.\n\nWhy? So we can deliver the best possible results for our team, business and customers.\n\n## Instructions\n\n### 1. Positive Patterns and Negative Patterns\n\nReplicate the `#### Positive Patterns` as behavioral references. Avoid the `#### negative Patterns`.\n\n#### Positive Patterns\n\n- I always see the last thing you write first. Place the most important information there.\n- Use plain, specific language.\n- State each fact once.\n- Match the level of detail to the level of task and request.\n- Challenge incorrect assumptions directly and explain why.\n- Optimize for clarity and engineering value, not quotability.\n- Use the simplest domain terminology that compresses information.\n- If you can communicate the idea in 1 paragraph instead of 2 without losing valuable information, do so. Same idea for 1 sentence vs 2 sentences.\n- Don't use overloaded terms that could mean more than one thing. Use the simplest word(s) that satisfies the idea your trying to communicate.\n- Clearly communicate what system you're discussing with clear headers. \n- Use our shared terminology to communicate ideas instead of using other terms or industry terms where we have them.\n- We think of work in 'Efforts'. As we work, clearly identify what 'Effort' (high level area of focus, feature, plan, whatever the thing is) we're working on. The effort should be made clear with every response you write.\n- Limit your response paragraphs to 3-4 sentences max. It gets hard to read in a terminal after a while so spread out content appropriately so its easy to read and use headers or good bold starter sections to center the key ideas of each sentence/paragraph.\n- When discussing net new work, answering questions, debating, etc - we often will restate what the other is saying so we confirm we're on the same page.\n\n#### Negative Patterns\n\n- IMPORTANT: Avoid words, and phrases in this list:\n    - \"load-bearing\"\n    - \"worth stating plainly\"\n    - \"here's the honest truth\"\n    - \"the real tension\"\n    - \"carry the argument\"\n    - \"minable\"\n    - \"invariant\"\n    - \"no-op\"\n    - \"·\"\n    - \"rung\"\n- Avoid analogies. Discuss what's right in front of us.\n- Do not over use em dashes or dash chaining.\n- Do not flatter, praise, validate, or agree without reason.\n- Do not use decorative headings, emoji, or motivate language.\n- Avoid semicolons, fragments, and non-standard punctuation.\n- Do not repeat yourself. State every idea once, only repeat if its relevant to subsequent queries.\n\n### 2. Reference Points\n\nWe use reference points to communicate quickly with each other.\n\n- Use numbered lists and markdown headings when the improve navigation.\n- When presenting three or more findings, decisions, options, risks, questions, or actions assign every one a short code.\n    - Use `D1`, `D2`, `DN` for decisions.\n    - Use `O1`, ... for options.\n    - Use `F1`, ... for findings.\n    - Use `R1`, ... for risks.\n    - Use `Q1`, ... for questions.\n    - Use `A1`, ... for actions.\n    - Use `EFF <effort>` to clearly communicate the effort we're focused on (see `## Positive Patterns`).\n    - Invent new references for sections we don't have.\n    - Preserve the same codes throughout the conversation.\n    - Do not create codes for short simple answers.\n\n### 3. Hard Operational Boundaries\n\nIn addition to clearly communicating. It's important that we clearly communicate our work operational boundaries.\n\n- Deliver only what was requested at the intended scope.\n- Do not widen work into cleanup, refactoring, documentation, or any adjacent features.\n- Do not speculate on abstractions for future requirements.\n- Do not claim completion without evidence.\n- Never add a co-author to a commit message.\n- For completed work, concisely restate it but do not overload with response detail.\n\n### 4. Aliases\n\nAliases are reminders of great communication and patterns we want to upload.\n\nWhen you see these exact aliases, expand them and act as if their expansions were given to you directly.\n\nIf these are referenced in a longer string, consider the context, they may be aliases or they maybe something else. If they are not aliases, do not expand.\n\nscr = `Simplify, compress, and repeat your response.`\neli = `Explain this like I'm 18. Simplify your language. Shorten your response.`\nfoc = `Focus on what matters most here. Whats the true signal? Whats the true value? Boil your response down into the most important thing we need to focus on.`\nref = `Rewrite your responses with reference points`\nco = `Chat Only. Do not build, change, or modify any files. Let's talk through this and get a concrete direction first`\nrp = `Re-present the information back to me so we can continue discussing with changes requested applied`\ndec = `What decisions or actions do you need answered from me to push this work forward?`\ncmiir = `Correct me if I'm wrong`\nyon = `Yes or no. Answer concisely and directly with a short explanation.`\n\n### Examples\n\nHere are concrete examples of how we DO and DO NOT communicate together. \nReplicate how we DO communicate together and avoid how we DO NOT communicate together.\n\n#### Simple Investigation\nUser: `Is legacy-config.json still referenced?`\n\nTo do:\n```text\nNo. The only match is the file itself.\n```\n\nNot to do:\n```text\nGreat question. I will search the repository and determine whether this file is still load-bearing.\nAfter a comprehensive review, the answer is no. I can also remove it and inspect adjacent files if you would like.\n```\n\n#### Engineering Recommendation\nUser: `Should we add redis to this system`\n\nTo do:\n```text\nDo not add Redis here. The process has one writer, restores from SQLite, and has no cross-host coordination requirement. \n\nRedis adds a failure domain without solving a current constraint.\n```\n\nNot to do:\n```text\nYou are absolutely right that Redis could help. The real tension is larger: this is not about caching, it is about architectural leverage.\n```\n\n#### Summarizing a blog\nUser: `Summarize the blog: <>`\n\nTo do:\n```text\nThe whole essay rests on one idea: safety comes from balance of power, not from alignment technology. Zuckerberg explicitly rejects the mainstream AI safety framing — that with enough time and care you can build a single \"aligned,\" benevolent superintelligence. \n\nHis counterargument is that humanity isn't a monoculture; any singular superintelligence would have to prioritize some people's values over others, so \"there is no such thing as a singular benevolent superintelligence.\".\n\nThe safe path, in his view, is the same one liberal democracies use: give everyone power so competing interests naturally check each other.\n```\n\nNot to do:\n```text\nHere's a breakdown of Mark Zuckerberg's \"The Future is for\nEveryone\" (Aug 10, 2026) — Meta's superintelligence manifesto.\n\nThe core thesis\n\nThree claims form the spine of the whole piece:\n\n1. Individual empowerment is the source of prosperity — progress\ncomes from the Wright brothers, Faraday, Jobs in a garage; not\nfrom institutions.\n2. Invention, not automation, is superintelligence's purpose — a\nperson can only ask so many questions per day, but the number\nof things AI can invent for you is unbounded.\n3. Balance of power is the foundation of safety — not alignment,\nnot caution. Distribution.\n\nEverything else in the document is downstream of these.\n```",

/* ── 极简 markdown ───────────────────────────────────────── */
function md(text){
  const lines=String(text).split('\n'); let out=[],list=null,fence=null,front=null;
  const closeList=()=>{if(list){out.push(`</${list}>`);list=null;}};
  const inline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  for(let i=0;i<lines.length;i++){
    const raw=lines[i];
    if(fence!==null){ if(raw.trim().startsWith('```')){out.push(`<pre><code>${esc(fence.join('\n'))}</code></pre>`);fence=null;} else fence.push(raw); continue; }
    if(raw.trim().startsWith('```')){closeList();fence=[];continue;}
    if(i===0&&raw.trim()==='---'){front=[];continue;}
    if(front!==null){ if(raw.trim()==='---'){out.push(`<div class="front">${esc(front.join('\n'))}</div>`);front=null;} else front.push(raw); continue; }
    const h=raw.match(/^(#{1,4})\s+(.*)$/); if(h){closeList();const lv=Math.min(h[1].length,3);out.push(`<h${lv}>${inline(h[2])}</h${lv}>`);continue;}
    const ul=raw.match(/^\s*[-*]\s+(.*)$/); if(ul){if(list!=='ul'){closeList();out.push('<ul>');list='ul';}out.push(`<li>${inline(ul[1])}</li>`);continue;}
    const ol=raw.match(/^\s*\d+\.\s+(.*)$/); if(ol){if(list!=='ol'){closeList();out.push('<ol>');list='ol';}out.push(`<li>${inline(ol[1])}</li>`);continue;}
    if(!raw.trim()){closeList();continue;} closeList(); out.push(`<p>${inline(raw)}</p>`);
  }
  if(fence) out.push(`<pre><code>${esc(fence.join('\n'))}</code></pre>`);
  return out.join('');
}

/* ── 树 / 列表 / 详情 ───────────────────────────────────── */
function TAB_META_DEF(){ return {skills:{title:'技能',icon:'spark'},prompts:{title:'提示词',icon:'quote'},ext:{title:'扩展',icon:'puzzle'}}; }
function treeHTML(){
  const meta=TAB_META_DEF()[S.tab];
  const icon=S.ia==='a'?meta.icon:'layers';
  const tree=S.tab==='skills'?skillsTree():S.tab==='prompts'?promptsTree():extTree();
  const kind=S.tab==='ext'?'ext':S.tab;
  const r=kind==='ext'?{dot:'warn',text:'和远端分叉',mono:short(D.exts.repo.head)}:
    D[kind].repo.dirty?{dot:'warn',text:'有未提交的改动',mono:short(D[kind].repo.head)}:{dot:'ok',text:'仓干净',mono:short(D[kind].repo.head)};
  const pend=kind==='ext'?[]:D[kind].pending;
  return `<aside class="tree">${segBlock()}
    <div class="tree-body scroll">${tree}</div>
    <div class="tree-foot">
      <div class="frow"><span class="dot ${r.dot}"></span><span>${r.text}</span><span class="head" style="margin-left:auto">${r.mono}</span></div>
      ${pend.length?`<div class="frow" style="margin-top:6px"><button class="linkbtn" data-act="noop">${pend.length} 处待发布 ›</button></div>`:''}
      ${kind==='ext'?`<div class="frow" style="margin-top:5px"><span class="mono" style="font-size:9.5px">pull 失败 · 没有上游分支</span></div>`:''}
    </div></aside>`;
}
const STATE_CHIP={on:'<span class="chip accent">启用中</span>',bad:'<span class="chip bad">加载失败</span>',
  builtin:'<span class="chip line">内置</span>',variant:'<span class="chip line">变体</span>',
  archived:'<span class="chip line">已归档</span>',off:'<span class="chip line">本机没装</span>'};
function rowHTML(kind,obj,on){
  if(kind==='skills'){const s=obj.skill||obj;return `<div class="row ${on?'on':''}" data-act="sel:${esc(s.name)}">
    <div class="av ${s.hidden||s.variant?'off':''}">${esc(s.name[0].toUpperCase())}</div><div class="main">
    <div class="nm"><span class="t mono">${esc(s.name)}</span>${s.variant?'<span class="chip bad">加载失败</span>':''}${s.hidden?'<span class="chip line">藏起来</span>':''}${!s.tracked?'<span class="chip warn">盘上有、仓里没</span>':''}</div>
    <div class="sum">${esc(s.description)}</div><div class="meta">${s.category.length?s.category.slice(0,2).map(c=>`<span class="chip">${esc(c)}</span>`).join(''):'<span class="chip">未分类</span>'}<span class="chip mono">${s.variant?esc(s.variant.branch):s.files+' 文件'}</span></div></div></div>`;}
  if(kind==='prompts'){const p=obj.prompt||obj;return `<div class="row ${on?'on':''}" data-act="sel:${esc(p.name)}">
    <div class="av">${esc(p.name[0].toUpperCase())}</div><div class="main">
    <div class="nm"><span class="t mono">${esc(p.name)}</span>${p.name===D.prompts.default?'<span class="chip accent">默认</span>':''}${!p.tracked?'<span class="chip warn">盘上有、仓里没</span>':''}</div>
    <div class="sum">${esc(p.summary||'')}</div><div class="meta">${p.category.length?p.category.slice(0,2).map(c=>`<span class="chip">${esc(c)}</span>`).join(''):'<span class="chip">未分类</span>'}<span class="chip mono">${kb(p.bytes)}</span></div></div></div>`;}
  const {ext,state,variant}=obj; return `<div class="row ${on?'on':''}" data-act="sel:${esc(ext.name)}">
    <div class="av ${state==='bad'?'off':''}">${esc(ext.name[0].toUpperCase())}</div><div class="main">
    <div class="nm"><span class="t mono">${esc(ext.name)}</span>${ext.version?`<span class="chip mono">v${esc(ext.version)}</span>`:''}${STATE_CHIP[state]}</div>
    <div class="sum">${esc(ext.summary||(ext.builtin?'引擎自带，不在仓库里':'（没有摘要）'))}</div>
    <div class="meta">${(ext.category||[])[0]?`<span class="chip">${esc(ext.category[0])}</span>`:'<span class="chip">未分类</span>'}${(ext.sections||[]).length?`<span class="chip mono">${esc(ext.sections.join(' · '))}</span>`:''}</div></div></div>`;
}
function listHTML(){
  const rows=rowsFor(); const title=S.ia==='a'?tabTitle():(S.tab==='ext'?'扩展':tabTitle());
  const body=rows.length?rows.map(r=>rowHTML(S.tab,r,selOf()===nameOf(r))).join(''):'<div class="note">这一类是空的</div>';
  return `<div class="list"><div class="list-head"><div class="list-title"><h3>${esc(title)}</h3><span class="n">${rows.length} 条</span>
    <span class="acts"><button class="btn sm pri" data-act="noop">${ic('plus')}新建</button></span></div></div>
    <div class="list-body scroll">${body}</div></div>`;
}
function detailHTML(){
  const name=selOf();
  if(S.tab==='skills'){
    const s=D.skills.items.find(x=>x.name===name); if(!s)return emptyDetail();
    const files=D.skills.files[name]||[{path:'nous.json',size:null},{path:'SKILL.md',size:null}];
    const open='SKILL.md'; const body=D.skills.text[`${name}/${open}`];
    return `<div class="detail"><div class="det-head"><div class="top"><h2 class="mono">${esc(name)}</h2>
      ${!s.tracked?'<span class="chip warn">盘上有、仓里没</span>':'<span class="chip accent">已发布</span>'}</div>
      <div class="sub"><span class="mono">skill:${esc(name)}</span><span>·</span><span>${s.category.join(' · ')||'未分类'}</span></div></div>
      <div class="det-body scroll"><div class="det-inner"><dl class="metas"><dt>摘要</dt><dd>${esc(s.description)}</dd></dl>
      <div class="sec-title">文件</div><div class="files">${files.map(f=>`<div class="file ${f.path===open?'on':''}">${ic('file')}<span class="p">${esc(f.path)}</span><span class="sz">${kb(f.size)}</span></div>`).join('')}</div>
      <div class="sec-title">${open}</div>${body?`<div class="prose">${md(body)}</div>`:'<div class="note">（demo 只内嵌了两条正文）</div>'}</div></div></div>`;
  }
  if(S.tab==='prompts'){
    const p=D.prompts.items.find(x=>x.name===name); if(!p)return emptyDetail();
    return `<div class="detail"><div class="det-head"><div class="top"><h2 class="mono">${esc(name)}</h2>
      ${p.name===D.prompts.default?'<span class="chip accent">引擎默认</span>':''}${!p.tracked?'<span class="chip warn">盘上有、仓里没</span>':''}</div>
      <div class="sub"><span class="mono">prompt:${esc(name)}</span><span>·</span><span>${kb(p.bytes)}</span></div></div>
      <div class="det-body scroll"><div class="det-inner"><div class="banner">${ic('spark')}<div><b>单值，不是集合。</b>一条会话只带一条 —— 所以列表里是单选形状。</div></div>
      <dl class="metas"><dt>摘要</dt><dd>${esc(p.summary||'')}</dd><dt>进提示词</dt><dd>正文整段进系统提示词</dd></dl>
      <div class="sec-title">PROMPT.md</div><div class="prose">${md(D.prompts.text[`${name}/PROMPT.md`]||'# '+name)}</div></div></div></div>`;
  }
  const row=extRows().find(r=>r.ext.name===name); if(!row)return emptyDetail();
  const {ext,state}=row; const core=D.exts.defaults.includes(name);
  return `<div class="detail"><div class="det-head"><div class="top"><h2 class="mono">${esc(name)}</h2>${STATE_CHIP[state]}${core?'<span class="chip line">核心</span>':''}</div>
    <div class="sub"><span class="mono">${esc(D.exts.root)}/${esc(name)}</span></div></div>
    <div class="det-body scroll"><div class="det-inner">
    ${core?`<div class="banner">${ic('lock')}<div><b>核心三条之一。</b>卸载 / 归档会被引擎 <code>403</code> 挡回来。</div></div>`:''}
    <dl class="metas"><dt>干什么</dt><dd>${esc(ext.summary||'')}</dd>
    ${(ext.sections||[]).length?`<dt>清单说</dt><dd>往系统提示词塞 <span class="mono">${esc(ext.sections.join(', '))}</span> 段</dd>`:''}
    ${D.exts.live[name]?`<dt>进程里</dt><dd>真装了 <span class="mono">${esc(D.exts.live[name].join(', '))}</span> 段 —— 对得上</dd>`:''}</dl>
    <div class="sec-title">文件</div><div class="files">${(D.exts.files[name]||[]).map(f=>`<div class="file">${ic('code')}<span class="p">${esc(f.path)}</span><span class="sz">${kb(f.size)}</span></div>`).join('')}</div>
    </div></div></div>`;
}
function emptyDetail(){return `<div class="detail"><div class="det-body"><div class="note">左边挑一条。</div></div></div>`;}

/* ── 图标条 ─────────────────────────────────────────────── */
function railHTML(){
  const items=[['chats','chat','聊天'],['templates','book','模板'],['triggers','bolt','触发器'],['res','layers','资源'],['data','db','数据']];
  return `<aside class="rail">${items.map(([id,icn,t])=>`<button class="rbtn ${id==='res'?'on':''}" title="${t}">${ic(icn)}</button>`).join('')}
    <div class="rsp"></div><button class="rbtn">${ic('menu')}</button></aside>`;
}

function render(){
  syncSel();
  const app=document.getElementById('app');
  app.innerHTML=railHTML()+`<div class="page">${treeHTML()}${listHTML()}${detailHTML()}</div>`;
  renderSide();
}
function renderSide(){
  const side=document.getElementById('side');
  const isA=S.ia==='a';
  side.innerHTML=`
    <div class="grp"><div class="lead">当前</div><h3>${isA?'02 · 三段并排':'03 · 两段 + 子开关'}</h3>
      <div style="font-size:10.5px;color:#8a9298;line-height:1.75">
      ${isA?'树顶一个药丸条，<b style="color:#e7e9ea">技能 / 提示词 / 扩展</b> 三段平级，点哪段是哪段。'
           :'树顶两个大段 <b style="color:#e7e9ea">内容 / 扩展</b>；选「内容」后下面再露出一条 <b style="color:#e7e9ea">技能 / 提示词</b> 子开关。'}</div></div>
    <div class="grp"><div class="lead">同一件事，两种走法</div>
      <div class="vs-row"><div class="k a">到技能</div><div class="t">${isA?'点 1 次（直接点「技能」）':'点 2 次（内容 → 技能）'}</div></div>
      <div class="vs-row"><div class="k a">到提示词</div><div class="t">${isA?'点 1 次':'点 2 次'}</div></div>
      <div class="vs-row"><div class="k a">到扩展</div><div class="t">${isA?'点 1 次':'点 1 次'}</div></div>
      <div class="vs-row"><div class="k b">段按钮</div><div class="t">${isA?'3 个平级，各带脏点':'2 个 + 一条子开关'}</div></div>
    </div>
    <div class="vs-card a"><div class="hd">02 的账</div>
      <p><b>好：</b>技能 / 提示词 / 扩展一视同仁，各说各的；脏点各自挂，谁坏了一眼看见。</p>
      <p><b>代价：</b>三个都是「一类资料」，段按钮上看不出「技能和提示词其实是一回事」；<b>多一段</b>就平铺一项，左栏还是一颗图标。</p></div>
    <div class="vs-card b"><div class="hd">03 的账</div>
      <p><b>好：</b>按<b>数据形状</b>分 —— 技能和提示词是同一个模子（后端两个 api 互相点名），共用一套列表 / 详情骨架，代码只写一遍。</p>
      <p><b>代价：</b>「提示词在内容里」要教一次；子开关让两段实际是三档，段按钮 + 子开关在 248px 里排得紧；到技能 / 提示词多点一下。</p></div>
    <div class="verdict"><b>要拍的板：</b>你更在意<b>「三类资料平级、一眼看清谁坏」</b>（选 02），
      还是<b>「按后端形状复用一套骨架、少写一遍代码」</b>（选 03）？<br>
      两条线的数据层完全一样（三个仓的写端点），差别只在 UI 骨架和段切换 —— 定了我就能接接口。</div>`;
}

document.addEventListener('click',(e)=>{
  const el=e.target.closest('[data-act]'); if(!el)return;
  const act=el.dataset.act;
  if(act.startsWith('cat:')){ setCat(act.slice(4)); return; }
  if(act.startsWith('seg:')){ const id=act.slice(4); S.tab=id; S.cat={}; render(); return; }
  if(act.startsWith('sel:')){ S.sel[S.tab]=act.slice(4); render(); return; }
  if(act==='noop') return;
});
function setIA(ia){ S.ia=ia; if(ia==='b'&&S.tab==='ext'){} else if(ia==='a'&&S.tab==='content'){S.tab='skills';}
  document.getElementById('sw-a').classList.toggle('on',ia==='a');
  document.getElementById('sw-b').classList.toggle('on',ia==='b');
  render(); }
document.getElementById('sw-a').addEventListener('click',()=>setIA('a'));
document.getElementById('sw-b').addEventListener('click',()=>setIA('b'));
window.addEventListener('keydown',(e)=>{ if(e.key==='1')setIA('a'); if(e.key==='2')setIA('b'); });
const scaler=document.getElementById('scaler');
function fit(){
  const st=document.querySelector('.cmp-stage');
  const s=Math.max(0.4,Math.min(1,(st.clientWidth-36)/1280,(st.clientHeight-36)/800));
  scaler.style.width=(1280*s)+'px'; scaler.style.height=(800*s)+'px';
  document.getElementById('app').style.transform='scale('+s+')';
}
window.addEventListener('resize',fit);
render(); fit();

</script>
</body>
</html>
