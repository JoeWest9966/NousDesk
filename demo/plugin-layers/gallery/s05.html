<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>05 · 详情里的迷你关系图</title><link rel="stylesheet" href="shell.css">
<style>
.mini{margin-top:12px;border-top:1px solid var(--line2);padding-top:10px;position:relative}
.mini .cols3{display:grid;grid-template-columns:1fr 116px 1fr;gap:0;align-items:center;min-height:120px}
.mini .side{display:flex;flex-direction:column;gap:4px}
.mini .side.l{align-items:flex-start}
.mini .side.r{align-items:flex-end}
.mini .node{font-family:var(--mono);font-size:10px;border:1px solid var(--line);padding:1px 6px;
  cursor:pointer;background:#000;position:relative;z-index:2}
.mini .node.lib{border-style:dashed;color:var(--dim)}
.mini .node.unl{border-color:var(--warn-dim);color:var(--warn)}
.mini .hub{border:1px solid #4a4a4a;padding:8px 6px;text-align:center;font-family:var(--mono);
  font-size:10.5px;background:#0b0b0b;position:relative;z-index:2;word-break:break-all}
.mini svg{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.mini .cap{font-size:9px;color:var(--faint);letter-spacing:.4px;margin-bottom:6px;
  display:flex;justify-content:space-between}
.mini .more{font-size:9.5px;color:var(--faint);padding-left:2px}
</style></head><body>
<script src="data.js"></script><script src="shell.js"></script>
<script>
const S = Shell;
let cur = 'sessions';
const mods = S.D.nodes.filter(n=>n.kind==='module').sort((a,b)=>b.n-a.n);
const libs = S.D.nodes.filter(n=>n.kind==='lib').sort((a,b)=>b.dependents.length-a.dependents.length);
const MAX = 6;

S.mount({no:'05', title:'详情里的迷你关系图',
  thesis:'把 0.9.41 那张「左依赖 / 中自身 / 右被依赖」的迷你图，从「只有 15 个模块」扩到库。'}, api => {

  function left(){
    return S.sec('端点模块', mods.length) + mods.map(n=>S.li(n,{extraClass:n.name===cur?'on':''})).join('')
      + S.sec('依赖层 · 库', libs.length)
      + libs.map(n=>S.li(n,{meta:`v${n.version} <span style="color:#5b5b5b">库 · 零端点</span>`, extraClass:n.name===cur?'on':''})).join('');
  }

  function mini(n){
    const deps = n.deps.slice(0,MAX), inn = n.dependents.slice(0,MAX);
    return `<div class="mini" id="mini">
      <div class="cap"><span>依赖 ${n.deps.length}</span><span>被依赖 ${n.dependents.length}</span></div>
      <div class="cols3">
        <div class="side l" id="minil">${deps.map(x=>{
          const m=S.by.get(x);
          return `<span class="node ${m.kind}" data-chip="${m.name}">${m.name}</span>`;
        }).join('')}${n.deps.length>MAX?`<span class="more">+${n.deps.length-MAX}</span>`:''}</div>
        <div class="hub">${n.name}<br><span style="color:#5b5b5b;font-size:9px">${n.kind==='lib'?'库':'模块'}</span></div>
        <div class="side r" id="minir">${inn.map(x=>{
          const m=S.by.get(x);
          return `<span class="node ${m.kind}" data-chip="${m.name}">${m.name}</span>`;
        }).join('')}${n.dependents.length>MAX?`<span class="more">+${n.dependents.length-MAX}</span>`:''}</div>
      </div>
      <svg id="minisvg"></svg></div>`;
  }

  function right(){
    const n = S.by.get(cur);
    return S.head(n) + S.ledger(n)
      + (n.kind==='lib' ? `<div class="note">库的迷你图同样画得出：它被 10 个模块依赖，就是 10 条线。</div>` : S.eps(n,6))
      + mini(n);
  }

  function wires(){
    const svg = document.getElementById('minisvg');
    if (!svg) return;
    const box = svg.getBoundingClientRect();
    const hub = svg.parentElement.querySelector('.hub').getBoundingClientRect();
    const cy = hub.top-box.top+hub.height/2;
    let s='';
    svg.parentElement.querySelectorAll('#minil .node').forEach(el=>{
      const r=el.getBoundingClientRect();
      const x=r.right-box.left, y=r.top-box.top+r.height/2;
      s+=`<path d="M${x} ${y} L ${hub.left-box.left} ${cy}" stroke="#2c2c2c" fill="none"/>`;
    });
    svg.parentElement.querySelectorAll('#minir .node').forEach(el=>{
      const r=el.getBoundingClientRect();
      const x=r.left-box.left, y=r.top-box.top+r.height/2;
      s+=`<path d="M${x} ${y} L ${hub.right-box.left} ${cy}" stroke="#2c2c2c" fill="none"/>`;
    });
    svg.innerHTML=s;
  }

  function paint(){
    api.cols.innerHTML = `<div class="list scroll">${left()}</div><div class="detail scroll">${right()}</div>`;
    requestAnimationFrame(wires);
  }
  api.onPick(name=>{ cur=name; paint(); });
  paint();
});
</script></body></html>
