<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>09 · 统计行说全 vs tab 说全</title><link rel="stylesheet" href="shell.css">
<style>
.statline .lib{color:#cfcfcf}
.statline .unl{color:var(--warn)}
.tabs .t .n.all{color:#8d8d8d}
</style></head><body>
<script src="data.js"></script><script src="shell.js"></script>
<script>
const S = Shell;
let cur = 'sessions';
const all = [...S.D.nodes].sort((a,b)=>{
  const rk = n => n.kind==='module'?0 : n.kind==='unlisted'?1 : 2;
  if (rk(a)!==rk(b)) return rk(a)-rk(b);
  return a.kind==='module' ? (b.n-a.n || a.name.localeCompare(b.name))
                           : (b.dependents.length-a.dependents.length || a.name.localeCompare(b.name));
});

S.mount({no:'09', title:'统计行说全，tab 说全',
  thesis:'不改结构，只让数字诚实：统计行补「16 库 · 1 未登记」，tab 从「插件 15」变成「插件 31」。',
  tabs:[{label:'概览',on:false},{label:'插件',n:S.D.counts.all,on:true}],
  statExtra:''}, api => {

  // 覆盖统计行文案
  const sl = document.querySelector('.statline');
  sl.innerHTML = `<span><b>${S.D.counts.all}</b> 个插件</span>
    <span class="lib"><b>${S.D.counts.modules}</b> 端点模块</span>
    <span class="lib"><b>${S.D.counts.libs}</b> 库</span>
    <span class="unl"><b>${S.D.counts.unlisted}</b> 未登记</span>
    <span><b>${S.D.counts.endpoints}</b> 端点</span>
    <span class="sp"></span>
    <span style="color:#3f3f3f">caps 的 modules 仍是 ${S.D.counts.capsModules} 个</span>`;

  function left(){
    return S.sec('全部插件', S.D.counts.all)
      + all.map(n=>{
        const meta = n.kind==='module' ? `v${n.version} <span class="on">启用</span> ${n.n} 端点`
          : n.kind==='unlisted' ? `v${n.version} <span style="color:#d9a54a">1 端点 · 未登记</span>`
          : `v${n.version} <span style="color:#5b5b5b">库 · 零端点</span>`;
        return S.li(n,{meta, extraClass:n.name===cur?'on':''});
      }).join('');
  }

  function right(){
    const n = S.by.get(cur);
    return S.head(n) + S.ledger(n) + (n.kind==='lib'
      ? `<div class="note">「15 个模块 / 165 端点」说的是契约；「31 个插件」说的是仓库。两个数都对，只是问的问题不同。</div>`
      : S.eps(n,8)) + S.rel(n);
  }

  function paint(){
    api.cols.innerHTML = `<div class="list scroll">${left()}</div><div class="detail scroll">${right()}</div>`;
  }
  api.onPick(name=>{ cur=name; paint(); });
  paint();
});
</script></body></html>
