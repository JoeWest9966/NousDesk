<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>07 · 按出品方分组</title><link rel="stylesheet" href="base.css">
<style>
body{display:flex;flex-direction:column}
.wrap{flex:1;overflow:auto;padding:4px 0 26px}
.vendor{padding:14px 24px 18px;border-bottom:1px solid var(--line2)}
.vh{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
.vh .t{font-size:14px;font-weight:600;letter-spacing:.2px}
.vh .s{font-size:10.5px;color:var(--faint)}
.vh .sp{flex:1}
.vh .c{font-family:var(--mono);font-size:11px;color:var(--dim)}
.vh .bar{width:120px;height:3px;background:var(--line2);position:relative;align-self:center}
.vh .bar i{position:absolute;inset:0 auto 0 0;background:#3a3a3a}
.vdesc{font-size:10.5px;color:var(--faint);margin:0 0 10px;max-width:820px}
.rows{display:flex;flex-direction:column;border-left:1px solid var(--line)}
.row{display:grid;grid-template-columns:190px 56px 54px 56px 1fr 64px 64px;
  gap:9px;align-items:center;padding:5px 12px;border-bottom:1px solid var(--line2);cursor:pointer}
.row:hover{background:var(--sel)}
.row.on{background:var(--sel2);border-left:2px solid #fff;margin-left:-1px}
.row .nm{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.lib .nm{color:var(--dim)}
.row.unl .nm{color:var(--warn)}
.row .pkg{font-family:var(--mono);font-size:10px;color:var(--faint);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.row .e{font-family:var(--mono);font-size:10.5px;color:var(--dim);text-align:right}
.row .d{font-family:var(--mono);font-size:10.5px;color:var(--faint);text-align:right}
.hd{display:grid;grid-template-columns:190px 56px 54px 56px 1fr 64px 64px;gap:9px;
  padding:0 12px 5px;font-size:9.5px;color:var(--faint);letter-spacing:.4px}
</style></head><body>
<div class="bar"><span class="no">07</span><b>按出品方分组</b>
  <span class="thesis">主张：插件本来就带 vendor（Nous / Data / Element / Library / AboutME），按出品方分节最接近「我装了谁家的东西」这个心智。</span>
  <span class="sp"></span><a class="back" href="index.html">← 10 套</a></div>

<div class="wrap scroll" id="wrap"></div>

<script src="data.js"></script>
<script>
const D0 = window.D;
const DESC = {
  Nous: '引擎本体与内核/平台层 —— 依赖最多，也是被依赖最多的一家。',
  Data: '数据面：归档与数据管理，两条端点模块都在这。',
  Element: '元素库相关：模型编目（Models）。',
  Library: '库与扩展监管：Skill / Extend。',
  AboutME: '自省相关：关系网本身。',
};
const byVendor = new Map();
for (const n of D0.nodes) {
  if (!byVendor.has(n.vendor)) byVendor.set(n.vendor, []);
  byVendor.get(n.vendor).push(n);
}
const wrap = document.getElementById('wrap');
const maxEp = Math.max(...D0.nodes.map(n=>n.endpoints));

for (const [v, list] of [...byVendor.entries()].sort((a,b)=>b[1].length-a[1].length)) {
  const mods = list.filter(n=>n.kind!=='lib').length;
  const libs = list.filter(n=>n.kind==='lib').length;
  const ep = list.reduce((s,n)=>s+n.endpoints,0);
  const sec = document.createElement('div');
  sec.className = 'vendor';
  sec.innerHTML = `<div class="vh"><span class="t">${v}</span>
      <span class="s">${mods} 个端点模块 · ${libs} 个库</span>
      <span class="sp"></span>
      <span class="c">${ep} 端点</span>
      <span class="bar"><i style="width:${Math.round(ep/D0.counts.endpoints*100)}%"></i></span>
    </div>
    <div class="vdesc">${DESC[v]||''}</div>
    <div class="hd"><span>模块</span><span>版本</span><span>层</span><span>类型</span>
      <span>crate</span><span style="text-align:right">依赖</span>
      <span style="text-align:right">被依赖</span></div>`;

  for (const n of list.sort((a,b)=>
      (a.kind==='lib'?1:0)-(b.kind==='lib'?1:0) || b.endpoints-a.endpoints ||
      b.dependents.length-a.dependents.length || a.name.localeCompare(b.name))) {
    const r = document.createElement('div');
    r.className = 'row ' + n.kind;
    r.innerHTML = `<span class="nm">${n.name}</span>
      <span class="pill v">${n.version}</span><span class="num">${n.layer}</span>
      <span>${n.kind==='module'?`<span class="pill mod">${n.endpoints} 端点</span>`
        :n.kind==='unlisted'?`<span class="pill unl">未登记</span>`
        :`<span class="pill lib">库</span>`}</span>
      <span class="pkg">${n.pkg}</span>
      <span class="d">${n.deps.length}</span><span class="d">${n.dependents.length}</span>`;
    r.onclick = () => {
      document.querySelectorAll('.row.on').forEach(x=>x.classList.remove('on'));
      r.classList.add('on');
    };
    sec.appendChild(r);
  }
  wrap.appendChild(sec);
}
</script></body></html>
