<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>07 · 库的详情：它被谁用</title><link rel="stylesheet" href="shell.css">
<style>
.used{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.used .u{display:flex;align-items:baseline;gap:8px;padding:4px 0;border-bottom:1px solid #111;cursor:pointer}
.used .u:hover{background:var(--sel)}
.used .u .nm{font-family:var(--mono);font-size:11px;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.used .u .l{font-size:9.5px;color:var(--faint)}
.used .u .e{font-family:var(--mono);font-size:9.5px;color:var(--dim)}
.chain{font-size:10px;color:var(--faint);margin-top:8px;line-height:1.7}
.chain b{color:var(--dim);font-weight:400;font-family:var(--mono)}
</style></head><body>
<script src="data.js"></script><script src="shell.js"></script>
<script>
const S = Shell;
let cur = 'durable';
const mods = S.D.nodes.filter(n=>n.kind==='module').sort((a,b)=>b.n-a.n);
const libs = S.D.nodes.filter(n=>n.kind==='lib').sort((a,b)=>b.dependents.length-a.dependents.length);

S.mount({no:'07', title:'库的详情：它被谁用',
  thesis:'库的详情不硬撑端点列表，改成「被这些模块使用」—— 每条带端点数，直接点进去。'}, api => {

  function left(){
    return S.sec('端点模块', mods.length) + mods.map(n=>S.li(n,{extraClass:n.name===cur?'on':''})).join('')
      + S.sec('依赖层 · 库', libs.length)
      + libs.map(n=>S.li(n,{meta:`v${n.version} <span style="color:#5b5b5b">被 ${n.dependents.length} 处依赖</span>`,
          extraClass:n.name===cur?'on':''})).join('');
  }

  function right(){
    const n = S.by.get(cur);
    const users = n.dependents.map(x=>S.by.get(x));
    return S.head(n) + S.ledger(n)
      + (n.kind==='lib' ? '' : S.eps(n,6))
      + `<div class="used"><div class="rg-cap" style="font-size:9.5px;color:#5b5b5b;letter-spacing:.4px">
           被这些模块使用 · ${users.length}</div>`
        + (users.length ? users.map(u=>`<div class="u" data-chip="${u.name}">
              <span class="nm">${u.name}</span><span class="l">${u.layer}</span>
              <span class="e">${u.kind==='module'?u.n+' ep':'库'}</span></div>`).join('')
            : '<div class="empty">没人依赖它</div>')
        + `</div>`
      + `<div class="chain">它还依赖：${n.deps.length?n.deps.map(x=>`<b>${x}</b>`).join('、'):'<span style="color:#5b5b5b">无</span>'}</div>`;
  }

  function paint(){
    api.cols.innerHTML = `<div class="list scroll">${left()}</div><div class="detail scroll">${right()}</div>`;
  }
  api.onPick(name=>{ cur=name; paint(); });
  paint();
});
</script></body></html>
