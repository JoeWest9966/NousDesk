<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>01 · 列表加一段「依赖层」</title><link rel="stylesheet" href="shell.css"></head><body>
<script src="data.js"></script><script src="shell.js"></script>
<script>
const S = Shell;
let cur = 'sessions';

const mods = S.D.nodes.filter(n=>n.kind==='module')
  .sort((a,b)=> b.n-a.n || a.name.localeCompare(b.name));
const libs = S.D.nodes.filter(n=>n.kind==='lib')
  .sort((a,b)=> b.dependents.length-a.dependents.length || a.name.localeCompare(b.name));
const unl  = S.D.nodes.filter(n=>n.kind==='unlisted');

S.mount({no:'01', title:'列表加一段「依赖层」',
  thesis:'最小改动：列表下面多一段「依赖层 16」，点进去和模块同一套详情，只是没有端点。'}, api => {

  function left(){
    return S.sec('端点模块', mods.length)
      + mods.map(n=>S.li(n,{extraClass:n.name===cur?'on':''})).join('')
      + S.sec('依赖层 · 库', libs.length)
      + libs.map(n=>S.li(n,{meta:`v${n.version} <span style="color:#5b5b5b">库 · 零端点</span>`,
          extraClass:n.name===cur?'on':''})).join('')
      + (unl.length? S.sec('未登记', unl.length)
        + unl.map(n=>S.li(n,{meta:`v${n.version} <span style="color:#d9a54a">1 端点 · 未登记</span>`,
            extraClass:n.name===cur?'on':''})).join('') : '');
  }

  function right(){
    const n = S.by.get(cur);
    return S.head(n) + S.ledger(n)
      + (n.kind==='lib'
          ? `<div class="note">库不提供端点：它只被别的模块依赖。判据 4 也禁止内核/平台层出现 <span class="mono">axum::</span> / <span class="mono">.route(</span>。</div>`
          : S.eps(n, 8))
      + S.rel(n);
  }

  function paint(){
    api.cols.innerHTML = `<div class="list scroll">${left()}</div>
      <div class="detail scroll">${right()}</div>`;
  }
  api.onPick(name=>{ cur=name; paint(); });
  paint();
});
</script></body></html>
