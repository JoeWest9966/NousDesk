<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>10 · 搜索 + 排序（目录化）</title><link rel="stylesheet" href="shell.css">
<style>
.tools{flex:none;border-bottom:1px solid var(--line2);padding:7px 12px;display:flex;flex-direction:column;gap:6px}
.srch{display:flex;align-items:center;gap:6px;border:1px solid var(--line);padding:3px 7px}
.srch i{font-style:normal;color:var(--faint);font-family:var(--mono);font-size:10px}
.srch input{flex:1;background:transparent;border:0;outline:0;color:var(--fg);font:inherit;font-size:11px}
.srch input::placeholder{color:#3f3f3f}
.sorts{display:flex;gap:5px;align-items:center;font-size:9.5px;color:var(--faint)}
.sorts button{padding:0 7px;border:1px solid transparent;background:transparent;color:var(--dim);
  font:inherit;font-size:10px;cursor:pointer}
.sorts button.on{color:#000;background:var(--fg)}
.cnt{font-family:var(--mono);font-size:9.5px;color:var(--faint);margin-left:auto}
.list{display:flex;flex-direction:column}
.list .rows{flex:1;overflow:auto}
</style></head><body>
<script src="data.js"></script><script src="shell.js"></script>
<script>
const S = Shell;
let cur = 'sessions', q = '', sort = 'ep';
const mods = S.D.nodes.filter(n=>n.kind==='module').sort((a,b)=>b.n-a.n);
const libs = S.D.nodes.filter(n=>n.kind==='lib').sort((a,b)=>b.dependents.length-a.dependents.length);

S.mount({no:'10', title:'搜索 + 排序（目录化）',
  thesis:'插件页升级成目录：搜名字/crate/出品方，按端点数或被依赖数排。31 个全在，只是要能找。'}, api => {

  function pick(){
    let xs = [...S.D.nodes];
    if (q.trim()) {
      const s = q.trim().toLowerCase();
      xs = xs.filter(n => [n.name,n.pkg,n.vendor,n.desc,n.layer]
        .some(v=>(v||'').toLowerCase().includes(s)));
    }
    const cmp = {
      ep: (a,b)=> b.n-a.n || b.dependents.length-a.dependents.length || a.name.localeCompare(b.name),
      in: (a,b)=> b.dependents.length-a.dependents.length || b.n-a.n || a.name.localeCompare(b.name),
      name: (a,b)=> a.name.localeCompare(b.name),
    }[sort];
    return xs.sort(cmp);
  }

  function left(){
    const xs = pick();
    return `<div class="tools">
        <label class="srch"><i>⌕</i><input id="q" value="${q}" placeholder="名字 / crate / 出品方 / 描述"></label>
        <div class="sorts">排序
          <button data-s="ep" class="${sort==='ep'?'on':''}">端点</button>
          <button data-s="in" class="${sort==='in'?'on':''}">被依赖</button>
          <button data-s="name" class="${sort==='name'?'on':''}">名字</button>
          <span class="cnt">${xs.length} / ${S.D.counts.all}</span>
        </div></div>
      <div class="rows scroll">${xs.map(n=>{
        const meta = n.kind==='module' ? `v${n.version} <span class="on">启用</span> ${n.n} 端点`
          : n.kind==='unlisted' ? `v${n.version} <span style="color:#d9a54a">未登记</span>`
          : `v${n.version} <span style="color:#5b5b5b">库 · ↑${n.dependents.length}</span>`;
        return S.li(n,{meta, extraClass:n.name===cur?'on':''});
      }).join('')}</div>`;
  }

  function right(){
    const n = S.by.get(cur) || pick()[0];
    if (!n) return '<div class="empty">没有匹配</div>';
    return S.head(n) + S.ledger(n) + (n.kind==='lib'
      ? `<div class="note">搜「durable」能搜到它 —— 虽然它没有端点，但它是 10 个模块的地基。</div>`
      : S.eps(n,8)) + S.rel(n);
  }

  function paint(keepFocus){
    const pos = keepFocus ? (document.getElementById('q')||{}).selectionStart : null;
    api.cols.innerHTML = `<div class="list">${left()}</div><div class="detail scroll">${right()}</div>`;
    if (keepFocus) {
      const el = document.getElementById('q');
      if (el) { el.focus(); el.setSelectionRange(pos,pos); }
    }
  }

  api.cols.addEventListener('input', e=>{
    if (e.target.id === 'q') { q = e.target.value; paint(true); }
  });
  api.cols.addEventListener('click', e=>{
    const b = e.target.closest('.sorts button');
    if (b) { sort = b.dataset.s; paint(false); }
  });
  api.onPick(name=>{ cur=name; paint(false); });
  paint(false);
});
</script></body></html>
