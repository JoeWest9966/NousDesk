<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>03 · 列表上方加筛选</title><link rel="stylesheet" href="shell.css">
<style>
.filters{flex:none;display:flex;gap:6px;padding:7px 12px;border-bottom:1px solid var(--line2)}
.filters button{padding:1px 9px;border:1px solid var(--line);background:transparent;color:var(--dim);
  font:inherit;font-size:10.5px;cursor:pointer}
.filters button.on{background:var(--sel2);color:var(--fg);border-color:#4a4a4a}
.filters button i{font-family:var(--mono);font-size:9px;font-style:normal;opacity:.6;margin-left:4px}
.cols>.list{display:flex;flex-direction:column;padding:0}
.list .rows{flex:1;overflow:auto}
</style></head><body>
<script src="data.js"></script><script src="shell.js"></script>
<script>
const S = Shell;
let cur = 'sessions', k = 'all';
const bag = S.D.counts;
const order = xs => xs.sort((a,b)=>{
  const rk = n => n.kind==='module'?0 : n.kind==='unlisted'?1 : 2;
  if (rk(a)!==rk(b)) return rk(a)-rk(b);
  return a.kind==='module' ? (b.n-a.n || a.name.localeCompare(b.name))
                           : (b.dependents.length-a.dependents.length || a.name.localeCompare(b.name));
});

S.mount({no:'03', title:'列表上方加筛选',
  thesis:'列表不动，只加一行「全部 31 / 端点模块 15 / 库 16」；库和模块共用一套卡片长相。',
  statExtra:'<span style="color:#3f3f3f">— 库存 31 个插件</span>'}, api => {

  const filters = () => `<div class="filters">
    <button data-k="all" class="${k==='all'?'on':''}">全部<i>${bag.all}</i></button>
    <button data-k="module" class="${k==='module'?'on':''}">端点模块<i>${bag.modules}</i></button>
    <button data-k="lib" class="${k==='lib'?'on':''}">库<i>${bag.libs}</i></button>
    <button data-k="unlisted" class="${k==='unlisted'?'on':''}">未登记<i>${bag.unlisted}</i></button>
  </div>`;

  function left(){
    const xs = order(S.D.nodes.filter(n=>k==='all'||n.kind===k));
    return filters() + `<div class="rows scroll">${xs.map(n=>{
      const meta = n.kind==='module' ? `v${n.version} <span class="on">状态 启用</span> ${n.n} 端点`
        : n.kind==='unlisted' ? `v${n.version} <span style="color:#d9a54a">1 端点 · 未登记</span>`
        : `v${n.version} <span style="color:#5b5b5b">库 · 零端点</span>`;
      return S.li(n,{meta, extraClass:n.name===cur?'on':''});
    }).join('')}</div>`;
  }

  function right(){
    const n = S.by.get(cur);
    return S.head(n) + S.ledger(n)
      + (n.kind==='lib' ? `<div class="note">筛选到「库」时点进来，看到的还是同一套详情 —— 只是端点这一栏写「零端点」。</div>` : S.eps(n,9))
      + S.rel(n);
  }

  function paint(){
    api.cols.innerHTML = `<div class="list">${left()}</div><div class="detail scroll">${right()}</div>`;
  }
  api.cols.addEventListener('click', e=>{
    const f = e.target.closest('.filters button');
    if (f) { k = f.dataset.k; paint(); return; }
  });
  api.onPick(name=>{ cur=name; paint(); });
  paint();
});
</script></body></html>
