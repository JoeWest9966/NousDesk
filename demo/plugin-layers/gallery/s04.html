<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>04 · 关系块改成两列表格</title><link rel="stylesheet" href="shell.css">
<style>
.rgrid{margin-top:10px;border-top:1px solid var(--line2)}
.rg-h{display:grid;grid-template-columns:1fr 68px 52px;gap:8px;padding:5px 0;font-size:9px;
  color:var(--faint);letter-spacing:.4px;border-bottom:1px solid var(--line2)}
.rg-r{display:grid;grid-template-columns:1fr 68px 52px;gap:8px;padding:3px 0;font-size:10.5px;
  border-bottom:1px solid #111;cursor:pointer}
.rg-r:hover{background:var(--sel)}
.rg-r .nm{font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rg-r .nm.lib{color:var(--dim)}
.rg-r .nm.unl{color:var(--warn)}
.rg-r .l{color:var(--faint)}
.rg-r .n{font-family:var(--mono);color:var(--dim);text-align:right}
.rg-cap{font-size:9.5px;color:var(--faint);letter-spacing:.4px;margin:10px 0 2px}
</style></head><body>
<script src="data.js"></script><script src="shell.js"></script>
<script>
const S = Shell;
let cur = 'sessions';
const mods = S.D.nodes.filter(n=>n.kind==='module').sort((a,b)=>b.n-a.n);
const libs = S.D.nodes.filter(n=>n.kind==='lib').sort((a,b)=>b.dependents.length-a.dependents.length);

S.mount({no:'04', title:'关系块改成两列表格',
  thesis:'关系别只给一排胶囊：依赖 / 被依赖 各一张表，带层和端点数，一眼看完结构。'}, api => {

  function left(){
    return S.sec('端点模块', mods.length) + mods.map(n=>S.li(n,{extraClass:n.name===cur?'on':''})).join('')
      + S.sec('依赖层 · 库', libs.length)
      + libs.map(n=>S.li(n,{meta:`v${n.version} <span style="color:#5b5b5b">库 · 零端点</span>`, extraClass:n.name===cur?'on':''})).join('');
  }

  function table(names, empty){
    if (!names.length) return `<div class="empty">${empty}</div>`;
    return `<div class="rgrid"><div class="rg-h"><span>模块</span><span>层</span><span style="text-align:right">端点</span></div>`
      + names.map(x=>{
          const n = S.by.get(x);
          return `<div class="rg-r" data-chip="${n.name}">
            <span class="nm ${n.kind}">${n.name}</span>
            <span class="l">${n.layer}</span>
            <span class="n">${n.kind==='module'?n.n:n.kind==='unlisted'?'1?':'—'}</span></div>`;
        }).join('') + `</div>`;
  }

  function right(){
    const n = S.by.get(cur);
    return S.head(n) + S.ledger(n)
      + (n.kind==='lib' ? `<div class="note">库没有端点列表；它靠「被谁用」证明自己存在。</div>` : S.eps(n,6))
      + `<div class="rg-cap">它依赖谁 · ${n.deps.length}</div>` + table(n.deps,'没声明依赖')
      + `<div class="rg-cap">谁依赖它 · ${n.dependents.length}</div>` + table(n.dependents,'没人依赖它');
  }

  function paint(){
    api.cols.innerHTML = `<div class="list scroll">${left()}</div><div class="detail scroll">${right()}</div>`;
  }
  api.onPick(name=>{ cur=name; paint(); });
  paint();
});
</script></body></html>
