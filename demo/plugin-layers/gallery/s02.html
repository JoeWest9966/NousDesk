<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>02 · 统一 31 项 + 类型徽标</title><link rel="stylesheet" href="shell.css"></head><body>
<script src="data.js"></script><script src="shell.js"></script>
<script>
const S = Shell;
let cur = 'sessions';
const all = () => [...S.D.nodes].sort((a,b)=>{
  const rk = n => n.kind==='module'?0 : n.kind==='unlisted'?1 : 2;
  if (rk(a)!==rk(b)) return rk(a)-rk(b);
  return a.kind==='module' ? (b.n-a.n || a.name.localeCompare(b.name))
                           : (b.dependents.length-a.dependents.length || a.name.localeCompare(b.name));
});

S.mount({no:'02', title:'统一 31 项 + 类型徽标',
  thesis:'不分段：31 个排一个列表，名字后面挂「库 / 未登记」小徽标，靠排序把端点模块放前面。'}, api => {

  function left(){
    return S.sec('全部插件', S.D.counts.all)
      + all().map(n=>{
          const flag = n.kind==='lib' ? '<span class="flag">库</span>'
                     : n.kind==='unlisted' ? '<span class="flag" style="color:#d9a54a;border-color:#3a2c10">未登记</span>'
                     : '';
          const meta = n.kind==='module'
            ? `v${n.version} <span class="on">状态 启用</span> ${n.n} 端点`
            : n.kind==='unlisted'
              ? `v${n.version} <span style="color:#d9a54a">1 端点 · 未登记</span>`
              : `v${n.version} <span style="color:#5b5b5b">库 · 零端点</span>`;
          return S.li(n,{flag, meta, extraClass:n.name===cur?'on':''});
        }).join('');
  }

  function right(){
    const n = S.by.get(cur);
    return S.head(n) + S.ledger(n)
      + (n.kind==='lib'
          ? `<div class="note">这是一个库：零端点。它出现在这里是因为它是插件目录的一员（有 plugin.toml、有自己的版本线），不是因为它能被调用。</div>`
          : S.eps(n, 9))
      + S.rel(n);
  }

  function paint(){
    api.cols.innerHTML = `<div class="list scroll">${left()}</div>
      <div class="detail scroll">${right()}</div>`;
  }
  api.onPick(name=>{ cur=name; paint(); });
  paint();
});
</script></body></html>
