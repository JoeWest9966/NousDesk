<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>06 · 两段可折叠</title><link rel="stylesheet" href="shell.css">
<style>
.sec{cursor:pointer;user-select:none}
.sec .tw{font-family:var(--mono);font-size:9px;color:var(--faint);margin-right:5px}
</style></head><body>
<script src="data.js"></script><script src="shell.js"></script>
<script>
const S = Shell;
let cur = 'sessions';
let openMod = true, openLib = true;
const mods = S.D.nodes.filter(n=>n.kind==='module').sort((a,b)=>b.n-a.n);
const libs = S.D.nodes.filter(n=>n.kind==='lib').sort((a,b)=>b.dependents.length-a.dependents.length);
const unl = S.D.nodes.filter(n=>n.kind==='unlisted');

S.mount({no:'06', title:'两段可折叠',
  thesis:'默认两段都展开；点标题能折叠。库多的时候不占列表 —— 但默认不藏，藏了用户就以为没有。'}, api => {

  const head = (t,n,open) => `<div class="sec" data-sec="${t}">
    <span><span class="tw">${open?'−':'+'}</span>${t}</span><span class="n">${n}</span></div>`;

  function left(){
    return head('端点模块', mods.length, openMod)
      + (openMod ? mods.map(n=>S.li(n,{extraClass:n.name===cur?'on':''})).join('') : '')
      + head('依赖层 · 库', libs.length, openLib)
      + (openLib ? libs.map(n=>S.li(n,{meta:`v${n.version} <span style="color:#5b5b5b">库 · 零端点</span>`,
          extraClass:n.name===cur?'on':''})).join('') : '')
      + (unl.length ? head('未登记', unl.length, true)
        + unl.map(n=>S.li(n,{meta:`v${n.version} <span style="color:#d9a54a">1 端点 · 未登记</span>`,
            extraClass:n.name===cur?'on':''})).join('') : '');
  }

  function right(){
    const n = S.by.get(cur);
    return S.head(n) + S.ledger(n) + (n.kind==='lib'
      ? `<div class="note">折叠只是列表的排法；详情不受影响。</div>` : S.eps(n,8)) + S.rel(n);
  }

  function paint(){
    api.cols.innerHTML = `<div class="list scroll">${left()}</div><div class="detail scroll">${right()}</div>`;
  }
  api.cols.addEventListener('click', e=>{
    const s = e.target.closest('.sec');
    if (s) {
      if (s.dataset.sec === '端点模块') openMod = !openMod;
      else if (s.dataset.sec === '依赖层 · 库') openLib = !openLib;
      paint(); return;
    }
  });
  api.onPick(name=>{ cur=name; paint(); });
  paint();
});
</script></body></html>
