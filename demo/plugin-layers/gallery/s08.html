<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>08 · 行内加 ↑被依赖 ↓依赖</title><link rel="stylesheet" href="shell.css">
<style>
.li .l2 .io{color:#777}
.li .l2 .io b{color:#d0d0d0;font-weight:400}
.li.lib .l2 .io b{color:#9a9a9a}
</style></head><body>
<script src="data.js"></script><script src="shell.js"></script>
<script>
const S = Shell;
let cur = 'sessions';
const mods = S.D.nodes.filter(n=>n.kind==='module').sort((a,b)=>b.n-a.n);
const libs = S.D.nodes.filter(n=>n.kind==='lib').sort((a,b)=>b.dependents.length-a.dependents.length);
const unl = S.D.nodes.filter(n=>n.kind==='unlisted');
const io = n => `<span class="io">↑<b>${n.dependents.length}</b> ↓<b>${n.deps.length}</b></span>`;

S.mount({no:'08', title:'行内加 ↑被依赖 ↓依赖',
  thesis:'不动结构，只给每行第二行加两个数：被几个模块用、用了几个。不点开也能扫出地基和孤岛。'}, api => {

  function left(){
    return S.sec('端点模块', mods.length)
      + mods.map(n=>S.li(n,{meta:`${io(n)} v${n.version} <span class="on">启用</span> ${n.n} 端点`,
          extraClass:n.name===cur?'on':''})).join('')
      + S.sec('依赖层 · 库', libs.length)
      + libs.map(n=>S.li(n,{meta:`${io(n)} v${n.version} <span style="color:#5b5b5b">库</span>`,
          extraClass:n.name===cur?'on':''})).join('')
      + (unl.length? S.sec('未登记', unl.length)
        + unl.map(n=>S.li(n,{meta:`${io(n)} v${n.version} <span style="color:#d9a54a">未登记</span>`,
            extraClass:n.name===cur?'on':''})).join('') : '');
  }

  function right(){
    const n = S.by.get(cur);
    return S.head(n) + S.ledger(n)
      + (n.kind==='lib' ? `<div class="note">↑${n.dependents.length} 说明有 ${n.dependents.length} 个模块依赖它 —— 这就是「为什么它值得被列出来」。</div>` : S.eps(n,8))
      + S.rel(n);
  }

  function paint(){
    api.cols.innerHTML = `<div class="list scroll">${left()}</div><div class="detail scroll">${right()}</div>`;
  }
  api.onPick(name=>{ cur=name; paint(); });
  paint();
});
</script></body></html>
