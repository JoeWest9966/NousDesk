<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>插件页 · 10 套方案（按真实页面整改）</title><link rel="stylesheet" href="shell.css">
<style>
body{display:flex;flex-direction:column}
.top{padding:22px 26px 16px;border-bottom:1px solid var(--line)}
.top h1{margin:0 0 6px;font-size:19px;font-weight:600}
.top p{margin:0;color:var(--dim);max-width:900px}
.top .nums{display:flex;gap:24px;margin-top:12px;flex-wrap:wrap;font-size:10.5px;color:var(--faint)}
.top .nums b{font-family:var(--mono);font-size:15px;color:var(--fg);font-weight:500;margin-right:5px}
.grid{flex:1;overflow:auto;padding:16px;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(390px,1fr));gap:14px}
.card{border:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;
  overflow:hidden;background:#050505}
.card:hover{border-color:#6a6a6a}
.thumb{height:300px;position:relative;overflow:hidden;background:#000;border-bottom:1px solid var(--line2)}
.thumb iframe{width:1280px;height:800px;border:0;transform:scale(.30);transform-origin:0 0;
  pointer-events:none;position:absolute;left:50%;top:0;margin-left:-141px}
.cap{padding:9px 12px;display:flex;flex-direction:column;gap:3px}
.cap .t{display:flex;align-items:baseline;gap:8px}
.cap .no{font-family:var(--mono);font-size:10px;color:var(--faint)}
.cap b{font-size:13px;font-weight:600}
.cap .s{font-size:11px;color:var(--dim);line-height:1.55}
</style></head><body>
<div class="top">
  <h1>插件页 · 10 套方案（按真实页面整改）</h1>
  <p>骨架按 j1900 <span class="mono">0.9.41</span> 真机截图量出来：窗口 940×1130、标题栏 21 / 头部 50 / 导航 217、插件页列表 292 + 详情 431，列表行是「名字 + vendor 胶囊 / 右对齐版本·状态·端点」，详情是「键值表 + 端点列表 + 关系胶囊」。</p>
  <p>问题：31 个插件里只有 15 个有端点能看见；另外 16 个库（<span class="mono">ai / durable / wire / routes…</span>）只在关系胶囊里出现，点进去是空的。</p>
  <div class="nums"><span><b>31</b>插件（plugin.toml）</span><span><b>15</b>端点模块</span>
    <span><b>16</b>库</span><span><b>1</b>有端点但没登记</span>
    <span><b>165</b>端点</span><span><b>96</b>依赖边</span></div>
</div>
<div class="grid" id="grid"></div>
<script>
const ITEMS = [
  ['s01','列表加一段「依赖层」','最小改动：列表下面多一段「依赖层 16」，点进去和模块同一套详情，只是没有端点。'],
  ['s02','统一 31 项 + 类型徽标','不分段：31 个排一个列表，名字后挂「库 / 未登记」徽标，靠排序把端点模块放前面。'],
  ['s03','列表上方加筛选','加一行「全部 31 / 端点模块 15 / 库 16 / 未登记 1」，库和模块共用同一套卡片长相。'],
  ['s04','关系块改成两列表格','关系别只给一排胶囊：依赖 / 被依赖 各一张表，带层和端点数。'],
  ['s05','详情里的迷你关系图','把 0.9.41 那张「左依赖 / 中自身 / 右被依赖」的图，从只有 15 个模块扩到库。'],
  ['s06','两段可折叠','默认两段都展开，点标题能折叠 —— 默认不藏，藏了用户就以为没有。'],
  ['s07','库的详情：它被谁用','库的详情不硬撑端点列表，改成「被这些模块使用」，每条带端点数、可点进去。'],
  ['s08','行内加 ↑被依赖 ↓依赖','不动结构，每行加两个数：被几个模块用、用了几个，不点开也能扫出地基与孤岛。'],
  ['s09','统计行说全，tab 说全','只让数字诚实：统计行补「16 库 · 1 未登记」，tab 从「插件 15」变「插件 31」。'],
  ['s10','搜索 + 排序（目录化）','升级成目录：搜名字 / crate / 出品方，按端点数或被依赖数排。31 个全在，只是要能找。'],
];
const grid = document.getElementById('grid');
for (const [id, t, s] of ITEMS) {
  const c = document.createElement('div');
  c.className = 'card';
  c.innerHTML = `<div class="thumb"><iframe src="${id}.html" scrolling="no" loading="lazy"></iframe></div>
    <div class="cap"><div class="t"><span class="no">${id.slice(1)}</span><b>${t}</b></div>
      <div class="s">${s}</div></div>`;
  c.onclick = ()=> location.href = id + '.html';
  grid.appendChild(c);
}
</script></body></html>
