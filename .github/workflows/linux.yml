name: linux

# Linux 是主线（2026-11-12，见 decisions.md）。打 tag 出包并发 Release，也可以手动触发。
# Windows 那条在 windows.yml，冻结成存档、只手动跑。
#
# 两条线：
# - **推 main**：把这次的包按提交号命名（`nousdesk-<sha8>-linux-x64.tar.gz`）挂到滚动预发布
#   `ci`，只留最近 5 份。改了界面想在一台机器上试，不用为它发版（`decisions.md` 2026-11-27）。
# - **打 tag `v*`**：正式发版，产物永久留着。

on:
  workflow_dispatch:
    inputs:
      rolling:
        description: "强制上传到滚动预发布 ci（在分支上验工作流用）"
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # gpui-pre 的 X11/Wayland 后端在**编译期**要 headers（libxkbcommon / wayland / xcb），
      # 运行期 dlopen 的 libvulkan / libEGL 不装也能编，但装了才好验。
      - name: 装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev wayland-protocols \
            libxcb1-dev libxcb-xkb-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev \
            libgl1-mesa-dev libegl1-mesa-dev libvulkan-dev \
            libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: 单测（协议层 + 应用层）
        # 应用层的测试要两个 md example 先编出来（见 坑.md），跟本机验证过的那套一致。
        run: |
          cargo build --examples -p nousdesk
          cargo test -p nous-engine
          cargo test -p nousdesk

      - name: clippy（只报告，不挡包）
        # 老文件上有一批历史告警，新的 clippy 版本还会再加；挡包只会让人习惯性加 `allow`。
        continue-on-error: true
        run: cargo clippy -p nousdesk --all-targets

      - name: 出包（tar.gz + deb）
        env:
          # 内网地址不进代码：有 secret 就写进便携包的 desktop.toml，没有就带示例文件。
          NOUS_HOST: ${{ secrets.NOUS_HOST }}
          NOUS_BOARD: ${{ vars.NOUS_BOARD || 'new1' }}
        run: scripts/package-linux.sh

      - name: 看看产出了什么
        run: ls -lh dist/*.tar.gz dist/*.deb && dpkg -I dist/*.deb

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: nousdesk-linux
          path: |
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error

      # 推 main 的产物：改名带提交号，塞进滚动预发布 `ci`。
      # deb 里的 Version 字段仍是 Cargo.toml 的版本（不改发行版号），文件名带 sha 是为了
      # 「这份装的是哪个提交」能对上；同版本 dpkg -i 覆盖装是允许的。
      - name: 按提交号命名
        if: github.ref == 'refs/heads/main' || inputs.rolling
        id: rolling
        run: |
          set -euo pipefail
          SHA=$(git rev-parse --short=8 HEAD)
          TAR=$(ls dist/*.tar.gz)
          DEB=$(ls dist/*.deb)
          OUT_TAR="nousdesk-$SHA-linux-x64.tar.gz"
          OUT_DEB="nousdesk_${SHA}_amd64.deb"
          cp "$TAR" "$OUT_TAR"
          cp "$DEB" "$OUT_DEB"
          sha256sum "$OUT_TAR" "$OUT_DEB" > "nousdesk-$SHA.sha256"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: 上传到滚动预发布 ci（推 main）
        if: github.ref == 'refs/heads/main' || inputs.rolling
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.rolling.outputs.sha }}
        run: |
          set -euo pipefail
          if ! gh release view ci >/dev/null 2>&1; then
            gh release create ci \
              --prerelease \
              --target main \
              --title "CI 构建" \
              --notes "每次推 main 覆盖上传的产物，文件名带提交号（\`git rev-parse --short=8\`）。只留最近 5 份；正式版本在 \`v*\` 的 Release 里。"
          fi
          gh release upload ci \
            "nousdesk-$SHA-linux-x64.tar.gz" \
            "nousdesk_${SHA}_amd64.deb" \
            "nousdesk-$SHA.sha256" \
            --clobber

          # 只留最近 5 份（每份 3 个文件 → 17 行以后的删掉），按上传时间排，不按 sha。
          gh release view ci --json assets \
            -q '.assets[] | "\(.createdAt)\t\(.name)"' \
            | sort -r | tail -n +17 | cut -f2 \
            | while read -r old; do
                [ -n "$old" ] && gh release delete-asset ci "$old" -y
              done

      - name: 发 Release（只有打 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.deb
          generate_release_notes: true
